            backdrop.style.display = 'flex';
            setTimeout(() => document.getElementById('newCatNameInput')?.focus(), 50);

            window.commitAddCategory = (tId) => {
                const nameVal = (document.getElementById('newCatNameInput').value || '').trim();
                const finalName = nameVal || `新選項 ${(theme.categories || []).length + 1}`;
                closeCustomModal();
                createCategoryWithData(tId, finalName, selectedIcon);
            };
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeCustomModal();
        });

        // --- 左側導航目錄樹 ---
        function renderSidebar() {
            const container = document.getElementById('navTreeContainer');
            let html = '';

            // 1. 首頁主要歡迎詞
            html += `
                <div class="nav-item-left ${currentNavId === 'root' ? 'active' : ''}" onclick="selectNav('root')">
                    <span>🌸</span>
                    <span style="font-weight:700;">首頁主要歡迎詞</span>
                </div>
            `;

            // 2. 五大諮詢主題及其子選項
            (appData.themes || []).forEach(theme => {
                const isThemeActive = currentNavId === theme.id;
                html += `
                    <div style="margin-top:12px;">
                        <div class="nav-section-label" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:6px 10px; border-radius:6px; ${isThemeActive ? 'background:#e0e7ff; color:#3730a3;' : ''}" onclick="selectNav('${theme.id}')" title="點擊進入管理此主題">
                            <span style="display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                                <span>${theme.icon || '✨'}</span>
                                <span style="font-weight:800; color:#1e1b4b;">${theme.name}</span>
                            </span>
                            <span class="nav-badge-pill" style="background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe;">${(theme.categories || []).length}個選項</span>
                        </div>
                        <div style="padding-left:6px; margin-top:2px;">
                `;

                (theme.categories || []).forEach(cat => {
                    const isActive = currentNavId === cat.id;
                    const pathCount = (cat.pathways || []).length;
                    html += `
                        <div class="nav-item-left ${isActive ? 'active' : ''}" style="padding-left:14px; font-size:12px; margin-bottom:2px;" onclick="selectNav('${cat.id}')">
                            <span style="font-size:13px;">${cat.icon || '📌'}</span>
                            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">${cat.name}</span>
                            <span class="nav-badge-pill" style="${pathCount > 0 ? 'background:#dcfce7; color:#15803d;' : 'background:#f1f5f9; color:#64748b;'}">
                                ${pathCount > 0 ? `${pathCount}條` : '未連線'}
                            </span>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            // 3. 底部快捷新增主題按鈕
            html += `
                <div style="margin-top:16px; padding:8px 4px;">
                    <button class="btn-header" style="width:100%; justify-content:center; background:#f8fafc; border:1.5px dashed #cbd5e1; color:#475569; font-size:11.5px;" onclick="openAddThemeModal()">
                        <i class="fa-solid fa-plus"></i> ➕ 新增諮詢主題
                    </button>
                </div>
            `;

            container.innerHTML = html;
        }

        function selectNav(id) {
            currentNavId = id;
            draftingPath.active = false;
            renderSidebar();
            renderWorkspace();
        }

        // --- 中間主編輯區渲染 ---
        function renderWorkspace() {
            const container = document.getElementById('workspaceContent');
            const tabsBar = document.getElementById('workspaceTabsBar');

            // 1. 首頁主要歡迎詞與主題總覽管理
            if (currentNavId === 'root') {
                tabsBar.style.display = 'none';
                let themesListHtml = (appData.themes || []).map(theme => `
                    <div class="theme-simple-row">
                        <!-- 1. 符號選擇 (點擊開啟自製符號選擇器) -->
                        <button class="simple-icon-btn" onclick="openSymbolPicker('${theme.icon || '✨'}', '變更【${theme.name}】符號', (newIcon) => updateThemeIcon('${theme.id}', newIcon))" title="點擊選擇或變更符號">
                            <span>${theme.icon || '✨'}</span>
                        </button>

                        <!-- 2. 文字 (點了直接修改) -->
                        <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
                            <input type="text" class="simple-inline-input" value="${theme.name}"
                                   oninput="updateThemeName('${theme.id}', this.value)"
                                   placeholder="請輸入主題名稱..." title="點擊直接修改主題名稱">
                            <div style="font-size:11px; color:#94a3b8; padding-left:8px;">
                                ${(theme.categories || []).length} 個子選項 · <code>${theme.id}</code>
                            </div>
                        </div>

                        <!-- 3. 進入管理主題選項按鈕 -->
                        <button class="btn-header" style="background:#4f46e5; color:#ffffff; border-color:#4f46e5; font-size:12px; font-weight:700; padding:6px 14px;" onclick="selectNav('${theme.id}')" title="進入管理此主題的選項">
                            <i class="fa-solid fa-folder-open"></i> 管理選項 (${(theme.categories || []).length}) ➔
                        </button>

                        <!-- 4. 刪除主題按鈕 (自製提示框) -->
                        <button class="btn-icon-del" onclick="confirmDeleteTheme('${theme.id}')" title="刪除此主題">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="crud-step-card" style="margin-bottom:20px;">
                        <div style="font-size:16px; font-weight:800; color:#1e1b4b; margin-bottom:10px; display:flex; align-items:center; gap:8px;">
                            <span>🌸</span> <span>首頁主要歡迎詞與引言設定</span>
                        </div>
                        <p style="font-size:12px; color:var(--text-sub); margin-bottom:10px;">
                            當客戶第一次進入 IG 對話時，機器人會立即發送這段歡迎詞，下方會自動附加主題選項按鈕：
                        </p>
                        <textarea style="width:100%; min-height:160px; padding:12px; border-radius:12px; border:1.5px solid #cbd5e1; font-size:13.5px; line-height:1.6; outline:none; font-family:inherit; transition:border-color 0.2s;"
                                  onfocus="this.style.borderColor='#7c3aed'" onblur="this.style.borderColor='#cbd5e1'"
                                  oninput="updateWelcomeMessage(this.value)">${appData.welcome_message || ''}</textarea>
                    </div>

                    <div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-size:16px; font-weight:800; color:#1e1b4b; display:flex; align-items:center; gap:8px;">
                                <span>🎯</span> <span>諮詢主題總覽與管理 (目前共 ${appData.themes.length} 個主題)</span>
                            </div>
                            <div style="font-size:11.5px; color:#64748b; margin-top:2px;">
                                點擊符號可更換、點擊文字可直接修改。點擊「管理選項」進入維護其子選項。
                            </div>
                        </div>
                        <button class="btn-header" style="background:#10b981; color:#ffffff; border-color:#10b981; font-weight:800; padding:8px 16px;" onclick="openAddThemeModal()">
                            <i class="fa-solid fa-plus"></i> ➕ 新增諮詢主題
                        </button>
                    </div>

                    <div class="themes-simplified-list">
                        ${themesListHtml}
                    </div>
                `;
                return;
            }

            // 2. 主題層級管理 (Theme Detail View)
            const theme = findTheme(currentNavId);
            if (theme) {
                tabsBar.style.display = 'none';
                let catsListHtml = (theme.categories || []).map(cat => {
                    const pathCount = (cat.pathways || []).length;
                    return `
                        <div class="option-simple-row">
                            <!-- 1. 符號選擇 (點擊開啟自製符號選擇器) -->
                            <button class="simple-icon-btn" onclick="openSymbolPicker('${cat.icon || '📌'}', '變更【${cat.name}】符號', (newIcon) => updateCategoryIcon('${cat.id}', newIcon))" title="點擊更換符號">
                                <span>${cat.icon || '📌'}</span>
                            </button>

                            <!-- 2. 文字 (點了直接修改) -->
                            <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
                                <input type="text" class="simple-inline-input" value="${cat.name}"
                                       oninput="updateCategoryName('${cat.id}', this.value)"
                                       placeholder="請輸入選項名稱..." title="點擊即可直接修改文字">
                                <div style="font-size:11px; color:#94a3b8; padding-left:8px;">
                                    ${cat.steps.length} 個診斷步驟 · ${cat.outcomes.length} 個結論方案 · ${pathCount > 0 ? `<b style="color:#15803d;">已連線 ${pathCount} 條</b>` : '<span style="color:#64748b;">未連線</span>'}
                                </div>
                            </div>

                            <!-- 3. 進入漏斗編輯按鈕 -->
                            <button class="btn-header" style="background:#4f46e5; color:#ffffff; border-color:#4f46e5; font-size:12px; font-weight:700; padding:6px 14px;" onclick="selectNav('${cat.id}')" title="進入題目與連連看編輯">
                                <i class="fa-solid fa-diagram-project"></i> 編輯 ➔
                            </button>

                            <!-- 4. 刪除選項按鈕 (自製提示框) -->
                            <button class="btn-icon-del" onclick="confirmDeleteCategory('${theme.id}', '${cat.id}')" title="刪除此選項">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                }).join('');

                container.innerHTML = `
                    <div class="breadcrumb-bar">
                        <a onclick="selectNav('root')">🏠 首頁主要歡迎詞</a>
                        <span class="sep">></span>
                        <span class="current">${theme.icon || '✨'} ${theme.name}</span>
                    </div>

                    <div class="crud-step-card" style="margin-bottom:18px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                            <div style="font-size:16px; font-weight:800; color:#1e1b4b; display:flex; align-items:center; gap:8px;">
                                <button class="simple-icon-btn" style="width:36px; height:36px; font-size:20px;" onclick="openSymbolPicker('${theme.icon || '✨'}', '修改主題符號', (newIcon) => updateThemeIcon('${theme.id}', newIcon))" title="點擊更換主題符號">
                                    <span>${theme.icon || '✨'}</span>
                                </button>
                                <input type="text" class="simple-inline-input" style="font-size:16px; font-weight:800;" value="${theme.name}" oninput="updateThemeName('${theme.id}', this.value)" title="點擊直接修改主題名稱">
                            </div>
                            <button class="btn-icon-del" onclick="confirmDeleteTheme('${theme.id}')" title="刪除此主題">
                                <i class="fa-solid fa-trash-can"></i> 刪除此主題
                            </button>
                        </div>
                        <div style="font-size:12px; color:#64748b; margin-bottom:6px;">客戶點擊此主題時，機器人發送的引導回覆文案：</div>
                        <textarea style="width:100%; min-height:75px; padding:10px; border-radius:10px; border:1.5px solid #cbd5e1; font-size:13px; line-height:1.5; outline:none; font-family:inherit;"
                                  oninput="updateThemeIntro('${theme.id}', this.value)">${theme.intro_message || ''}</textarea>
                    </div>

                    <div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-size:15px; font-weight:800; color:#1e1b4b; display:flex; align-items:center; gap:8px;">
                                <span>📋</span> <span>子選項與漏斗管理 (目前共 ${(theme.categories || []).length} 個選項)</span>
                            </div>
                            <div style="font-size:11.5px; color:#64748b; margin-top:2px;">
                                點擊符號可更換、點擊文字可直接修改。點擊「編輯漏斗」即可設定步驟題目與連連看！
                            </div>
                        </div>
                        <button class="btn-header" style="background:#10b981; color:#ffffff; border-color:#10b981; font-weight:800; padding:8px 16px;" onclick="openAddCategoryModal('${theme.id}')">
                            <i class="fa-solid fa-plus"></i> ➕ 新增選項
                        </button>
                    </div>

                    <div class="options-simplified-list">
                        ${catsListHtml}
                    </div>
                `;
                return;
            }

            // 3. 子選項漏斗編輯器 (Funnel Visual Architect)
            const found = findCategory(currentNavId);
            if (found) {
                tabsBar.style.display = 'flex';
                const cat = found.category;
                if (!cat.pathways) cat.pathways = [];

                if (currentTab === 'crud') {
                    renderCrudTab(cat);
                } else {
                    renderWiringTab(cat);
                }
                return;
            }
        }

        // ==========================================
        // 渲染 TAB 1：題目與內容編輯區 (CRUD)
        // ==========================================
        function renderCrudTab(cat) {
            const container = document.getElementById('workspaceContent');
            const found = findCategory(cat.id);
            const theme = found ? found.theme : null;

            let html = `
                <div class="breadcrumb-bar">
                    <a onclick="selectNav('root')">🏠 首頁主要歡迎詞</a>
                    <span class="sep">></span>
                    ${theme ? `<a onclick="selectNav('${theme.id}')">${theme.icon || '✨'} ${theme.name}</a><span class="sep">></span>` : ''}
                    <span class="current">${cat.icon || '📌'} ${cat.name} 漏斗題庫</span>
                </div>
                <!-- 分類名稱與引言編輯卡片 -->
                <div class="category-hero-card">
                    <div class="category-hero-header">
                        <div class="category-hero-title-group">
                            <input type="text" class="category-hero-icon" value="${cat.icon || '💍'}" onchange="updateCatIcon('${cat.id}', this.value)">
                            <input type="text" class="category-title-input" value="${cat.name}" oninput="updateCatName('${cat.id}', this.value)">
                        </div>
                    </div>
                    <div class="category-hero-intro">
                        <textarea oninput="updateCatIntro('${cat.id}', this.value)">${cat.intro_message || ''}</textarea>
                    </div>
                </div>

                <div class="crud-container">
                    <!-- 步驟動態編輯卡片清單 (支援增減與調整順序) -->
                    ${cat.steps.map((step, sIdx) => `
                        <div class="crud-step-card">
                            <div class="crud-step-header">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span class="crud-step-badge" style="background:#f1f5f9; color:#475569; font-weight:800;">
                                        <i class="fa-solid fa-list-ol"></i> 步驟 ${sIdx + 1} (${step.step_label || '問卷項目'})
                                    </span>
                                    <span style="font-size:12px; color:var(--text-sub);">${step.options.length} 個選項</span>
                                </div>
                                <div style="display:flex; align-items:center; gap:6px;">
                                    <button class="btn-step-ctrl" onclick="moveStepUp('${cat.id}', ${sIdx})" ${sIdx === 0 ? 'disabled' : ''} title="將此步驟往前調整順序">
                                        <i class="fa-solid fa-arrow-up"></i> 上移
                                    </button>
                                    <button class="btn-step-ctrl" onclick="moveStepDown('${cat.id}', ${sIdx})" ${sIdx === cat.steps.length - 1 ? 'disabled' : ''} title="將此步驟往後調整順序">
                                        <i class="fa-solid fa-arrow-down"></i> 下移
                                    </button>
                                    <button class="btn-step-ctrl btn-step-del" onclick="deleteStep('${cat.id}', ${sIdx})" ${cat.steps.length <= 1 ? 'disabled' : ''} title="刪除此步驟 (最少保留 1 步)">
                                        <i class="fa-solid fa-trash"></i> 刪除步驟
                                    </button>
                                </div>
                            </div>
                            <div style="font-size:12px; font-weight:700; color:#475569; margin-bottom:4px;">診斷題目：</div>
                            <input type="text" class="crud-step-title-input" value="${step.title}"
                                   oninput="updateStepTitle('${cat.id}', ${sIdx}, this.value)">

                            <div style="font-size:12px; font-weight:700; color:#475569; margin-bottom:6px;">選項清單：</div>
                            <div class="crud-options-list">
                                ${step.options.map((opt, optIdx) => `
                                    <div class="crud-option-row">
                                        <span class="crud-option-num">${optIdx + 1}</span>
                                        <input type="text" class="crud-option-input" value="${opt}"
                                               oninput="updateStepOption('${cat.id}', ${sIdx}, ${optIdx}, this.value)">
                                        <button class="crud-btn-del" onclick="deleteStepOption('${cat.id}', ${sIdx}, ${optIdx})" title="刪除此選項">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                            <button class="crud-btn-add" onclick="addStepOption('${cat.id}', ${sIdx})">
                                <i class="fa-solid fa-plus"></i> 新增選項
                            </button>
                        </div>
                    `).join('')}

                    <!-- ➕ 新增問卷步驟按鈕 -->
                    <div style="margin: 18px 0; text-align: center;">
                        <button class="btn-header" style="background:#eff6ff; color:#2563eb; border:1.5px dashed #60a5fa; padding:10px 22px; font-size:13px; font-weight:800; border-radius:10px; cursor:pointer;" onclick="addNewStep('${cat.id}')">
                            <i class="fa-solid fa-plus"></i> ➕ 新增問卷步驟 (目前共有 ${cat.steps.length} 個步驟)
                        </button>
                    </div>

                    <!-- 官方產品推薦結論庫編輯卡片 -->
                    <div class="crud-outcomes-card">
                        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
                            <div style="font-size:15px; font-weight:800; color:#be185d;">
                                <i class="fa-solid fa-trophy"></i> 官方產品推薦結論庫 (最後固定步驟 / 共 ${(cat.outcomes || []).length} 個方案)
                            </div>
                            <button class="btn-header" style="background:#fce7f3; color:#be185d; border-color:#fbcfe8;" onclick="addOutcome('${cat.id}')">
                                <i class="fa-solid fa-plus"></i> 新增推薦方案
                            </button>
                        </div>

                        ${(cat.outcomes || []).map((out, outIdx) => `
                            <div class="crud-outcome-item">
                                <div class="crud-outcome-header">
                                    <span style="font-size:11px; font-weight:800; color:#be185d;">方案 ${outIdx + 1}</span>
                                    <input type="text" class="crud-outcome-title-input" value="${out.title}"
                                           oninput="updateOutcomeTitle('${cat.id}', ${outIdx}, this.value)">
                                    <button class="crud-btn-del" onclick="deleteOutcome('${cat.id}', ${outIdx})" title="刪除此方案">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                                <div style="font-size:11.5px; font-weight:700; color:#6b7280;">產品推薦文案：</div>
                                <textarea class="crud-outcome-textarea" oninput="updateOutcomeRec('${cat.id}', ${outIdx}, this.value)">${out.recommendation}</textarea>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // ==========================================
        // 渲染 TAB 2：多選圈選組合連連看畫布 (Wiring Canvas)
        // ==========================================
        function renderWiringTab(cat) {
            const container = document.getElementById('workspaceContent');
            const found = findCategory(cat.id);
            const theme = found ? found.theme : null;
            const pathways = cat.pathways || [];

            let html = `
                <div class="breadcrumb-bar">
                    <a onclick="selectNav('root')">🏠 首頁主要歡迎詞</a>
                    <span class="sep">></span>
                    ${theme ? `<a onclick="selectNav('${theme.id}')">${theme.icon || '✨'} ${theme.name}</a><span class="sep">></span>` : ''}
                    <span class="current">${cat.icon || '📌'} ${cat.name} 連連看畫布</span>
                </div>
                <div class="wiring-container">
                    <!-- 路徑建構精靈橫幅 (支援單獨修改既有結論 / 新增未連線結論) -->
                    ${(() => {
                        if (draftingPath.active && draftingPath.isEditingExisting) {
                            const out = (cat.outcomes || []).find(o => o.id === draftingPath.targetOutcomeId);
                            const outIdx = (cat.outcomes || []).indexOf(out);
                            const cInfo = getOutcomeColorInfo(outIdx);
                            return `
                                <div class="path-wizard-banner" style="border-color:${cInfo.color}; background:linear-gradient(135deg, ${cInfo.bg}, #ffffff); box-shadow:0 4px 18px rgba(0,0,0,0.06);">
                                    <div style="display:flex; flex-direction:column; gap:4px;">
                                        <div style="font-size:14px; font-weight:800; color:${cInfo.color}; display:flex; align-items:center; gap:8px;">
                                            <span>✏️ 正在修改【${out ? out.title : '結論'}】的專屬連線路徑 (已單獨載入)</span>
                                        </div>
                                        <div style="font-size:11.5px; color:#475569;">
                                            💡 <b>提示：</b>畫布已<b>單獨呈現</b>此結論所連結之選項與專屬光索。您可以<b>重新勾選或取消</b>選項，修改完成請點擊<b>【💾 儲存修改】</b>才會真正生效！亦可點擊<b>【🧹 清除此連線】</b>重置。
                                        </div>
                                    </div>

                                    <div style="display:flex; align-items:center; gap:8px;">
                                        <button class="btn-header" style="background:#10b981; color:#ffffff; border-color:#10b981; font-weight:800;" onclick="commitDraftingPath()">
                                            <i class="fa-solid fa-floppy-disk"></i> 💾 儲存修改
                                        </button>
                                        <button class="btn-header" style="background:#fff1f2; color:#e11d48; border-color:#fecdd3; font-weight:700;" onclick="clearOutcomePathway('${cat.id}', '${draftingPath.targetOutcomeId}')">
                                            <i class="fa-solid fa-trash-can"></i> 🧹 清除此連線
                                        </button>
                                        <button class="btn-header" onclick="cancelDraftingPath()">
                                            <i class="fa-solid fa-xmark"></i> ✖️ 放棄修改
                                        </button>
                                    </div>
                                </div>
                            `;
                        } else if (draftingPath.active && !draftingPath.isEditingExisting) {
                            const out = draftingPath.targetOutcomeId ? (cat.outcomes || []).find(o => o.id === draftingPath.targetOutcomeId) : null;
                            return `
                                <div class="path-wizard-banner">
                                    <div style="display:flex; flex-direction:column; gap:4px;">
                                        <div style="font-size:13.5px; font-weight:800; color:#9d174d; display:flex; align-items:center; gap:8px;">
                                            <span>🎯 正在建立新組合路徑：</span>
                                            <span>${out ? `已選定目標【${out.title}】` : '請在最右側選取【尚未連線的結論】'}</span>
                                        </div>
                                        <div style="font-size:11.5px; color:#64748b;">
                                            💡 請在左側步驟點選選項或全選，並在最右側選取尚未連線的結論（已設定之結論不可重複連線，需點選該結論修改），最後點擊<b>【✨ 儲存此組合路徑】</b>！
                                        </div>
                                    </div>

                                    <div style="display:flex; align-items:center; gap:8px;">
                                        <button class="btn-header" style="background:#10b981; color:#ffffff; border-color:#10b981; font-weight:800;" onclick="commitDraftingPath()">
                                            <i class="fa-solid fa-check"></i> ✨ 儲存此組合路徑
                                        </button>
                                        <button class="btn-header" onclick="cancelDraftingPath()">取消</button>
                                    </div>
                                </div>
                            `;
                        } else {
                            return `
                                <div class="path-wizard-banner">
                                    <div style="display:flex; flex-direction:column; gap:4px;">
                                        <div style="font-size:13.5px; font-weight:800; color:#1e293b; display:flex; align-items:center; gap:8px;">
                                            <span>🎯 結論專屬路徑管理 (每個結論以專屬顏色光索呈現)</span>
                                        </div>
                                        <div style="font-size:11.5px; color:#64748b;">
                                            💡 <b>操作指南：</b>點選右側<b>已設定之結論卡片</b>，可<b>單獨檢視與修改</b>該結論的連線與選項；點選未連線結論卡片可直接為其拉線建立專屬路徑。
                                        </div>
                                    </div>

                                    <div style="display:flex; align-items:center; gap:8px;">
                                        <button class="btn-header primary" onclick="startNewDraftingPath()">
                                            <i class="fa-solid fa-plus"></i> 建立新組合路徑
                                        </button>
                                    </div>
                                </div>
                            `;
                        }
                    })()}

                    <!-- 🎨 連連看主畫布板塊 -->
                    <div class="pathway-canvas-board" id="pathwayCanvasBoard">
                        <svg class="pathway-svg-overlay" id="pathwaySvgOverlay"></svg>

                        <!-- 動態多欄水平並排網格 (動態 N 個步驟 + 固定最後一欄結論庫) -->
                        <div class="pathway-grid">
                            ${cat.steps.map((step, sIdx) => {
                                const stepId = step.id;
                                const isAll = draftingPath.active && (
                                    (draftingPath.conditions && draftingPath.conditions[stepId] === 'ALL') ||
                                    draftingPath[`s${sIdx}`] === 'ALL'
                                );
                                const curList = draftingPath.active ? (
                                    (draftingPath.conditions && Array.isArray(draftingPath.conditions[stepId])) ? draftingPath.conditions[stepId] :
                                    (Array.isArray(draftingPath[`s${sIdx}`]) ? draftingPath[`s${sIdx}`] : [])
                                ) : [];

                                const badgeColors = [
                                    { bg: '#dbeafe', color: '#1e40af' },
                                    { bg: '#cffafe', color: '#0e7490' },
                                    { bg: '#dcfce7', color: '#15803d' },
                                    { bg: '#f3e8ff', color: '#7e22ce' },
                                    { bg: '#fef3c7', color: '#b45309' },
                                    { bg: '#fee2e2', color: '#b91c1c' },
                                    { bg: '#e0e7ff', color: '#4338ca' }
                                ];
                                const bTheme = badgeColors[sIdx % badgeColors.length];

                                return `
                                    <div class="step-col-card" id="colStep-${sIdx}"
                                         onmousedown="handleMarqueeMouseDown(${sIdx}, event)">
                                        <div class="step-col-header">
                                            <span class="step-col-badge" style="background:${bTheme.bg}; color:${bTheme.color};">
                                                <i class="fa-solid fa-list-ol"></i> 步驟 ${sIdx + 1} (${step.step_label || '題目'})
                                            </span>
                                            <span style="font-size:10.5px; color:#64748b;">${step.options.length} 選項</span>
                                        </div>
                                        <button class="select-all-pill-btn ${isAll ? 'is-all-selected' : ''}"
                                                id="pillAll-${sIdx}"
                                                onmousedown="event.stopPropagation()"
                                                onclick="toggleStepAllSelection(${sIdx})">
                                            <i class="fa-solid fa-asterisk"></i> ${isAll ? `✓ 全選中 (任意步驟${sIdx + 1}皆符合)` : `🔘 全選 (任意步驟${sIdx + 1}皆符合)`}
                                        </button>
                                        <div class="step-col-qtitle">${step.title}</div>
                                        ${step.options.map((opt, optIdx) => {
                                            const isSel = curList.includes(opt);
                                            return `
                                                <div class="wiring-option-card ${isSel ? 'is-selected' : ''}"
                                                     id="node-s${sIdx}-o${optIdx}"
                                                     data-opt="${encodeURIComponent(opt)}"
                                                     onmousedown="event.stopPropagation()"
                                                     onclick="toggleOptionSelection(${sIdx}, '${encodeURIComponent(opt)}')">
                                                    <div class="wiring-checkbox">${isSel ? '✓' : ''}</div>
                                                    <span class="wiring-option-text">${opt}</span>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                `;
                            }).join('')}

                            <!-- 🏆 最終結論推薦庫 (Target Outcomes) - 始終固定在最後一欄 -->
                            <div class="step-col-card col-outcomes" id="colOutcomes">
                                <div class="step-col-header">
                                    <span class="step-col-badge" style="background:#fce7f3; color:#be185d;">
                                        <i class="fa-solid fa-trophy"></i> 推薦結論庫 (${(cat.outcomes || []).length})
                                    </span>
                                </div>
                                <div style="font-size:11px; color:#6d28d9; font-weight:700; margin-bottom:4px;">
                                    👉 點擊已設定結論可<b>單獨修改</b>；點擊未連線結論可<b>綁定新線路</b>
                                </div>
                                ${(cat.outcomes || []).map((out, outIdx) => {
                                    const colorInfo = getOutcomeColorInfo(outIdx);
                                    const existingPath = (cat.pathways || []).find(p => p.targetOutcomeId === out.id);
                                    const isConfigured = !!existingPath;
                                    const isEditingThis = draftingPath.active && draftingPath.targetOutcomeId === out.id;

                                    return `
                                        <div class="wiring-outcome-card ${isConfigured ? 'is-configured' : 'is-unlinked'} ${isEditingThis ? 'is-editing-active' : ''}"
                                             id="card-out-${out.id}"
                                             style="border-left: 5px solid ${colorInfo.color}; ${isEditingThis ? `box-shadow: 0 0 0 2.5px ${colorInfo.color}, 0 6px 20px rgba(0,0,0,0.12); background:${colorInfo.bg};` : ''}"
                                             onmousedown="event.stopPropagation()"
                                             onclick="handleOutcomeCardClick('${out.id}')">
                                            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:5px;">
                                                <span style="font-size:11.5px; font-weight:800; color:${colorInfo.color}; display:flex; align-items:center; gap:5px;">

                                                        ● 正在修改中

                                                ` : (isConfigured ? `

                                                ` : `

                                                    </span>
                                                `)}
                                            </div>
                                            <div style="font-size:11px; color:#4b5563; line-height:1.4; max-height:42px; overflow:hidden; text-overflow:ellipsis;">
                                                ${(out.recommendation || '').split(String.fromCharCode(10))[0]}
                                            </div>
                                            <div style="margin-top:6px; padding-top:4px; border-top:1px dashed #e2e8f0; font-size:10.5px; display:flex; align-items:center; justify-content:space-between;">

                                                        <i class="fa-solid fa-pen-to-square"></i> 點選單獨檢視/修改
                                                    </span>

                                        </div>

                            </div>
                        </div>
                    </div>

                    <!-- 組合路徑矩陣表格 (Pathways Matrix) -->
                    <div class="pathways-matrix-card">
                        <div class="matrix-header">

                            </div>
                            <span style="font-size:12px; color:var(--text-sub);">
                                ✨ 點擊 👁️ 可在畫布上高亮彩虹光索，右側 IG 模擬器將即時比對測試
                            </span>
                        </div>

                        ${pathways.length === 0 ? `
                            <div style="text-align:center; padding:30px; background:#f8fafc; border-radius:12px; border:1px dashed #cbd5e1; color:#64748b;">
                                <div style="font-size:24px; margin-bottom:8px;">🌱</div>
                                <div style="font-weight:700; margin-bottom:4px;">目前尚未建立任何組合路徑（預設不連結）</div>
                                <div style="font-size:12px;">請點擊上方<b>【➕ 建立新組合路徑】</b>開始圈選，右側 IG 模擬器即可直接實測！</div>
                            </div>
                        ` : `
                            <div style="overflow-x:auto;">
                                <table class="pathways-table">
                                    <thead>
                                        <tr>
                                            <th style="width:50px;">編號</th>
                                            ${cat.steps.map((s, sIdx) => `<th>步驟 ${sIdx + 1} (${s.step_label || '診斷'})</th>`).join('')}
                                            <th>🏆 產出推薦結論</th>
                                            <th style="width:90px; text-align:center;">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${pathways.map((p, pIdx) => {
                                            const out = (cat.outcomes || []).find(o => o.id === p.targetOutcomeId) || { title: '未設定方案' };
                                            return `
                                                <tr>
                                                    <td><span class="pathway-color-dot" style="background:${p.color || '#7c3aed'};"></span>#${pIdx + 1}</td>
                                                    ${cat.steps.map((s, sIdx) => {
                                                        const sel = getStepSelectionForPath(p, s, sIdx);
                                                        if (sel === 'ALL') return `<td><span class="pathway-pill-badge" style="background:#f1f5f9; color:#475569;">任意符合 (*)</span></td>`;
                                                        if (Array.isArray(sel) && sel.length > 0) {
                                                            return `<td><span class="pathway-pill-badge">${sel.join(', ')}</span></td>`;
                                                        }
                                                        return `<td><span style="color:#94a3b8;">未指定</span></td>`;
                                                    }).join('')}
                                                    <td><b style="color:#be185d;">${out.title}</b></td>
                                                    <td style="text-align:center;">
                                                        <button class="btn-action-icon" onclick="highlightPathwayOnCanvas('${p.id}')" title="在畫布高亮此光索">👁️</button>
                                                        <button class="btn-action-icon text-danger" onclick="deletePathway('${cat.id}', '${p.id}')" title="刪除此路徑">🗑️</button>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>

                    </div>

            `;

            container.innerHTML = html;

            setTimeout(renderAllPathwayWires, 100);
        }

        // ==========================================
        // 圈選與全選互動邏輯 (Selection Logic)
        // ==========================================
        function startNewDraftingPath(targetOutId = null) {
            const cat = getCat(currentNavId);
            let color = '#8b5cf6';
            if (targetOutId && cat) {
                const out = (cat.outcomes || []).find(o => o.id === targetOutId);
                const outIdx = (cat.outcomes || []).indexOf(out);
                color = getOutcomeColorInfo(outIdx).color;
            }

            draftingPath = {
                active: true,
                isEditingExisting: false,
                pathwayId: null,
                targetOutcomeId: targetOutId,
                conditions: {},
                color: color
            };
            renderWorkspace();
            showToast('🎯 已開啟路徑建構模式：點選勾選各步驟選項，最後點選未連線之結論卡！');
        }

        function cancelDraftingPath() {
            draftingPath = { active: false, isEditingExisting: false, conditions: {}, targetOutcomeId: null };
            renderWorkspace();
            showToast('已取消編輯，所有修改已還原。');
        }

        function toggleStepAllSelection(stepIdx) {
            if (!draftingPath.active) startNewDraftingPath();
            const cat = getCat(currentNavId);
            if (!cat || !cat.steps[stepIdx]) return;
            const stepId = cat.steps[stepIdx].id;
            if (!draftingPath.conditions) draftingPath.conditions = {};

            if (draftingPath.conditions[stepId] === 'ALL' || draftingPath[`s${stepIdx}`] === 'ALL') {
                draftingPath.conditions[stepId] = [];
                draftingPath[`s${stepIdx}`] = [];
            } else {
                draftingPath.conditions[stepId] = 'ALL';
                draftingPath[`s${stepIdx}`] = 'ALL';
            }
            renderWorkspace();
        }

        function toggleOptionSelection(stepIdx, encodedOpt) {
            if (!draftingPath.active) startNewDraftingPath();
            const cat = getCat(currentNavId);
            if (!cat || !cat.steps[stepIdx]) return;
            const stepId = cat.steps[stepIdx].id;
            const opt = decodeURIComponent(encodedOpt);
            if (!draftingPath.conditions) draftingPath.conditions = {};

            let currentList = draftingPath.conditions[stepId];
            if (!currentList && Array.isArray(draftingPath[`s${stepIdx}`])) {
                currentList = draftingPath[`s${stepIdx}`];
            }

            if (currentList === 'ALL' || draftingPath[`s${stepIdx}`] === 'ALL') {
                draftingPath.conditions[stepId] = [opt];
                draftingPath[`s${stepIdx}`] = [opt];
            } else {
                if (!Array.isArray(currentList)) currentList = [];
                const idx = currentList.indexOf(opt);
                if (idx > -1) {
                    currentList.splice(idx, 1);
                } else {
                    currentList.push(opt);
                }
                draftingPath.conditions[stepId] = currentList;
                draftingPath[`s${stepIdx}`] = currentList;
            }
            renderWorkspace();
        }

        function handleOutcomeCardClick(outId) {
            const cat = getCat(currentNavId);
            if (!cat) return;

            const existingPath = (cat.pathways || []).find(p => p.targetOutcomeId === outId);
            const out = (cat.outcomes || []).find(o => o.id === outId);
            const outIdx = (cat.outcomes || []).indexOf(out);
            const colorInfo = getOutcomeColorInfo(outIdx);

            if (existingPath) {
                // 已有設定好的結論：只能修改，不可重複連線！
                // 進入單獨檢視與修改模式
                draftingPath = {
                    active: true,
                    isEditingExisting: true,
                    pathwayId: existingPath.id,
                    targetOutcomeId: outId,
                    conditions: JSON.parse(JSON.stringify(existingPath.conditions || {})),
                    color: colorInfo.color
                };

                // 確保每個步驟都有初始值對應
                cat.steps.forEach((s, idx) => {
                    const val = getStepSelectionForPath(existingPath, s, idx);
                    if (draftingPath.conditions[s.id] === undefined) {
                        draftingPath.conditions[s.id] = val;
                    }
                    draftingPath[`s${idx}`] = draftingPath.conditions[s.id];
                });

                renderWorkspace();
                showToast(`🔍 已單獨載入【${out.title}】的專屬連線！可重新勾選或取消，修改完請按【儲存修改】。`);
            } else {
                // 該結論尚未設定連線
                if (draftingPath.active) {
                    // 目前處於建立模式中，將此未連線之結論指定為目標
                    draftingPath.targetOutcomeId = outId;
                    draftingPath.color = colorInfo.color;
                    renderWorkspace();
                    showToast(`已指定【${out.title}】為路徑目標！請點擊【儲存此組合路徑】完成連線。`);
                } else {
                    // 直接以該未連線結論開啟新路徑模式
                    startNewDraftingPath(outId);
                }
            }
        }

        function clearOutcomePathway(catId, outId) {
            const cat = getCat(catId);
            if (!cat) return;
            const out = (cat.outcomes || []).find(o => o.id === outId);
            const outName = out ? out.title : '此結論';

            showCustomConfirm(
                '清除連線設定',
                `確定要清除【${outName}】的連線設定嗎？\n清除後該結論將恢復為未連線狀態，需重新設定。`,
                () => {
                    if (cat.pathways) {
                        cat.pathways = cat.pathways.filter(p => p.targetOutcomeId !== outId);
                    }
                    draftingPath = { active: false, isEditingExisting: false, conditions: {}, targetOutcomeId: null };
                    saveToStorage();
                    renderSidebar();
                    renderWorkspace();
                    showToast(`🧹 已成功清除【${outName}】的連線設定！結論已恢復為未設定狀態。`);
                },
                { danger: true, confirmText: '確定清除' }
            );
        }

        function commitDraftingPath() {
            const cat = getCat(currentNavId);
            if (!cat) return;

            if (!draftingPath.targetOutcomeId) {
                showCustomAlert('提示', '請先在最右側點選一個【推薦結論】作為路徑目標！', 'warning');
                return;
            }

            if (!draftingPath.conditions) draftingPath.conditions = {};

            // 檢查是否有未選擇的步驟，未選擇者自動視為 'ALL' (任意符合)
            cat.steps.forEach((s, idx) => {
                const cur = draftingPath.conditions[s.id] || draftingPath[`s${idx}`];
                if (!cur || (Array.isArray(cur) && cur.length === 0)) {
                    draftingPath.conditions[s.id] = 'ALL';
                    draftingPath[`s${idx}`] = 'ALL';
                } else {
                    draftingPath.conditions[s.id] = cur;
                    draftingPath[`s${idx}`] = cur;
                }
            });

            const out = (cat.outcomes || []).find(o => o.id === draftingPath.targetOutcomeId);
            const outIdx = (cat.outcomes || []).indexOf(out);
            const colorInfo = getOutcomeColorInfo(outIdx);

            if (draftingPath.isEditingExisting && draftingPath.pathwayId) {
                // 修改既有路徑
                const existingPath = (cat.pathways || []).find(p => p.id === draftingPath.pathwayId);
                if (existingPath) {
                    existingPath.conditions = { ...draftingPath.conditions };
                    existingPath.color = colorInfo.color;
                    cat.steps.forEach((s, idx) => {
                        existingPath[`s${idx}`] = existingPath.conditions[s.id];
                    });
                }
                showToast(`✨ 成功儲存【${out ? out.title : '結論'}】的連線修改！`);
            } else {
                // 新增路徑 (確保不會重複綁定已存在結論)
                const conflict = (cat.pathways || []).find(p => p.targetOutcomeId === draftingPath.targetOutcomeId);
                if (conflict) {
                    showCustomAlert('不可重複連線', '該結論已被設定過，不可重複新增！請直接點選該結論進行修改。', 'warning');
                    return;
                }

                const newPath = {
                    id: `path_${Date.now()}`,
                    conditions: { ...draftingPath.conditions },
                    targetOutcomeId: draftingPath.targetOutcomeId,
                    color: colorInfo.color
                };
                cat.steps.forEach((s, idx) => {
                    newPath[`s${idx}`] = newPath.conditions[s.id];
                });
                if (!cat.pathways) cat.pathways = [];
                cat.pathways.push(newPath);
                showToast(`✨ 成功建立【${out ? out.title : '結論'}】的新組合路徑！`);
            }

            draftingPath = { active: false, isEditingExisting: false, conditions: {}, targetOutcomeId: null };
            saveToStorage();
            renderSidebar();
            renderWorkspace();
        }

        function deletePathway(catId, pathId) {
            const cat = getCat(catId);
            if (cat && cat.pathways) {
                cat.pathways = cat.pathways.filter(p => p.id !== pathId);
                saveToStorage();
                renderSidebar();
                renderWorkspace();
                showToast('已刪除該條組合路徑！');
            }
        }

        // ==========================================
        // 滑鼠拖曳拉框圈選 (Marquee Box Selection)
        // ==========================================
        function handleMarqueeMouseDown(stepIdx, e) {
            // 僅響應滑鼠左鍵，且不針對選項卡或按鈕
            if (e.button !== 0) return;
            if (e.target.closest('.wiring-option-card')) return;
            if (e.target.closest('button')) return;

            if (!draftingPath.active) startNewDraftingPath();

            const colEl = document.getElementById(`colStep-${stepIdx}`);
            if (!colEl) return;

            const colRect = colEl.getBoundingClientRect();
            const startX = e.clientX - colRect.left;
            const startY = e.clientY - colRect.top;

            let boxEl = colEl.querySelector('.marquee-selection-box');
            if (!boxEl) {
                boxEl = document.createElement('div');
                boxEl.className = 'marquee-selection-box';
                colEl.appendChild(boxEl);
            }

            boxEl.style.left = startX + 'px';
            boxEl.style.top = startY + 'px';
            boxEl.style.width = '0px';
            boxEl.style.height = '0px';
            boxEl.style.display = 'none';

            marqueeState = {
                isDown: true,
                hasMoved: false,
                startX: startX,
                startY: startY,
                clientStartX: e.clientX,
                clientStartY: e.clientY,
                stepIdx: stepIdx,
                colEl: colEl,
                boxEl: boxEl
            };
        }

        function initMarqueeGlobalListeners() {
            window.addEventListener('mousemove', (e) => {
                if (!marqueeState.isDown) return;

                const dx = Math.abs(e.clientX - marqueeState.clientStartX);
                const dy = Math.abs(e.clientY - marqueeState.clientStartY);
                if (dx > 4 || dy > 4) {
                    marqueeState.hasMoved = true;
                    marqueeState.boxEl.style.display = 'block';
                }

                if (!marqueeState.hasMoved) return;

                const colRect = marqueeState.colEl.getBoundingClientRect();
                const curX = e.clientX - colRect.left;
                const curY = e.clientY - colRect.top;

                const left = Math.min(curX, marqueeState.startX);
                const top = Math.min(curY, marqueeState.startY);
                const width = Math.abs(curX - marqueeState.startX);
                const height = Math.abs(curY - marqueeState.startY);

                marqueeState.boxEl.style.left = left + 'px';
                marqueeState.boxEl.style.top = top + 'px';
                marqueeState.boxEl.style.width = width + 'px';
                marqueeState.boxEl.style.height = height + 'px';

                // 計算選取框與各選項卡片的幾何碰撞
                const boxRect = marqueeState.boxEl.getBoundingClientRect();
                const cards = marqueeState.colEl.querySelectorAll('.wiring-option-card');
                cards.forEach(card => {
                    const cRect = card.getBoundingClientRect();
                    const isIntersect = !(boxRect.right < cRect.left ||
                                          boxRect.left > cRect.right ||
                                          boxRect.bottom < cRect.top ||
                                          boxRect.top > cRect.bottom);
                    if (isIntersect) {
                        card.classList.add('is-selected');
                    }
                });
            });

            window.addEventListener('mouseup', (e) => {
                if (!marqueeState.isDown) return;

                if (marqueeState.boxEl) {
                    marqueeState.boxEl.style.display = 'none';
                }

                if (marqueeState.hasMoved) {
                    const cards = marqueeState.colEl.querySelectorAll('.wiring-option-card');
                    const selectedOpts = [];
                    const key = `s${marqueeState.stepIdx}`;

                    cards.forEach(card => {
                        if (card.classList.contains('is-selected')) {
                            const opt = decodeURIComponent(card.getAttribute('data-opt') || '');
                            if (opt) selectedOpts.push(opt);
                        }
                    });

                    if (selectedOpts.length > 0) {
                        const cat = getCat(currentNavId);
                        if (cat && cat.steps[marqueeState.stepIdx]) {
                            const stepId = cat.steps[marqueeState.stepIdx].id;
                            if (!draftingPath.conditions) draftingPath.conditions = {};
                            draftingPath.conditions[stepId] = selectedOpts;
                        }
                        draftingPath[key] = selectedOpts;
                        showToast(`已圈選步驟 ${marqueeState.stepIdx + 1} 的 ${selectedOpts.length} 個選項！`);
                    }
                    renderWorkspace();
                }

                marqueeState.isDown = false;
                marqueeState.hasMoved = false;
            });
        }

        // ==========================================
        // SVG 細緻並聯連線繪製引擎 (Parallel Ribbon Multi-Wires)
        // 多選幾個就產生幾條線，路線相同不重疊而細緻並聯！
        // ==========================================
                function renderAllPathwayWires() {
            const board = document.getElementById('pathwayCanvasBoard');
            const svg = document.getElementById('pathwaySvgOverlay');
            if (!board || !svg) return;

            const scrollW = Math.max(board.scrollWidth, board.offsetWidth, 1500);
            const scrollH = Math.max(board.scrollHeight, board.offsetHeight, 750);
            svg.setAttribute('width', scrollW);
            svg.setAttribute('height', scrollH);
            svg.style.width = scrollW + 'px';
            svg.style.height = scrollH + 'px';
            svg.innerHTML = '';

            const boardRect = board.getBoundingClientRect();
            const cat = getCat(currentNavId);
            if (!cat || !cat.pathways) return;

            const totalPaths = cat.pathways.length + (draftingPath.active && !draftingPath.isEditingExisting ? 1 : 0);

            if (draftingPath.active && draftingPath.isEditingExisting) {
                // === 模式 1：單獨檢視與修改模式 (Solo Display Mode) ===
                // 點選已經設定好的結論時，單獨顯示這個結論所連結的線路及選項！
                cat.pathways.forEach((path, pIdx) => {
                    if (path.targetOutcomeId === draftingPath.targetOutcomeId) {
                        // 使用 draftingPath (即時勾選預覽) 繪製此結論的專屬光索
                        drawContinuousPathwayWires(svg, draftingPath, pIdx, totalPaths, cat, boardRect, false, true, 1.0);
                    } else {
                        // 其他結論之路徑暫時以微弱淡線呈現，達到單獨突顯聚焦的效果
                        drawContinuousPathwayWires(svg, path, pIdx, totalPaths, cat, boardRect, false, false, 0.05);
                    }
                });
            } else if (draftingPath.active && !draftingPath.isEditingExisting) {
                // === 模式 2：正在建立新路徑模式 ===
                cat.pathways.forEach((path, pIdx) => {
                    drawContinuousPathwayWires(svg, path, pIdx, totalPaths, cat, boardRect, false, false, 0.35);
                });
                drawContinuousPathwayWires(svg, draftingPath, cat.pathways.length, totalPaths, cat, boardRect, true, true, 1.0);
            } else {
                // === 模式 3：正常總覽模式 ===
                // 每個結論以各自專屬的顏色完整呈現各條光索！
                cat.pathways.forEach((path, pIdx) => {
                    drawContinuousPathwayWires(svg, path, pIdx, totalPaths, cat, boardRect, false, false, 0.85);
                });
            }
        }

        function getAnchorPoint(sIdx, optVal, cat, boardRect, side) {
            if (optVal === 'ALL') {
                const pill = document.getElementById(`pillAll-${sIdx}`);
                if (!pill) return null;
                const r = pill.getBoundingClientRect();
                return {
                    name: 'ALL',
                    x: (side === 'left' ? r.left : r.right) - boardRect.left,
                    y: r.top - boardRect.top + r.height / 2
                };
            } else {
                if (!cat.steps[sIdx]) return null;
                const optIdx = cat.steps[sIdx].options.indexOf(optVal);
                if (optIdx < 0) return null;
                const node = document.getElementById(`node-s${sIdx}-o${optIdx}`);
                if (!node) return null;
                const r = node.getBoundingClientRect();
                return {
                    name: optVal,
                    x: (side === 'left' ? r.left : r.right) - boardRect.left,
                    y: r.top - boardRect.top + r.height / 2
                };
            }
        }

        // 取得推薦結論卡片的目標錨點 (固定由卡片左側 left 進入)
        function getOutcomeAnchorPoint(targetOutcomeId, boardRect) {
            if (!targetOutcomeId) return null;
            const card = document.getElementById(`card-out-${targetOutcomeId}`);
            if (!card) return null;
            const r = card.getBoundingClientRect();
            return {
                name: targetOutcomeId,
                x: r.left - boardRect.left,
                y: r.top - boardRect.top + r.height / 2
            };
        }

        // 繪製貫穿全程的細緻並聯光索 (Continuous Multi-Wire Parallel Ribbon)
        // 核心規則：
        // 1. 多選 N 個選項，全程產生 N 條獨立光索 (例如多選 2 個產生 2 條線，多選 5 個產生 5 條線)。
        // 2. 當路線相同（經過相同選項或結論）時，絕不重疊，而是以 5.5px 精密間距平行並聯排列。
        // 3. 不同路徑 (pathway) 之間，亦施加專屬車道偏移 (pathShift)，保持獨立軌跡。
        function drawContinuousPathwayWires(svg, path, pIdx, totalPaths, cat, boardRect, isDrafting, isHighlighted = false, customOpacity = null) {
            if (!cat.steps || cat.steps.length === 0) return;
            const M = cat.steps.length;

            const stepChoices = [];
            for (let s = 0; s < M; s++) {
                const step = cat.steps[s];
                const val = getStepSelectionForPath(path, step, s);
                if (val === 'ALL') {
                    stepChoices.push(['ALL']);
                } else if (Array.isArray(val) && val.length > 0) {
                    stepChoices.push(val);
                } else if (isDrafting) {
                    stepChoices.push([]);
                } else {
                    stepChoices.push(['ALL']);
                }
            }

            let combinations = [[]];
            for (let s = 0; s < M; s++) {
                const choices = stepChoices[s];
                if (choices.length > 0) {
                    const next = [];
                    for (const prev of combinations) {
                        for (const c of choices) {
                            next.push([...prev, { stepIdx: s, val: c }]);
                        }
                    }
                    combinations = next;
                }
            }

            if (combinations.length === 0 || combinations[0].length === 0) return;

            const maxWires = 16;
            const activeCombos = combinations.slice(0, maxWires);
            const N = activeCombos.length;

            const pathShift = (pIdx - (totalPaths - 1) / 2) * 5.0;

            // 每個結論以專屬顏色呈現！
            let color = path.color;
            if (!color && path.targetOutcomeId) {
                const outIdx = (cat.outcomes || []).findIndex(o => o.id === path.targetOutcomeId);
                color = getOutcomeColorInfo(outIdx >= 0 ? outIdx : pIdx).color;
            }
            if (!color) color = '#8b5cf6';

            const opacity = customOpacity !== null ? customOpacity : (isHighlighted ? 1.0 : (isDrafting ? 0.9 : 0.85));

            activeCombos.forEach((combo, k) => {
                const intraOffset = N > 1 ? (k - (N - 1) / 2) * 5.5 : 0;
                const totalOffset = intraOffset + pathShift;

                for (let i = 0; i < combo.length - 1; i++) {
                    const fromNode = combo[i];
                    const toNode = combo[i + 1];

                    const ptFrom = getAnchorPoint(fromNode.stepIdx, fromNode.val, cat, boardRect, 'right');
                    const ptTo = getAnchorPoint(toNode.stepIdx, toNode.val, cat, boardRect, 'left');

                    if (ptFrom && ptTo) {
                        const fromChoicesCount = stepChoices[fromNode.stepIdx].length;
                        const srcDy = (fromChoicesCount === 1 && N > 1) ? totalOffset : 0;
                        const dstDy = totalOffset;

                        drawSingleCurvedWire(svg, ptFrom.x, ptFrom.y + srcDy, ptTo.x, ptTo.y + dstDy, color, path.id, isDrafting, opacity, path.targetOutcomeId);
                    }
                }

                if (path.targetOutcomeId && combo.length > 0) {
                    const lastNode = combo[combo.length - 1];
                    const ptLast = getAnchorPoint(lastNode.stepIdx, lastNode.val, cat, boardRect, 'right');
                    const ptOut = getOutcomeAnchorPoint(path.targetOutcomeId, boardRect);

                    if (ptLast && ptOut) {
                        const fromChoicesCount = stepChoices[lastNode.stepIdx].length;
                        const srcDy = (fromChoicesCount === 1 && N > 1) ? totalOffset : 0;
                        const dstDy = totalOffset;

                        drawSingleCurvedWire(svg, ptLast.x, ptLast.y + srcDy, ptOut.x, ptOut.y + dstDy, color, path.id, isDrafting, opacity, path.targetOutcomeId);
                    }
                }
            });
        }

        function drawSingleCurvedWire(svg, x1, y1, x2, y2, color, pathId, isDrafting = false, opacity = 0.85, outcomeId = null) {
            const dx = Math.abs(x2 - x1) * 0.45;
            const d = `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1 + dx).toFixed(1)} ${y1.toFixed(1)}, ${(x2 - dx).toFixed(1)} ${y2.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            path.setAttribute('stroke', color);
            path.style.opacity = opacity;

            if (isDrafting) {
                path.setAttribute('class', 'pathway-wire wire-drafting');
                path.setAttribute('stroke-dasharray', '6 3');
                path.style.strokeWidth = '2.8px';
            } else {
                path.setAttribute('class', `pathway-wire wire-path-${pathId}`);
                path.setAttribute('data-path', pathId);
                path.style.strokeWidth = '2.4px';
                path.onclick = () => {
                    if (outcomeId) handleOutcomeCardClick(outcomeId);
                    else highlightPathwayOnCanvas(pathId);
                };
            }

            svg.appendChild(path);
        }

        function highlightPathwayOnCanvas(pathId) {
            const wires = document.querySelectorAll('.pathway-wire');
            wires.forEach(w => {
                if (w.getAttribute('data-path') === pathId) {
                    w.classList.add('wire-active');
                } else {
                    w.classList.remove('wire-active');
                }
            });
            showToast(`已高亮顯示路徑 ${pathId} 之所有並聯光索！`);
        }

        function getStepSelectionForPath(path, step, stepIdx) {
            if (!step) return 'ALL';
            if (path.conditions && path.conditions[step.id] !== undefined) {

            }
            if (path[`s${stepIdx}`] !== undefined) {
                return path[`s${stepIdx}`];
            }
            return 'ALL';
        }

        function advanceToPhoneStep(stepIdx) {
            const cat = phoneSimState.currentCat;
            if (!cat) return;

            if (stepIdx < cat.steps.length) {
                const step = cat.steps[stepIdx];
                phoneSimState.currentStepIdx = stepIdx;

                setTimeout(() => {
                    addPhoneMsg('bot', step.title);
                    const buttons = step.options.map(opt => ({
                        label: opt,
                        action: () => handlePhoneStepAnswer(stepIdx, opt)
                    }));
                    setPhoneQuickReplies(buttons, true);
                }, 250);
            } else {
                handleFinalOutcomeDelivery();

            addPhoneMsg('user', answerText);
            phoneSimState.answers[stepIdx] = answerText;
            advanceToPhoneStep(stepIdx + 1);

        function handleFinalOutcomeDelivery() {
            const cat = phoneSimState.currentCat;
            if (!cat) return;

            setTimeout(() => {
                const pathways = cat.pathways || [];
                const ans = phoneSimState.answers;
                let matchedPath = null;

                for (const p of pathways) {
                    let isMatch = true;
                    for (let sIdx = 0; sIdx < cat.steps.length; sIdx++) {
                        const step = cat.steps[sIdx];
                        const userAns = ans[sIdx];
                        const stepSel = getStepSelectionForPath(p, step, sIdx);
                        if (stepSel === 'ALL') {
                            continue;
                        } else if (Array.isArray(stepSel) && stepSel.includes(userAns)) {
                            continue;
                        } else {
                            isMatch = false;
                            break;
                        }
                    }
                    if (isMatch) {
                        matchedPath = p;
                        break;
                    }
                }

                if (matchedPath) {
                    const out = (cat.outcomes || []).find(o => o.id === matchedPath.targetOutcomeId);
                    addPhoneMsg('bot', `✨ 感謝您的耐心回答！
系統循著您設定的組合路徑，為您計算出合適方案：`);
                    setTimeout(() => {
                        const cardHtml = `
                            <div class="recommend-card">
                                <div class="recommend-title">✨ ${out ? out.title : '專屬推薦方案'}</div>
                                <div class="recommend-body">${out ? out.recommendation : '暫無推薦內文'}</div>
                                <div style="margin-top:8px; font-size:11px; color:#7e22ce;">💌 若想進一步預約或了解細節，可直接點選下方轉接小幫手！</div>
                            </div>
                        `;
                        addPhoneMsg('bot', cardHtml, true);
                        highlightPathwayOnCanvas(matchedPath.id);
                        setPhoneQuickReplies([{ label: '🔄 再測一次其他狀況', action: () => restartPhoneDemo() }], false);
                    }, 250);
                } else {
                    const ansItemsHtml = cat.steps.map((s, idx) => `• 步驟 ${idx + 1} (${s.step_label || '題目'}): <b>${ans[idx] || '未作答'}</b>`).join('<br>');
                    const alertHtml = `
                        <div class="unlinked-alert-card">
                            <div style="font-weight:800; color:#e11d48; margin-bottom:6px;">
                                ⚠️ 尚未為此答題組合設定推薦路徑
                            </div>
                            <div style="font-size:11.5px; color:#475569; line-height:1.6;">
                                您的作答組合：<br>
                                ${ansItemsHtml}
                            </div>
                            <div style="margin-top:8px; font-size:11px; color:#7c3aed;">
                                💡 請在左側<b>【組合路徑連連看】</b>為此組合建立連線！
                            </div>
                        </div>
                    `;
                    addPhoneMsg('bot', alertHtml, true);

                    const quickButtons = [
                        {
                            label: '➕ 一鍵將此組合帶入左側畫布建立連線',
                            action: () => {
                                switchTab('wiring');
                                startNewDraftingPath();
                                cat.steps.forEach((s, idx) => {
                                    if (ans[idx]) {
                                        draftingPath.conditions[s.id] = [ans[idx]];
                                        draftingPath[`s${idx}`] = [ans[idx]];
                                    }
                                });
                                renderWorkspace();
                                showToast('已將此組合選項帶入畫布！請點選右側目標結論卡完成連線！');
                            }
                        },
                        {
                            label: '🔄 重新測試',
                            action: () => restartPhoneDemo()
                        }
                    ];
                    setPhoneQuickReplies(quickButtons, false);
                }
            }, 300);
        }

        // --- 初始化啟動 ---
        function initApp() {
            renderSidebar();
            renderWorkspace();
            restartPhoneDemo();
            initMarqueeGlobalListeners();

            window.addEventListener('resize', () => {
                if (currentTab === 'wiring') renderAllPathwayWires();
            });

            const ws = document.getElementById('workspaceScroll');
            if (ws) {
                ws.addEventListener('scroll', () => {
                    if (currentTab === 'wiring') renderAllPathwayWires();
                });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
</html>
