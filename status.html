<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>店家目前營業狀態</title>
    <script>
        // ★ 核心優化：最頂端第 0 毫秒立即發起狀態請求，不等 DOM，與頁面渲染並行
        const DEFAULT_API = "https://api.9ysong.shop";
        const ORDER_URL = "https://liff.line.me/2011657436-rGVj5SoG";
        
        let targetApi = DEFAULT_API;
        try {
            const savedUrl = localStorage.getItem('line_url');
            if (savedUrl) targetApi = savedUrl;
        } catch(e) {}
        
        const statusFetch = fetch(targetApi + '/api/status')
            .then(r => r.ok ? r.json() : Promise.reject('API Error'))
            .catch(err => {
                console.error("狀態查詢異常", err);
                return { type: 'offline', text: '斷線中' };
            });

        // 背景非同步更新 config.json（快取動態 URL，不卡死本次）
        fetch('/config.json?t=' + Date.now())
            .then(r => r.json())
            .then(cfg => { if (cfg && cfg.line_url) localStorage.setItem('line_url', cfg.line_url); })
            .catch(() => {});
    </script>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
        }
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background-color: #f4f5f7; 
            display: flex; 
            flex-direction: column; 
        }
        
        .status-section { 
            flex: 1; 
            padding: 20px; 
            box-sizing: border-box; 
            background: linear-gradient(135deg, #00B900 0%, #008a00 100%); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        .status-title { font-size: 18px; opacity: 0.9; margin-bottom: 15px; }
        .status-badge { 
            background: white; 
            color: #00B900; 
            padding: 15px 30px; 
            border-radius: 40px; 
            font-size: 28px; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .status-section.closed { background: linear-gradient(135deg, #ff3366 0%, #d81b43 100%); }
        .status-section.closed .status-badge { color: #d81b43; }
        
        .status-section.preorder { background: linear-gradient(135deg, #f39c12 0%, #d68910 100%); }
        .status-section.preorder .status-badge { color: #d68910; }
        
        .status-section.busy { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }
        .status-section.busy .status-badge { color: #2980b9; font-size: 20px; padding: 15px 25px; }
        
        .status-section.connecting { background: #ffffff; color: #333; }
        .status-section.connecting .status-title { color: #333; }
        .status-section.connecting .status-badge { background: #f0f0f0; color: #666; box-shadow: none; border: 1px solid #ddd; }
        .status-section.connecting .notice-text { color: #999; text-shadow: none; }
        
        .status-section.offline { background: linear-gradient(135deg, #2c3e50 0%, #000000 100%); }
        .status-section.offline .status-title { color: #fff; }
        .status-section.offline .status-badge { background: #111; color: #ff3366; box-shadow: 0 0 10px rgba(255,51,102,0.3); border: 1px solid #ff3366; }
        .status-section.offline .notice-text { color: #ffffff; text-shadow: none; }

        .notice-text {
            font-size: 16px; 
            margin-top: 15px; 
            text-align: center; 
            font-weight: bold; 
            line-height: 1.4; 
            color: #fff200; 
            text-shadow: 0px 1px 2px rgba(0,0,0,0.2);
        }

        .update-time {
            position: absolute;
            bottom: 15px;
            right: 15px;
            text-align: right;
            font-size: 14px;
            color: white;
            line-height: 1.4;
            opacity: 0.9;
        }
        .status-section.connecting .update-time { color: #999; }
    
        .order-btn {
            display: inline-block;
            background-color: #fff200;
            color: #d81b43;
            text-decoration: none;
            padding: 15px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 40px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            text-align: center;
            margin-top: 30px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

    </style>
</head>
<body>
    <div id="status-container" class="status-section">
        <div class="status-title">店家目前營業狀態</div>
        <div id="status-text" class="status-badge">接單中</div>
        <div class="notice-text">
            訂單請於3小時前預約<br>
            享優惠不需等待穩定用餐
        </div>
        
        <div id="action-container" style="text-align: center;">
            <a href="https://liff.line.me/2011657436-rGVj5SoG" id="order-link" class="order-btn">開始點餐</a>
        </div>

        <div class="update-time">
            <div>最後更新時間</div>
            <div id="update-time-text">--</div>
        </div>
    </div>

    <script>
        function setStatus(type, text) {
            const container = document.getElementById('status-container');
            const badge = document.getElementById('status-text');
            
            container.className = 'status-section';
            if(type === 'closed') container.classList.add('closed');
            if(type === 'preorder') container.classList.add('preorder');
            if(type === 'busy') container.classList.add('busy');
            if(type === 'connecting') container.classList.add('connecting');
            if(type === 'offline') container.classList.add('offline');
            
            badge.innerText = text;
            
            const actionContainer = document.getElementById('action-container');
            const noticeEl = document.querySelector('.notice-text');
            
            if (actionContainer) {
                if (type === 'connecting' || type === 'closed' || type === 'offline') {
                    actionContainer.style.display = (type === 'connecting') ? 'none' : 'none';
                } else {
                    actionContainer.style.display = 'block';
                }
            }
            
            if (noticeEl) {
                if (type === 'offline') {
                    noticeEl.innerHTML = '目前可能訂單較多<br>您還是可以';
                } else {
                    noticeEl.innerHTML = '訂單請於3小時前預約<br>享優惠不需等待穩定用餐';
                }
            }
            
            if (text && text.length > 10) {
                badge.style.fontSize = "20px";
                badge.style.padding = "15px 25px";
            } else {
                badge.style.fontSize = "";
                badge.style.padding = "";
            }
            
            // 更新時間顯示
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const timeEl = document.getElementById('update-time-text');
            if (timeEl) {
                timeEl.innerText = `${yyyy}-${mm}-${dd} ${hh}:${min}`;
            }
        }

        let autoTimer = null;
        let timerReady = false;
        let apiResult = null;
        let userHandled = false;

        function doRedirect() {
            if (userHandled) return;
            userHandled = true;
            window.location.href = ORDER_URL;
        }

        // 綁定手動點擊
        const btn = document.getElementById('order-link');
        if (btn) {
            btn.addEventListener('click', (e) => {
                clearTimeout(autoTimer);
                userHandled = true;
            });
        }

        // 1. 立即讀取快取秒顯狀態（預設「接單中」）
        let initialType = 'open';
        let initialText = '接單中';
        try {
            const cached = localStorage.getItem('last_store_status');
            if (cached) {
                const s = JSON.parse(cached);
                if (s && s.type && s.text) {
                    initialType = s.type;
                    initialText = s.text;
                }
            }
        } catch(e) {}
        
        setStatus(initialType, initialText);

        // 2. 僅在初始狀態為 open 時啟動 1.5 秒延遲計時
        if (initialType === 'open') {
            autoTimer = setTimeout(() => {
                timerReady = true;
                // 若 API 已經回傳且確認為 open，立即跳轉
                if (apiResult && apiResult.type === 'open') {
                    doRedirect();
                }
            }, 1500);
        }

        // 3. 處理背景早已發出的 API 請求
        statusFetch.then(data => {
            apiResult = data;
            if (data && data.type) {
                try {
                    localStorage.setItem('last_store_status', JSON.stringify(data));
                } catch(e) {}
                
                setStatus(data.type, data.text);

                // 若非接單中，立即取消跳轉，防止誤進
                if (data.type !== 'open') {
                    if (autoTimer) clearTimeout(autoTimer);
                    return;
                }

                // 若為接單中，且 1.5 秒閱讀延遲已經結束，立即執行跳轉
                if (timerReady) {
                    doRedirect();
                }
            }
        });
    </script>
</body>
</html>
