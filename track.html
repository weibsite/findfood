        // 雙向左右滑動連動同步器 (Sync deliveryStatusSlider & splitsDetailSlider)

        function setupSliderSync() {
            const topSlider = document.getElementById('deliveryStatusSlider');
            const bottomSlider = document.getElementById('splitsDetailSlider');
            const tabsContainer = document.getElementById('splitTabsContainer');
            if (!topSlider) return;

            let activeIdx = window.currentMultiOrderIndex || 0;
            let isSyncing = false;

            function updateTabs(idx) {
                activeIdx = idx;
                window.currentMultiOrderIndex = idx;
                if (window.currentMultiUuidList && window.currentMultiUuidList[idx]) {
                    window.currentMultiActiveOrderUuid = window.currentMultiUuidList[idx];
                }
                if (!tabsContainer) return;

                const tabs = tabsContainer.querySelectorAll('.tab, .split-tab-btn');
                tabs.forEach((tab, i) => {
                    const isActive = (i === idx);
                    tab.classList.toggle('active', isActive);
                    tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
                });

                const activeTab = tabs[idx];
                if (activeTab) {
                    tabsContainer.scrollTo({ left: activeTab.offsetLeft - tabsContainer.offsetLeft - 20, behavior: 'smooth' });
                }
            }

            window.scrollToSplitIndex = function(idx) {
                markSliderInteraction();
                updateTabs(idx);
                isSyncing = true;
                const topChild = topSlider.children[idx];
                if (topChild) {
                    topSlider.scrollTo({ left: topChild.offsetLeft - topSlider.offsetLeft, behavior: 'smooth' });
                }
                if (bottomSlider && bottomSlider.children[idx]) {
                    const bottomChild = bottomSlider.children[idx];
                    bottomSlider.scrollTo({ left: bottomChild.offsetLeft - bottomSlider.offsetLeft, behavior: 'smooth' });
                }
                setTimeout(() => { isSyncing = false; }, 400);
            };

            ['touchstart', 'touchmove', 'mousedown'].forEach(evName => {
                topSlider.addEventListener(evName, markSliderInteraction, { passive: true });
                if (bottomSlider) bottomSlider.addEventListener(evName, markSliderInteraction, { passive: true });
            });

            topSlider.addEventListener('scroll', () => {
                markSliderInteraction();
                if (isSyncing) return;
                const scrollLeft = topSlider.scrollLeft;
                const cardWidth = topSlider.children[0]?.offsetWidth || 1;
                const idx = Math.round(scrollLeft / cardWidth);
                if (idx !== activeIdx && idx >= 0 && idx < topSlider.children.length) {
                    activeIdx = idx;
                    window.currentMultiOrderIndex = idx;
                    updateTabs(idx);
                    if (bottomSlider && bottomSlider.children[idx]) {
                        isSyncing = true;
                        const bottomChild = bottomSlider.children[idx];
                        bottomSlider.scrollTo({ left: bottomChild.offsetLeft - bottomSlider.offsetLeft, behavior: 'smooth' });
                        setTimeout(() => { isSyncing = false; }, 400);
                    }
                }
            }, { passive: true });

            if (bottomSlider) {
                bottomSlider.addEventListener('scroll', () => {
                    markSliderInteraction();
                    if (isSyncing) return;
                    const scrollLeft = bottomSlider.scrollLeft;
                    const cardWidth = bottomSlider.children[0]?.offsetWidth || 1;
                    const idx = Math.round(scrollLeft / cardWidth);
                    if (idx !== activeIdx && idx >= 0 && idx < bottomSlider.children.length) {
                        activeIdx = idx;
                        window.currentMultiOrderIndex = idx;
                        updateTabs(idx);
                        isSyncing = true;
                        const topChild = topSlider.children[idx];
                        if (topChild) {
                            topSlider.scrollTo({ left: topChild.offsetLeft - topSlider.offsetLeft, behavior: 'smooth' });
                        }
                        setTimeout(() => { isSyncing = false; }, 400);
                    }
                }, { passive: true });
            }

            if (window.currentMultiOrderIndex > 0 && window.scrollToSplitIndex) {
                window.scrollToSplitIndex(window.currentMultiOrderIndex);
            }
        }



        // ============================================================

        // ============================================================
        // 🧩 智慧餐點對齊引擎 (Smart Alignment Engine)
        // 自動比對 Uber 回傳之 items 與文字多單段落，避免上傳順序錯亂導致卡片與外送進度錯位
        // ============================================================
        function alignSubResultsWithSplits(splits, subResults) {
            if (!splits || splits.length <= 1 || !subResults || subResults.length <= 1) {
                return subResults;
            }

            const hasAnyItems = subResults.some(r => r && Array.isArray(r.items) && r.items.length > 0);
            if (!hasAnyItems) {
                return subResults;
            }

            const cleanDish = (s) => (s || '').toLowerCase()
                .replace(/^(?:\d+[\.\、\s]*)?/, '')
                .replace(/\s*x\s*\d+.*$/i, '')
                .replace(/[\(\)\（\）\s\-_:：]/g, '')
                .replace(/(?:不要餐具|需要餐具|備註.*)/g, '')
                .trim();

            const calcScore = (split, subRes) => {
                if (!subRes || !subRes.items || subRes.items.length === 0) return 0;
                const sItems = (split.items || []).map(it => typeof it === 'string' ? it : (it.name || it.title || '')).filter(Boolean);
                const sClean = sItems.map(cleanDish).filter(Boolean);
                const uItems = (subRes.items || []).map(it => it.title || it.name || '').filter(Boolean);
                const uClean = uItems.map(cleanDish).filter(Boolean);
                if (sClean.length === 0 || uClean.length === 0) return 0;

                let matched = 0;
                for (const sc of sClean) {
                    for (const uc of uClean) {
                        if (sc === uc || (sc.length >= 3 && uc.length >= 3 && (sc.includes(uc) || uc.includes(sc)))) {
                            matched++;
                            break;
                        }
                    }
                }

                let score = (matched / Math.max(sClean.length, uClean.length)) * 100;
                if (sClean.length === uClean.length && matched === sClean.length) {
                    score += 20;
                }

                const sHasAddNoodle = sItems.some(it => it.includes('加麵'));
                const uHasAddNoodle = (subRes.items || []).some(it => (it.subtitle || '').includes('加麵'));
                if (sHasAddNoodle && uHasAddNoodle) {
                    score += 25;
                } else if (!sHasAddNoodle && !uHasAddNoodle) {
                    score += 15;
                } else if (sHasAddNoodle !== uHasAddNoodle) {
                    score -= 30;
                }

                return score;
            };

            const candidates = [];
            splits.forEach((split, sIdx) => {
                subResults.forEach((subRes, uIdx) => {
                    const score = calcScore(split, subRes);
                    candidates.push({ sIdx, uIdx, score });
                });
            });
            candidates.sort((a, b) => b.score - a.score);

            const aligned = new Array(splits.length).fill(null);
            const usedSub = new Set();
            const usedSplit = new Set();

            for (const cand of candidates) {
                if (!usedSplit.has(cand.sIdx) && !usedSub.has(cand.uIdx) && cand.score >= 30) {
                    aligned[cand.sIdx] = subResults[cand.uIdx];
                    usedSplit.add(cand.sIdx);
                    usedSub.add(cand.uIdx);
                }
            }

            let uPtr = 0;
            for (let s = 0; s < aligned.length; s++) {
                if (!aligned[s]) {
                    while (usedSub.has(uPtr) && uPtr < subResults.length) uPtr++;
                    if (uPtr < subResults.length) {
                        aligned[s] = subResults[uPtr];
                        usedSub.add(uPtr);
                    } else {
                        aligned[s] = subResults[s] || {};
                    }
                }
            }
            return aligned;
        }

                const u = isSwitched ? cand.uuid : (extractOrderUuid(rawItem) || meta._origUuid || (rawItem.startsWith('http') ? '' : rawItem));
                const cached = u ? window._FRONTEND_SUB_CACHE[u] : null;
                if (u && !(cached && cached.isDelivered && !cached.isCanceled)) {
                    batchTargetUuids.push(u);
                }
            });
            const batchActiveMap = (batchTargetUuids.length > 1)
                ? await fetchActiveOrdersBatch(batchTargetUuids, window.trackApiBase)
                : null;

            // 同步獲取各單最新狀態 (進行中 active 優先、送達與取消自動辨識，並保護已切換候選卡片)
            const subResults = await Promise.all(uuidList.map(async (item, idx) => {
                const meta = slotMetaList[idx];
                const swState = window._cardSwitchState && window._cardSwitchState[meta._slotKey];
                const isSwitched = Boolean(swState && swState.cursor >= 0 && swState.candidates && swState.candidates[swState.cursor]);
                const cand = isSwitched ? swState.candidates[swState.cursor] : null;

                const rawItem = (item || '').trim();
                const u = isSwitched ? cand.uuid : (extractOrderUuid(rawItem) || meta._origUuid || (rawItem.startsWith('http') ? '' : rawItem));
                const url = isSwitched
                    ? `https://www.ubereats.com/tw/orders/${cand.uuid}`
                    : ((!rawItem) ? '' : (rawItem.startsWith('http') ? rawItem : (u ? `https://www.ubereats.com/tw/orders/${u}` : '')));

                const prefetched = (batchActiveMap && u && batchActiveMap[u]) ? batchActiveMap[u] : null;
                let res = await getSubOrderStatus(u, url, window.trackApiBase, prefetched);
                if (!isSwitched && meta._origSubCanceled) {
                    if (!res.isDelivered && res.status !== 'concluded' && res.orderPhase !== 'COMPLETED') {
                        res.isCanceled = true;
                        res.status = 'canceled';
                    }
                }
                if (isSwitched) {
                    res = _applyCandMergeToSubResult(res, cand);
                    swState.activeCandData = res;
                } else {
                    if (!res.pinCode && meta._origPinCode) res.pinCode = meta._origPinCode;
                    const slotSt = _ensureSwitchSlotState(meta._slotKey, {
                        origIndex: meta._origIndex,
                        orderId: curOrderIdForSwitch,
                        origUuid: meta._origUuid || u,
                        expectedStore: meta._origExpectedStore,
                        uberStoreName: _extractSwitchUberStore(res),
                        hint: meta._origHint,
                        origSnapshot: { ...res, url, orderUuid: u || '', _slotKey: meta._slotKey },
                    });
                }
                return { ...res, url, idx, orderUuid: u || '', _slotKey: meta._slotKey };
            }));

            // 智慧輪詢間隔：若全部子單皆為預約排程單，自動放寬為 60 秒輪詢，大幅減少無效請求
            try {
                const allScheduledSub = subResults.length > 0 && subResults.every(r => r && (r.isScheduled === true || r.status === 'scheduled'));
                window._preferredRefreshIntervalSec = allScheduledSub ? 60 : 15;
            } catch (_e) {}

            // 組合多單各項關聯資料 (safeParsedData 與 safeRawData)
            const safeParsedData = parsedData ? JSON.parse(JSON.stringify(parsedData)) : {
                isSplit: true,
                address: rawData?.address || (subResults.find(r => r.destination?.address)?.destination?.address) || '指定外送地址',
                splits: uuidList.map((u, i) => {
                    const r = subResults[i] || {};
                    const storeName = r.storeName || (r.store && r.store.name) || `店家 ${i + 1}`;
                    return {
                        title: `【多單 ${i + 1}】`,
                        store: storeName,
                        items: [],
                        fees: [],
                        subtotal: '',
                        discount: '',
                        total: r.total || ''
                    };
                })
            };

            const safeRawData = rawData ? JSON.parse(JSON.stringify(rawData)) : {
                status: 'success',
                text: '',
                ext_order_ids: []
            };

            // 🧩 永久餐點對齊機制：
            // 若後端已標記 alignment_verified === true，代表 orders.json 已永久校正完畢，直接略過比對計算！
            // 若尚未驗證且 Uber 回傳有效餐點 items，執行一次性對齊並靜默呼叫 /api/persist_order_alignment 永久寫回後端
            const alreadyAlignedInDb = Boolean(
                (rawData && rawData.alignment_verified === true) ||
                (window.lastTrackData && window.lastTrackData.alignment_verified === true)
            );
            const hasRealUberItems = subResults.some(r => r && Array.isArray(r.items) && r.items.length > 0);
            const alignedSubResults = alreadyAlignedInDb
                ? subResults
                : alignSubResultsWithSplits(safeParsedData.splits, subResults);

            safeRawData.tracking_urls = alignedSubResults.map(r => r ? (r.url || '') : '');
            if (window.lastTrackData) window.lastTrackData.tracking_urls = safeRawData.tracking_urls;

            if (!alreadyAlignedInDb && hasRealUberItems && safeParsedData.splits && safeParsedData.splits.length > 1) {
                const persistOid = _resolveCurrentTrackOrderId();
                const persistUrls = alignedSubResults.map(r => r ? (r.url || '') : '').filter(Boolean);
                const persistKey = `${persistOid}::${persistUrls.join(',')}`;
                window._persistedAlignmentKeys = window._persistedAlignmentKeys || new Set();
                if (persistOid && !persistOid.includes(',') && persistUrls.length >= 2 && !window._persistedAlignmentKeys.has(persistKey)) {
                    window._persistedAlignmentKeys.add(persistKey);
                    const persistEndpoints = resolveApiEndpoints('/api/persist_order_alignment', window.trackApiBase);
                    if (persistEndpoints.length > 0) {
                        fetch(persistEndpoints[0], {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ orderId: persistOid, alignedUrls: persistUrls })
                        }).then(r => r.ok ? r.json() : null).then(resJson => {
                            if (resJson && resJson.status === 'success') {
                                if (window.lastTrackData) window.lastTrackData.alignment_verified = true;
                                window.currentMultiUuidList = persistUrls;
                                console.log('✅ 已將多單餐點對齊順序永久寫回系統 (orders.json)，下次開啟免再重新對齊！');
                            }
                        }).catch(() => {});
                    }
                }
            }

            const itemCount = Math.max(uuidList.length, trackingUrls.length, alignedSubResults.length, (safeParsedData.splits || []).length);
            const combinedList = [];
            for (let i = 0; i < itemCount; i++) {
                const meta = slotMetaList[i] || { _slotKey: 'sub_' + i, _origIndex: i, _origUuid: '', _origExpectedStore: '', _origPinCode: '', _origHint: null, _origExtOrderId: '', _origSubCanceled: false };
                const existingSplit = (safeParsedData.splits && safeParsedData.splits[i]) ? safeParsedData.splits[i] : null;
                const sr = alignedSubResults[i] || {};
                const storeFallback = _pickPreferredStoreName({
                    uberStore: _extractSwitchUberStore(sr),
                    orderStore: sr._cand?.orderStoreName || '',
                    fallbackStore: (sr.store && sr.store.name) || meta._origExpectedStore || `店家 ${i + 1}`
                });
                const splitObj = existingSplit ? { ...existingSplit } : {
                    title: `【多單 ${i + 1}】`,
                    store: storeFallback,
                    items: [],
                    fees: [],
                    subtotal: '',
                    discount: '',
                    total: sr.total || ''
                };
                Object.assign(splitObj, {
                    _slotKey: meta._slotKey,
                    _origIndex: meta._origIndex,
                    _origUuid: meta._origUuid,
                    _origExpectedStore: meta._origExpectedStore,
                    _origPinCode: meta._origPinCode,
                    _origHint: meta._origHint,
                    _origExtOrderId: meta._origExtOrderId,
                    _origSubCanceled: meta._origSubCanceled,
                });
                combinedList.push({
                    origIndex: i,
                    slotKey: meta._slotKey,
                    uuid: sr.orderUuid || uuidList[i] || '',
                    trackingUrl: sr.url || trackingUrls[i] || '',
                    subResult: sr,
                    split: splitObj,
                    extOrderId: meta._origExtOrderId || ((safeRawData.ext_order_ids && safeRawData.ext_order_ids[i]) ? safeRawData.ext_order_ids[i] : ''),
                    subCanceled: meta._origSubCanceled
                });
            }

            // 判斷該子單是否已取消
            function checkSubIsCanceled(item) {
                const sub = item.subResult;
                if (sub) {
                    // 🌟 絕對防誤判：若該單確認送達或完成，絕不判定為取消
                    if (sub.isDelivered === true || sub.status === 'concluded' || sub.orderPhase === 'COMPLETED') return false;
                    if (sub.isCanceled === true || sub.status === 'canceled' || sub.status === 'deleted' || sub.isUntracked === true) return true;
                    if (typeof isOrderCanceled === 'function' && isOrderCanceled(sub)) return true;
                    if (typeof getSubOrderConciseStatus === 'function') {
                        const c = getSubOrderConciseStatus(sub);
                        if (c && c.step === 0) return true;
                    }
                    const fullTitle = (sub.cancelTitle || sub.cancelReason || sub.orderStatus || sub.title || '').trim();
                    if (fullTitle.includes('取消') || fullTitle.toLowerCase().includes('cancel') || fullTitle.includes('無法接單')) return true;
                }
                const split = item.split;
                if (split) {
                    if (sub && (sub.isDelivered === true || sub.status === 'concluded' || sub.orderPhase === 'COMPLETED')) return false;
                    if (typeof isOrderCanceled === 'function' && isOrderCanceled(split)) return true;
                    if (split.isCanceled === true || split.status === 'canceled') return true;
                    const sTitle = (split.title || split.cancelReason || '').trim();
                    if (sTitle.includes('取消') || sTitle.toLowerCase().includes('cancel')) return true;
                }
                return false;
            }

            // 🌟 核心要求：若出現多單情況，強制把已取消訂單排列在最後面；但若有用戶正在手動切換檢視的子單則暫緩重排避免跳頁
            const hasSwitchedSubCard = combinedList.some(it => window._cardSwitchState?.[it.slotKey]?.cursor >= 0);
            if (!hasSwitchedSubCard) {
                combinedList.sort((a, b) => {
                    const aCanceled = checkSubIsCanceled(a);
                    const bCanceled = checkSubIsCanceled(b);
                    if (aCanceled && !bCanceled) return 1;
                    if (!aCanceled && bCanceled) return -1;
                    return a.origIndex - b.origIndex;
                });
            }

            // 重新序號化 split 標題，保證分頁、進度卡與明細卡序號一致且保留代訂編號
            combinedList.forEach((item, idx) => {
                if (item.split) {
                    if (item.split.title && /(?:【)?(?:多單|分單|子訂單)\s*\d+/.test(item.split.title)) {
                        item.split.title = item.split.title.replace(/((?:【)?(?:多單|分單|子訂單)\s*)\d+/, `$1${idx + 1}`);
                    } else if (!item.split.title) {
                        item.split.title = `【多單 ${idx + 1}】`;
                    }
                }
            });

            // 解構成排序後陣列
            const sortedUuidList = combinedList.map(it => it.uuid);
            const sortedTrackingUrls = combinedList.map(it => it.trackingUrl);
            const sortedSubResults = combinedList.map(it => it.subResult);
            const sortedSplits = combinedList.map(it => it.split).filter(Boolean);
            const sortedExtOrderIds = combinedList.map(it => it.extOrderId);
            const sortedSubCanceled = combinedList.map(it => it.subCanceled);

            safeParsedData.splits = sortedSplits;
            safeRawData.ext_order_ids = sortedExtOrderIds;
            safeRawData.sub_canceled = sortedSubCanceled;
            window.currentMultiUuidList = sortedUuidList;

            // 產生狀態特徵簽章 (Signature) 用於比對 (Diffing)
            const currentSignature = JSON.stringify(sortedSubResults.map(r => ({
                slotKey: r._slotKey || '',
                cursor: window._cardSwitchState?.[r._slotKey]?.cursor ?? -1,
                uuid: r.orderUuid,
                status: r.status,
                orderStatus: r.orderStatus,
                isDelivered: r.isDelivered,
                isCanceled: r.isCanceled,
                etaMin: r.etaMinutes,
                courier: r.courier?.name,
                courierVeh: r.courier?.vehicle,
                pin: r.pinCode || r.courier?.pinCode
            })));

            // 🌟 核心優化：若資料沒有任何變動，完全不重新渲染 DOM，徹底避免畫面閃爍或拖曳回滾！
            if (isBackgroundRefresh && window.lastMultiOrderSignature === currentSignature) {
                console.log('⚡ 多單狀態無實質變更，跳過 DOM 重新渲染，保持當前滑動位置');
                return;
            }
            window.lastMultiOrderSignature = currentSignature;

            // 若要更新 DOM，先精準紀錄當前滑動位置與分頁索引
            const topSlider = document.getElementById('deliveryStatusSlider');
            const bottomSlider = document.getElementById('splitsDetailSlider');
            const savedTopScrollLeft = topSlider ? topSlider.scrollLeft : null;
            const savedBottomScrollLeft = bottomSlider ? bottomSlider.scrollLeft : null;
            const previousIndex = window.currentMultiOrderIndex || 0;
            const activeUuid = window.currentMultiActiveOrderUuid || null;

            let targetIndex = 0;
            if (activeUuid && sortedUuidList.includes(activeUuid)) {
                targetIndex = sortedUuidList.indexOf(activeUuid);
            } else if (previousIndex >= 0 && previousIndex < sortedUuidList.length) {
                targetIndex = previousIndex;
            }
            window.currentMultiOrderIndex = targetIndex;
            window.currentMultiActiveOrderUuid = sortedUuidList[targetIndex] || null;

            window.lastParsedData = safeParsedData;
            window.lastTrackData = safeRawData;

            // 執行渲染
            renderMultiDeliveredStage(sortedSubResults, safeParsedData, safeRawData, sortedTrackingUrls);

            // 立即恢復使用者原先瀏覽的捲軸位置與卡片
            requestAnimationFrame(() => {
                if (targetIndex > 0 && typeof window.scrollToSplitIndex === 'function') {
                    window.scrollToSplitIndex(targetIndex);
                } else {
                    const newTopSlider = document.getElementById('deliveryStatusSlider');
                    const newBottomSlider = document.getElementById('splitsDetailSlider');
                    if (newTopSlider && savedTopScrollLeft !== null) {
                        newTopSlider.scrollLeft = savedTopScrollLeft;
                    }
                    if (newBottomSlider && savedBottomScrollLeft !== null) {
                        newBottomSlider.scrollLeft = savedBottomScrollLeft;
                    }
                }
            });
        }

        function parseOrderText(rawText) {

            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l);

            const isSplit = rawText.includes('【多單') || rawText.includes('【分單') || /(?:【)?(?:多單|分單)\s*\d+/.test(rawText);

            

            let parsed = {

                isSplit: isSplit,

                header: '', address: '', time: '', tag: '',

                globalDiscount: '', globalTotal: '', deliveryNotes: '', foodNotes: '',

                store: '', url: '', items: [], subtotal: '', discount: '', fees: [], total: '',

                splits: [], others: []

            };



            if (isSplit) {

                let currentSplit = null;

                let inFooter = false;

                

                for (let i = 0; i < lines.length; i++) {

                    let line = lines[i];

                    

                    if (line.includes('【多單') || line.includes('【分單') || /(?:【)?(?:多單|分單)\s*\d+/.test(line)) {

                        if (currentSplit) parsed.splits.push(currentSplit);

                        currentSplit = {

                            title: line.replace('📦', '').trim(), store: '', url: '', items: [],

                            subtotal: '', discount: '', fees: [], total: ''

                        };

                        continue;

                    }

                    

                    if (line.includes('總結算金額') || line.includes('總計')) {

                        inFooter = true;

                        parsed.globalTotal = line.substring(line.indexOf(':')+1).trim();

                        continue;

                    }

                    if (line.includes('外送備註')) {

                        inFooter = true;

                        parsed.deliveryNotes = line.substring(line.indexOf(':')+1).trim();

                        continue;

                    }

                    if (line.includes('餐點備註')) {

                        inFooter = true;

                        parsed.foodNotes = line.substring(line.indexOf(':')+1).trim();

                        continue;

                    }

                    if (line.includes('預訂折扣') || line.includes('活動折扣')) {

                        inFooter = true;

                        parsed.globalDiscount = line.replace(/🕒|🎉/g, '').trim();

                        continue;

                    }

                    

                    if (currentSplit) {

                        if (line.startsWith('🕒') || line.startsWith('時間')) {

                            currentSplit.time = line.includes(':') ? line.substring(line.indexOf(':')+1).trim() : line.replace('🕒', '').trim();

                        }

                        else if (line.startsWith('🏪') || (i>0 && lines[i-1].includes('【多單') && !line.includes('網址'))) {

                            currentSplit.store = line.replace('🏪', '').trim();

                        }

                        else if (line.startsWith('🔗') || line.startsWith('網址')) {

                            let u = line;

                            let match = u.match(/\[(http[^\]]+)\]/);

                            if (match) currentSplit.url = match[1];

                            else if (u.includes('http')) currentSplit.url = u.substring(u.indexOf('http'));

                        }

                        else if (line.match(/^\d+\./)) {

                            currentSplit.items.push({text: line.replace(/^[\s\u200B-\u200D\uFEFF]+/, ''), sub: []});

                        } else if (line.startsWith('-') && currentSplit.items.length > 0) {

                            currentSplit.items[currentSplit.items.length-1].sub.push(line);

                        } else if (line.includes('小計') && line.includes(':')) {

                            currentSplit.subtotal = line.substring(line.indexOf(':')+1).trim();

                        } else if (line.includes('優惠') && line.includes('-') && line.includes(':')) {

                            currentSplit.discount = line.substring(line.indexOf(':')+1).trim();

                        } else if (line.includes('結算') && line.includes(':')) {

                            currentSplit.total = line.substring(line.indexOf(':')+1).trim();

                        } else if (line.includes(':') && !line.includes('http')) {

                            let parts = line.split(':');

                            currentSplit.fees.push({name: parts[0].replace(/🎉|🏍️|🛵|🧑💼|🧑‍💼|📅/g,'').trim(), value: parts[1].trim()});

                        } else {

                            if (!inFooter) parsed.others.push(line);

                        }

                    } else {

                        if (line.includes('UberEats') || line.includes('揪團訂單')) parsed.header = line;

                        else if (line.startsWith('📍') || line.startsWith('地址')) parsed.address = line.includes(':') ? line.substring(line.indexOf(':')+1).trim() : line.replace('📍', '').trim();

                        else if (line.startsWith('🕒') || line.startsWith('時間')) parsed.time = line.includes(':') ? line.substring(line.indexOf(':')+1).trim() : line.replace('🕒', '').trim();

                        else if (line.startsWith('$') || line.startsWith('🏷️')) parsed.tag = line.replace('🏷️', '').trim();

                        else parsed.others.push(line);

                    }

                }

                if (currentSplit) parsed.splits.push(currentSplit);

                if (parsed.time) {

                    parsed.splits.forEach(sp => {

                        if (!sp.time) sp.time = parsed.time;

                    });

                }

                

            } else {

                let currentSection = 'header';

                for(let line of lines) {

                    if (line.startsWith('🛵 UberEats') || line.includes('揪團訂單')) { parsed.header = line; continue; }

                    if (line.startsWith('📍') || line.startsWith('地址')) { parsed.address = line.includes(':') ? line.substring(line.indexOf(':')+1).trim() : line.replace('📍', '').trim(); continue; }

                    if (line.startsWith('🕒') || line.startsWith('時間')) { parsed.time = line.includes(':') ? line.substring(line.indexOf(':')+1).trim() : line.replace('🕒', '').trim(); continue; }

                    if (line.startsWith('🏪')) { parsed.store = line.replace('🏪', '').trim(); continue; }

                    if (line.startsWith('🔗') || line.startsWith('網址')) { 

                        let u = line;

                        let match = u.match(/\[(http[^\]]+)\]/);

                        if (match) parsed.url = match[1];

                        else if (u.includes('http')) parsed.url = u.substring(u.indexOf('http'));

                        continue; 

                    }

                    if (line.match(/^\d+\./)) { parsed.items.push({text: line, sub: []}); currentSection = 'items'; continue; }

                    if (currentSection === 'items' && line.startsWith('-')) { parsed.items[parsed.items.length-1].sub.push(line); continue; }

                    if (line.startsWith('🏷️') || line.startsWith('$')) { parsed.tag = line.replace('🏷️', '').trim(); continue; }

                    if (line.startsWith('💵') || line.startsWith('小計')) { parsed.subtotal = line.substring(line.indexOf(':')+1).trim(); continue; }

                    if (line.startsWith('🎉') || (line.includes('優惠') && line.includes('-'))) { parsed.discount = line.substring(line.indexOf(':')+1).trim(); continue; }

                    if (line.startsWith('🏍️') || line.startsWith('🛵') || line.startsWith('🧑💼') || line.startsWith('🧑‍💼') || line.startsWith('📅') || (line.includes(':') && !line.includes('總') && !line.includes('備註') && !line.includes('http'))) {

                        let parts = line.split(':');

                        if(parts.length > 1) { parsed.fees.push({ name: parts[0].replace(/🎉|🏍️|🛵|🧑💼|🧑‍💼|📅/g,'').trim(), value: parts[1].trim() }); }

                        continue; 

                    }

                    if (line.startsWith('💰') || line.startsWith('總結算') || line.startsWith('總計')) { parsed.globalTotal = line.substring(line.indexOf(':')+1).trim(); parsed.total = parsed.globalTotal; continue; }

                    if (line.startsWith('🍽️') || line.startsWith('餐點備註')) { parsed.foodNotes = line.substring(line.indexOf(':')+1).trim(); continue; }

                    if (line.startsWith('📝') || line.startsWith('外送備註')) { parsed.deliveryNotes = line.substring(line.indexOf(':')+1).trim(); continue; }

                    if(currentSection !== 'items') { parsed.others.push(line); }

                }

            }

            return parsed;

        }



        function renderOrderDetails(parsed, rawText, tracking_urls = [], termResults = [], extOrderIds = []) {

            tracking_urls = tracking_urls || [];

            termResults = termResults || [];

            extOrderIds = extOrderIds || [];

            if (!parsed.isSplit && !parsed.store && parsed.items.length === 0) {

                return `<pre style="white-space: pre-wrap; margin:0; font-family: monospace;">${rawText}</pre>`;

            }



            let html = `<div style="text-align: left; font-family: -apple-system, sans-serif; font-size: 14px; color: #333; overflow:hidden; white-space: normal;">`;

            

            // 頂部資訊 (共用)

            html += `<div style="background: #e8f5e9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #c8e6c9;">`;

            if (parsed.header) html += `<div style="font-size: 16px; font-weight: bold; color: #2e7d32; margin-bottom: 5px;">${parsed.header}</div>`;

            if (parsed.tag) html += `<div style="display:inline-block; background:#ffe0ea; color:#d32f2f; padding:2px 6px; border-radius:4px; font-size:12px; font-weight:bold; margin-bottom:8px;">${parsed.tag}</div><br>`;

            if (parsed.time) html += `<div style="margin-top: 4px;">🕒 <strong>時間:</strong> ${parsed.time}</div>`;

            if (parsed.address) html += `<div style="margin-top: 4px; line-height: 1.4;">📍 <strong>地址:</strong> ${parsed.address}</div>`;

        function fitDeliveryMapExtent(points) {

            if (!liveMap || !points || points.length === 0) return;

            if (points.length === 1) {

                liveMap.getView().setCenter(ol.proj.fromLonLat([Number(points[0][0]), Number(points[0][1])]));

                liveMap.getView().setZoom(15);

                return;

            }

            const extent = ol.extent.createEmpty();

            points.forEach(pt => {

                const p = ol.proj.fromLonLat([Number(pt[0]), Number(pt[1])]);

                ol.extent.extend(extent, [p[0], p[1], p[0], p[1]]);

            });

            liveMap.getView().fit(extent, {

                padding: [50, 50, 50, 50],

                maxZoom: 16,

                duration: 300

            });

        }



        function initActiveDeliveryMap(activeData, parsedData) {

            try {

                if (typeof ol === 'undefined') {

                    console.warn('OpenLayers 尚未加載完成，500ms 後重試...');

                    setTimeout(() => {

                        if (typeof ol !== 'undefined') initActiveDeliveryMap(activeData, parsedData);

                    }, 500);

                    return;

                }

                const container = document.getElementById('liveDeliveryMap');

                if (!container) return;



                if (liveMap) {

                    try { liveMap.setTarget(null); } catch(e) {}

                    liveMap = null;

                }

                container.innerHTML = '';



                const c = activeData.courier || {};

                const s = activeData.store || {};

                const d = activeData.destination || {};



                const cLat = Number(c.latitude) || null;

                const cLng = Number(c.longitude) || null;

                const sLat = Number(s.latitude) || null;

                const sLng = Number(s.longitude) || null;

                const dLat = Number(d.latitude) || null;

                const dLng = Number(d.longitude) || null;



                const centerLat = cLat || sLat || dLat || 22.736;

                const centerLng = cLng || sLng || dLng || 120.33;



                // 1. OSM 官方標準圖磚 (與 deliverymap 相同，清晰道路編號與全台繁中標注，中心優先載入)

                const osmSource = new ol.source.OSM({

                    crossOrigin: 'anonymous',

                    attributions: '地圖資料 © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>',

                    tileLoadFunction: (tile, src) => {

                        const img = tile.getImage();

                        if (img instanceof HTMLImageElement) {

                            img.crossOrigin = 'anonymous';

                            img.onerror = () => {

                                if (!tile._hasTriedFallback) {

                                    tile._hasTriedFallback = true;

                                    img.src = src.replace('tile.openstreetmap.org', 'a.tile.openstreetmap.fr/osmfr');

                                }

                            };

                            img.src = src;

                        }

                    },

                    tilePriorityFunction: (tile, source, tileCenter, tileResolution) => {

                        if (!liveMap) return Infinity;

                        const viewCenter = liveMap.getView().getCenter();

                        if (!viewCenter) return Infinity;

                        return Math.sqrt(

                            Math.pow(tileCenter[0] - viewCenter[0], 2) +

                            Math.pow(tileCenter[1] - viewCenter[1], 2)

                        );

                    }

                });



                const osmLayer = new ol.layer.Tile({

                    source: osmSource,

                    zIndex: 1

                });



                // 2. 外送員真實行駛軌跡圖層 (藍色高光實線，100% 本地即時繪製)

                liveTrajectorySource = new ol.source.Vector();

                liveTrajectoryLine = new ol.layer.Vector({

                    source: liveTrajectorySource,

                    style: new ol.style.Style({

                        stroke: new ol.style.Stroke({

                            color: '#2563eb',

                            width: 5,

                            lineCap: 'round',

                            lineJoin: 'round'

                        })

                    }),

                    zIndex: 10

                });



                // 3. 預估道路導航路線 (綠色虛線)

                liveNavigationSource = new ol.source.Vector();

                liveNavigationLine = new ol.layer.Vector({

                    source: liveNavigationSource,

                    style: new ol.style.Style({

                        stroke: new ol.style.Stroke({

                            color: '#06c167',

                            width: 5,

                            lineDash: [6, 8],

                            lineCap: 'round',

                            lineJoin: 'round'

                        })

                    }),

                    zIndex: 8

                });



                // 4. 建立 OpenLayers 地圖實例

                liveMap = new ol.Map({

                    target: 'liveDeliveryMap',

                    layers: [osmLayer, liveNavigationLine, liveTrajectoryLine],

                    view: new ol.View({

                        center: ol.proj.fromLonLat([centerLng, centerLat]),

                        zoom: 15,

                        minZoom: 8,

                        maxZoom: 19,

                        enableRotation: false

                    }),

                    controls: [

                        new ol.control.Zoom(),

                        new ol.control.Attribution({ collapsible: true })

                    ]

                });



                window.liveMap = liveMap;

                // 初始化 Popup 氣泡

                setupLiveMapPopup();



                const extentPoints = [];



                // 目的地

                if (dLat && dLng) {

                    const destCoord = ol.proj.fromLonLat([dLng, dLat]);

                    const destEl = createDestOverlayElement(d.address || parsedData.address);

                    destEl.onclick = function(e) {

                        e.stopPropagation();

                        showLiveMapPopup(destCoord, `<b>📍 送達地點</b><br><span style="font-size:12px;color:#475569;">${d.address || parsedData.address || ''}</span>`);

                    };

                    liveDestMarker = new ol.Overlay({

                        element: destEl,

                        position: destCoord,

                        positioning: 'center-center',

                        stopEvent: false

                    });

                    liveMap.addOverlay(liveDestMarker);

                    extentPoints.push([dLng, dLat]);

                }



                // 店家

                if (sLat && sLng) {

                    const storeCoord = ol.proj.fromLonLat([sLng, sLat]);

                    const storeEl = createStoreOverlayElement(s.name || parsedData.store);

                    storeEl.onclick = function(e) {

                        e.stopPropagation();

                        showLiveMapPopup(storeCoord, `<b>🏪 ${s.name || parsedData.store || '合作店家'}</b>`);

                    };

                    liveStoreMarker = new ol.Overlay({

                        element: storeEl,

                        position: storeCoord,

                        positioning: 'center-center',

                        stopEvent: false

                    });

                    liveMap.addOverlay(liveStoreMarker);

                    extentPoints.push([sLng, sLat]);

                }



                // 外送員

                if (cLat && cLng) {

                    const courierCoord = ol.proj.fromLonLat([cLng, cLat]);

                    const courierEl = createCourierOverlayElement(c.name, c.vehicle, c.course);

                    courierEl.onclick = function(e) {

                        e.stopPropagation();

                        showLiveMapPopup(courierCoord, `<b>🛵 外送員：${c.name || '外送夥伴'}</b><br><span style="font-size:12px;color:#475569;">${c.vehicle || '機車配送中'}</span>`);

                    };

                    liveCourierMarker = new ol.Overlay({

                        element: courierEl,

                        position: courierCoord,

                        positioning: 'center-center',

                        stopEvent: false

                    });

                    liveMap.addOverlay(liveCourierMarker);

                    extentPoints.push([cLng, cLat]);

                    updateLiveTrajectoryPoints(c);

                }



                fitDeliveryMapExtent(extentPoints);

                drawLiveNavigationRoute(cLat, cLng, sLat, sLng, dLat, dLng);



                setTimeout(() => {

                    if (liveMap) {

                        try {

                            liveMap.updateSize();

                            fitDeliveryMapExtent(extentPoints);

                        } catch(e) {}

                    }

                }, 350);



            } catch(mapErr) {

                console.error("initActiveDeliveryMap 渲染異常 (已安全防護):", mapErr);

            }

        }



        // 計算兩點 GPS 座標之間的地面距離 (公尺)

        function calcGeoDist(lat1, lon1, lat2, lon2) {

            if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;

            const R = 6371000; // 地球半徑 (公尺)

            const dLat = (Number(lat2) - Number(lat1)) * Math.PI / 180;

            const dLon = (Number(lon2) - Number(lon1)) * Math.PI / 180;

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +

                      Math.cos(Number(lat1) * Math.PI / 180) * Math.cos(Number(lat2) * Math.PI / 180) *

                      Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;

        }



        function updateLiveTrajectoryPoints(courier) {

            try {

                if (!courier || !courier.latitude || !courier.longitude) return;

                if (!liveAccumulatedPath) liveAccumulatedPath = [];

                const pts = courier.pathPoints || [];

                const cur = [Number(courier.latitude), Number(courier.longitude)];

                if (pts.length > 0) {

                    const sorted = [...pts].sort((a, b) => (a.epoch || 0) - (b.epoch || 0));

                    liveAccumulatedPath = sorted.map(p => [Number(p.latitude), Number(p.longitude)]);

                }

                if (liveAccumulatedPath.length === 0) {

                    liveAccumulatedPath.push(cur);

                } else {

                    const last = liveAccumulatedPath[liveAccumulatedPath.length - 1];

                    if (calcGeoDist(last[0], last[1], cur[0], cur[1]) > 2) {

                        liveAccumulatedPath.push(cur);

                    }

                }

                if (liveTrajectorySource) {

                    liveTrajectorySource.clear();

                    if (liveAccumulatedPath.length > 1) {

                        const olCoords = liveAccumulatedPath.map(p => ol.proj.fromLonLat([p[1], p[0]]));

                        liveTrajectorySource.addFeature(new ol.Feature({

                            geometry: new ol.geom.LineString(olCoords)

                        }));

                    }

                }

            } catch(trErr) {

                console.warn("updateLiveTrajectoryPoints 異常 (已安全防護):", trErr);

            }

        }



        async function drawLiveNavigationRoute(cLat, cLng, sLat, sLng, dLat, dLng) {

            if (!liveMap || !cLat || !cLng) return;

            if (!liveLastNavCoords) liveLastNavCoords = { cLat: null, cLng: null, lastTime: 0 };

            const points = [`${cLng},${cLat}`];

            const coordsList = [[Number(cLat), Number(cLng)]];



            if (sLng && sLat) {

                points.push(`${sLng},${sLat}`);

                coordsList.push([Number(sLat), Number(sLng)]);

            }

            if (dLng && dLat) {

                points.push(`${dLng},${dLat}`);

                coordsList.push([Number(dLat), Number(dLng)]);

            }

            if (points.length < 2) return;



            const now = Date.now();

            const dist = calcGeoDist(cLat, cLng, liveLastNavCoords.cLat, liveLastNavCoords.cLng);

            if (liveLastNavCoords.lastTime && (now - liveLastNavCoords.lastTime < 12000) && dist < 35 && liveNavigationSource && liveNavigationSource.getFeatures().length > 0) {

                return;

            }

            liveLastNavCoords = { cLat, cLng, lastTime: now };



            try {

                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${points.join(';')}?overview=full&geometries=geojson`;

                const controller = new AbortController();

                const timeoutId = setTimeout(() => controller.abort(), 4000);

                const res = await fetch(osrmUrl, { signal: controller.signal });

                clearTimeout(timeoutId);



                if (res.ok) {

                    const data = await res.json();

                    if (data.routes && data.routes.length > 0 && liveNavigationSource) {

                        const geoJsonFormat = new ol.format.GeoJSON();

                        const geom = geoJsonFormat.readGeometry(data.routes[0].geometry, {

                            dataProjection: 'EPSG:4326',

                            featureProjection: 'EPSG:3857'

                        });

                        liveNavigationSource.clear();

                        liveNavigationSource.addFeature(new ol.Feature({ geometry: geom }));

                        return;

                    }

                }

            } catch(e) {}



            // 平滑虛線備援 (直線連接)

            if (liveNavigationSource) {

                const lineCoords = coordsList.map(pt => ol.proj.fromLonLat([pt[1], pt[0]]));

                liveNavigationSource.clear();

                liveNavigationSource.addFeature(new ol.Feature({

                    geometry: new ol.geom.LineString(lineCoords)

                }));

            }

        }



        function startActiveOrderLivePolling(orderUuid, parsedData, data) {

            if (liveActivePollTimer) clearInterval(liveActivePollTimer);



            liveActivePollTimer = setInterval(async () => {

                    // 1. 檢測是否取消

                        clearInterval(liveActivePollTimer);

                        if (liveEtaCountdownTimer) clearInterval(liveEtaCountdownTimer);
                        stopActiveChatAutoSync();

                        renderCanceledStage(_tagSwitchedLiveTransition(activeRes, orderUuid), parsedData, data, '');
