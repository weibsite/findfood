        function initActiveDeliveryMap(activeData, parsedData) {
            if (typeof L === 'undefined') {
                console.warn('Leaflet 尚未加載完成，500ms 後重試...');
                setTimeout(() => {
                    if (typeof L !== 'undefined') initActiveDeliveryMap(activeData, parsedData);
                }, 500);
                return;
            }
            const container = document.getElementById('liveDeliveryMap');
            if (!container) return;

            if (liveMap) {
                try { liveMap.remove(); } catch(e) {}
                liveMap = null;
            }

            const c = activeData.courier || {};
            const s = activeData.store || {};
            const d = activeData.destination || {};

            const cLat = c.latitude;
            const cLng = c.longitude;
            const sLat = s.latitude;
            const sLng = s.longitude;
            const dLat = d.latitude;
            const dLng = d.longitude;

            const centerLat = cLat || sLat || dLat || 22.736;
            const centerLng = cLng || sLng || dLng || 120.33;

            liveMap = L.map('liveDeliveryMap', {
                zoomControl: true,
                attributionControl: false
            }).setView([centerLat, centerLng], 14);

            // CartoDB Voyager 高速圖磚 (附帶 OpenStreetMap 官方標準圖磚雙重容錯)
            const osmLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; CartoDB &copy; OpenStreetMap'
            }).addTo(liveMap);

            osmLayer.on('tileerror', function(error, tile) {
                if (tile && !tile._hasFallback) {
                    tile._hasFallback = true;
                    const coords = error.coords;
                    if (coords) tile.src = `https://a.tile.openstreetmap.fr/osmfr/${coords.z}/${coords.x}/${coords.y}.png`;
                }
            });

            // 初始化外送員行駛真實軌跡線 (藍色高光實線，100% 本地即時繪製)
            liveTrajectoryLine = L.polyline([], {
                color: '#2563eb',
                weight: 5,
                opacity: 0.9,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(liveMap);

            const bounds = [];

            // 目的地
            if (dLat && dLng) {
                liveDestMarker = L.marker([dLat, dLng], {
                    icon: createEmojiMapIcon('📍', '#fee2e2', '#ef4444')
                }).addTo(liveMap).bindPopup(`<b>📍 送達地點</b><br>${d.address || parsedData.address || ''}`);
                bounds.push([dLat, dLng]);
            }

            // 店家
            if (sLat && sLng) {
                liveStoreMarker = L.marker([sLat, sLng], {
                    icon: createEmojiMapIcon('🏪', '#fef3c7', '#f59e0b')
                }).addTo(liveMap).bindPopup(`<b>🏪 ${s.name || parsedData.store || '店家'}</b>`);
                bounds.push([sLat, sLng]);
            }

            // 外送員
            if (cLat && cLng) {
                liveCourierMarker = L.marker([cLat, cLng], {
                    icon: createCourierMapIcon(c.course || 0)
                }).addTo(liveMap).bindPopup(`<b>🛵 外送員：${c.name || '外送夥伴'}</b><br>${c.vehicle || ''}`);
                bounds.push([cLat, cLng]);
                updateLiveTrajectoryPoints(c);
            }

            if (bounds.length > 1) {
                liveMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
            }

            drawLiveNavigationRoute(cLat, cLng, sLat, sLng, dLat, dLng);

            setTimeout(() => {
                if (liveMap) {
                    try {
                        liveMap.invalidateSize();
                        if (bounds.length > 1) {
                            liveMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
                        }
                    } catch(e) {}
                }
            }, 300);
        }

        function updateLiveTrajectoryPoints(courier) {
            if (!liveTrajectoryLine || !courier || !courier.latitude || !courier.longitude) return;
            const pts = courier.pathPoints || [];
            const cur = [courier.latitude, courier.longitude];
            if (pts.length > 0) {
                const sorted = [...pts].sort((a, b) => (a.epoch || 0) - (b.epoch || 0));
                liveAccumulatedPath = sorted.map(p => [p.latitude, p.longitude]);
            }
            if (liveAccumulatedPath.length === 0) {
                liveAccumulatedPath.push(cur);
            } else {
                const last = liveAccumulatedPath[liveAccumulatedPath.length - 1];
                if (calcGeoDist(last[0], last[1], cur[0], cur[1]) > 2) {
                    liveAccumulatedPath.push(cur);
                }
            }
            liveTrajectoryLine.setLatLngs(liveAccumulatedPath);
        }

        async function drawLiveNavigationRoute(cLat, cLng, sLat, sLng, dLat, dLng) {
            if (!liveMap || !cLat || !cLng) return;
            const points = [`${cLng},${cLat}`];
            const coordsList = [[cLat, cLng]];

            if (sLng && sLat) {
                points.push(`${sLng},${sLat}`);
                coordsList.push([sLat, sLng]);
            }
            if (dLng && dLat) {
                points.push(`${dLng},${dLat}`);
                coordsList.push([dLat, dLng]);
            }
            if (points.length < 2) return;

            const now = Date.now();
            const dist = calcGeoDist(cLat, cLng, liveLastNavCoords.cLat, liveLastNavCoords.cLng);
            if (liveLastNavCoords.lastTime && (now - liveLastNavCoords.lastTime < 12000) && dist < 35 && liveNavigationLine) {
                return;
            }
            liveLastNavCoords = { cLat, cLng, lastTime: now };

            try {
                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${points.join(';')}?overview=full&geometries=geojson`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                const res = await fetch(osrmUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (res.ok) {
                    const data = await res.json();
                    if (data.routes && data.routes.length > 0) {
                        if (liveNavigationLine) {
                            try { liveMap.removeLayer(liveNavigationLine); } catch(e) {}
                        }
                        liveNavigationLine = L.geoJSON(data.routes[0].geometry, {
                            style: {
                                color: '#06c167',
                                weight: 5,
                                opacity: 0.85,
                                dashArray: '6, 8',
                                lineCap: 'round',
                                lineJoin: 'round'
                            }
                        }).addTo(liveMap);
                        return;
                    }
                }
            } catch(e) {}

            // 平滑虛線備援
            if (!liveNavigationLine) {
                liveNavigationLine = L.polyline(coordsList, {
                    color: '#06c167',
                    weight: 5,
                    opacity: 0.85,
                    dashArray: '8, 8',
                    lineCap: 'round',
                    lineJoin: 'round'
                }).addTo(liveMap);
            } else {
                liveNavigationLine.setLatLngs(coordsList);
            }
        }

        function startActiveOrderLivePolling(orderUuid, parsedData, data) {
            if (liveActivePollTimer) clearInterval(liveActivePollTimer);

            liveActivePollTimer = setInterval(async () => {
                try {
                    const activeRes = await fetchActiveOrder(orderUuid, '', window.trackApiBase);

                    // 1. 檢測是否取消
                    if (isOrderCanceled(activeRes)) {
                        clearInterval(liveActivePollTimer);
                        renderCanceledStage(activeRes, parsedData, data, '');
                        return;
                    }

                    // 2. 檢測是否送達
                    if (activeRes && (activeRes.status === 'concluded' || activeRes.isDelivered || activeRes.orderPhase === 'COMPLETED')) {
                        clearInterval(liveActivePollTimer);
                        const termRes = await fetchTerminatedOrder(orderUuid, '', window.trackApiBase);
                        const finalDeliveredData = (termRes && termRes.status === 'success') ? { ...activeRes, ...termRes } : activeRes;
                        renderDeliveredStage(finalDeliveredData, parsedData, data, '');
                        return;
                    }

                    // 3. 持續同步最新座標、路徑與狀態 (留在當前自製畫面，絕不轉跳)
                    if (activeRes && activeRes.status === 'success') {
                        const curStatus = String(activeRes.orderStatus || '').toLowerCase();
                        const curCourier = activeRes.courier || {};
                        const curIsPreparing = (
                            curStatus.includes('準備') ||
                            curStatus.includes('備餐') ||
                            curStatus.includes('領取訂單') ||
                            curStatus.includes('等待取餐') ||
                            curStatus.includes('前往店家') ||
                            curStatus.includes('尚未出發') ||
                            (activeRes.progress && activeRes.progress.current <= 2)
                        ) && (!curCourier.latitude || !curCourier.longitude || curStatus.includes('準備') || curStatus.includes('領取訂單'));

                        const curIsHeadingToStore = curStatus.includes('領取') || curStatus.includes('前往店家');

                        const mainHeader = document.querySelector('.card h2');
                        if (mainHeader) {
                            mainHeader.innerHTML = curIsPreparing 
                                ? '🍳 商家正在準備餐點 (即時進度追蹤)' 
                                : '🛵 外送進行中 (即時地圖追蹤)';
                        }

                        const stageTag = document.getElementById('liveActiveStageTag');
                        if (stageTag) {
                            stageTag.innerText = curIsPreparing ? '🍳 餐點製作與備餐進度' : '🛵 外送配送進度';
                            stageTag.style.color = curIsPreparing ? '#b45309' : '#15803d';
                        }

                        const bannerBox = document.getElementById('liveActiveBannerBox');
                        if (bannerBox) {
                            bannerBox.style.background = curIsPreparing ? '#fffbeb' : '#f0fdf4';
                            bannerBox.style.borderColor = curIsPreparing ? '#fde68a' : '#86efac';
                        }

                        const etaEl = document.getElementById('liveActiveEta');
                        if (etaEl && activeRes.eta) {
                            etaEl.innerText = `預計抵達：${activeRes.eta}`;
                            etaEl.style.color = curIsPreparing ? '#92400e' : '#166534';
                        }

                        const statEl = document.getElementById('liveActiveStatus');
                        if (statEl) {
                            statEl.innerText = curIsPreparing 
                                ? (curIsHeadingToStore ? '🛵 外送夥伴正在前往店家取餐中…' : (curStatus.includes('準備') ? activeRes.orderStatus : '🍳 商家正在為您新鮮製作餐點…'))
                                : (activeRes.orderStatus || '外送配送中');
                        }

                        // 更新可視化進度條
                        const step1Icon = document.getElementById('liveStep1Icon');
                        const step1Text = document.getElementById('liveStep1Text');
                        const stepLine1 = document.getElementById('liveStepLine1');
                        const step2Icon = document.getElementById('liveStep2Icon');
                        const step2Text = document.getElementById('liveStep2Text');
                        const stepLine2 = document.getElementById('liveStepLine2');
                        const step3Icon = document.getElementById('liveStep3Icon');
                        const step3Text = document.getElementById('liveStep3Text');

                        if (step1Icon) {
                            step1Icon.innerHTML = curIsPreparing && !curIsHeadingToStore ? '🍳' : '✓';
                            step1Icon.style.background = curIsPreparing ? '#f59e0b' : '#10b981';
                        }
                        if (step1Text) {
                            step1Text.style.color = curIsPreparing && !curIsHeadingToStore ? '#b45309' : '#059669';
                        }
                        if (stepLine1) {
                            stepLine1.style.background = (curIsHeadingToStore || !curIsPreparing) ? '#10b981' : '#e2e8f0';
                        }
                        if (step2Icon) {
                            step2Icon.innerHTML = !curIsPreparing ? '✓' : '🛵';
                            step2Icon.style.background = !curIsPreparing ? '#10b981' : (curIsHeadingToStore ? '#f59e0b' : '#f1f5f9');
                            step2Icon.style.color = (!curIsPreparing || curIsHeadingToStore) ? 'white' : '#94a3b8';
                            step2Icon.style.borderColor = (!curIsPreparing || curIsHeadingToStore) ? '#f59e0b' : '#cbd5e1';
                        }
                        if (step2Text) {
                            step2Text.style.fontWeight = (curIsHeadingToStore || !curIsPreparing) ? 'bold' : 'normal';
                            step2Text.style.color = (curIsHeadingToStore || !curIsPreparing) ? '#0f172a' : '#94a3b8';
                        }
                        if (stepLine2) {
                            stepLine2.style.background = !curIsPreparing ? '#10b981' : '#e2e8f0';
                        }
                        if (step3Icon) {
                            step3Icon.style.background = !curIsPreparing ? '#059669' : '#f1f5f9';
                            step3Icon.style.color = !curIsPreparing ? 'white' : '#94a3b8';
                            step3Icon.style.borderColor = !curIsPreparing ? '#059669' : '#cbd5e1';
                        }
                        if (step3Text) {
                            step3Text.style.fontWeight = !curIsPreparing ? 'bold' : 'normal';
                            step3Text.style.color = !curIsPreparing ? '#059669' : '#94a3b8';
                        }

                        // 動態切換傳訊框
                        const chatPlaceholder = document.getElementById('liveActiveChatPlaceholder');
                        const chatSection = document.getElementById('liveActiveChatSection');
                        if (chatPlaceholder && chatSection) {
                            if (curIsPreparing) {
                                chatPlaceholder.style.display = 'block';
                                chatSection.style.display = 'none';
                            } else {
                                chatPlaceholder.style.display = 'none';
                                chatSection.style.display = 'block';
                            }
                        }

                        const courierNameEl = document.getElementById('liveActiveCourierName');
                        const courierVehicleEl = document.getElementById('liveActiveCourierVehicle');
                        const courierIconEl = document.getElementById('liveActiveCourierIcon');
                        const courierSubEl = document.getElementById('liveActiveCourierSubtitle');

                        if (curIsPreparing) {
                            if (courierIconEl) {
                                courierIconEl.innerText = '🍳';
                                courierIconEl.style.background = '#fff7ed';
                                courierIconEl.style.color = '#ea580c';
                                courierIconEl.style.borderColor = '#fed7aa';
                            }
                            if (courierSubEl) courierSubEl.innerText = '目前配送狀態';
                            if (courierNameEl) {
                                courierNameEl.innerText = curIsHeadingToStore 
                                    ? (curCourier.name && curCourier.name !== '外送夥伴' ? `外送夥伴 ${curCourier.name} 前往店家取餐` : '外送夥伴正在前往店家取餐') 
                                    : '店家正在用心備餐中';
                            }
                            if (courierVehicleEl) {
                                courierVehicleEl.innerText = curIsHeadingToStore 
                                    ? (curCourier.vehicle || '機車前往取餐') 
                                    : '餐點製作完成後，將由外送夥伴前往送達';
                            }
                        } else {
                            if (courierIconEl) {
                                courierIconEl.innerText = '🛵';
                                courierIconEl.style.background = '#ecfdf5';
                                courierIconEl.style.color = '#059669';
                                courierIconEl.style.borderColor = '#a7f3d0';
                            }
                            if (courierSubEl) courierSubEl.innerText = '外送夥伴';
                            if (courierNameEl) courierNameEl.innerText = curCourier.name || '外送夥伴';
                            if (courierVehicleEl) courierVehicleEl.innerText = curCourier.vehicle || '機車配送中';
                        }

                        // 更新外送員 GPS 與地圖軌跡
                        if (curCourier.latitude && curCourier.longitude) {
                            if (liveCourierMarker) {
                                liveCourierMarker.setLatLng([curCourier.latitude, curCourier.longitude]);
                                liveCourierMarker.setIcon(createCourierMapIcon(curCourier.course || 0));
                            } else if (liveMap) {
                                liveCourierMarker = L.marker([curCourier.latitude, curCourier.longitude], {
                                    icon: createCourierMapIcon(curCourier.course || 0)
                                }).addTo(liveMap).bindPopup(`<b>🛵 外送員：${curCourier.name || '外送夥伴'}</b><br>${curCourier.vehicle || ''}`);
                            }
                            updateLiveTrajectoryPoints(curCourier);
                            const s = activeRes.store || {};
                            const d = activeRes.destination || {};
                            drawLiveNavigationRoute(curCourier.latitude, curCourier.longitude, s.latitude, s.longitude, d.latitude, d.longitude);
                        }
                    }
                } catch(e) {}
            }, 3500);
        }

        window.sendActiveQuickMsg = function(text) {
            const input = document.getElementById('liveActiveChatInput');
            if (input) input.value = text;
            triggerSendActiveMsg();
        };

        window.triggerSendActiveMsg = async function() {
            const input = document.getElementById('liveActiveChatInput');
            const sendBtn = document.getElementById('liveActiveSendBtn');
            if (!input || !input.value.trim()) return;

            const msg = input.value.trim();
            input.value = '';

            appendActiveChatBubble('user', msg);
            if (sendBtn) {
                sendBtn.disabled = true;
                sendBtn.innerText = '傳送中...';
            }

            const uuid = window.currentActiveOrderUuid || '';
            const res = await sendCourierMessage(uuid, msg, window.trackApiBase);
            if (!res || !res.success) {
                appendActiveChatBubble('system', '⚠️ 訊息已排入外送員傳遞佇列');
            }

            if (sendBtn) {
                sendBtn.disabled = false;
                sendBtn.innerText = '發送';
            }
        };

        function appendActiveChatBubble(sender, text) {
            const area = document.getElementById('liveActiveChatMessages');
            if (!area) return;
            const bubble = document.createElement('div');
            bubble.style.maxWidth = '80%';
            bubble.style.padding = '6px 10px';
            bubble.style.borderRadius = '10px';
            bubble.style.fontSize = '12px';
            bubble.style.lineHeight = '1.4';
            bubble.style.wordBreak = 'break-word';

            if (sender === 'user') {
                bubble.style.alignSelf = 'flex-end';
                bubble.style.background = '#dcfce7';
                bubble.style.color = '#15803d';
                bubble.style.borderBottomRightRadius = '2px';
                bubble.innerHTML = `<strong>您：</strong>${text}`;
            } else if (sender === 'courier') {
                bubble.style.alignSelf = 'flex-start';
                bubble.style.background = '#e0f2fe';
                bubble.style.color = '#0369a1';
                bubble.style.borderBottomLeftRadius = '2px';
                bubble.innerHTML = `<strong>外送夥伴：</strong>${text}`;
            } else {
                bubble.style.alignSelf = 'center';
                bubble.style.background = '#f1f5f9';
                bubble.style.color = '#64748b';
                bubble.style.fontSize = '10.5px';
                bubble.innerHTML = text;
            }

            area.appendChild(bubble);
            area.scrollTop = area.scrollHeight;
        }


        // 向後端查詢訂單 track_info 基礎資料 (支援多端點容錯備援)
        async function fetchTrackInfo(id, trackApiBase) {
            const endpoints = [];
            if (trackApiBase) endpoints.push(`${trackApiBase}/api/track_info?id=${encodeURIComponent(id)}`);
            endpoints.push(`/api/track_info?id=${encodeURIComponent(id)}`);
            endpoints.push(`https://api.9ysong.shop/api/track_info?id=${encodeURIComponent(id)}`);
            endpoints.push(`http://127.0.0.1:5000/api/track_info?id=${encodeURIComponent(id)}`);
            endpoints.push(`http://localhost:5000/api/track_info?id=${encodeURIComponent(id)}`);

            const uniqueEndpoints = [...new Set(endpoints)];
            for (const ep of uniqueEndpoints) {
                try {
                    const res = await fetch(ep);
                    if (res.ok) {
                        return await res.json();
                    }
                } catch(e) {
                    console.warn(`[fetchTrackInfo] 端點連線失敗 (${ep}):`, e.message);
                }
            }
            return null;
        }

        async function checkStatus() {
                try {
                    const data = await fetchTrackInfo(orderId, trackApiBase);
                    if (data && data.status === 'success') {
                            const parsedData = parseOrderText(data.text);
                            orderTextArea.innerHTML = renderOrderDetails(parsedData, data.text, data.tracking_urls, [], data.ext_order_ids);
                            orderTextArea.style.backgroundColor = 'transparent';
                            orderTextArea.style.border = 'none';
                            orderTextArea.style.padding = '0';
                            orderTextArea.style.display = 'block';
                            
                            let statusHtml = '';
                            if (data.ext_order_id) {
                                statusHtml += `<p style='color: #666; font-size: 18px; margin-bottom: 5px;'>訂單編號: <strong style="color:#111; font-size:22px;">${data.ext_order_id}</strong></p>`;
                            }
                            
                            const hasTracking = (data.tracking_urls && data.tracking_urls.length > 0) || Boolean(data.tracking_url);
                            
                            if (hasTracking) {
                                if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
                                countdownState = null;

                                const trackingUrls = (data.tracking_urls && data.tracking_urls.length > 0)
                                    ? data.tracking_urls
                                    : (data.tracking_url ? [data.tracking_url] : []);
                                
                                const isMulti = trackingUrls.length > 1 || parsedData.isSplit;

                                if (isMulti) {
                                    // 多單情況：分別向 API 取得每筆子訂單的送達資訊
                                    statusArea.innerHTML = `
                                        <div class="loader"></div>
                                        <h3 style="color: #06c167; font-size: 18px; margin-top: 15px;">🛵 正在確認各筆子訂單送達狀態...</h3>
                                        <p style="color: #666; font-size: 13px; margin-top: 5px;">共 ${trackingUrls.length} 筆子訂單，正在分別查詢留置照片與定位...</p>
                                    `;

                                    const termResults = await Promise.all(trackingUrls.map(async (url, idx) => {
                                        const u = extractOrderUuid(url);
                                        if (!u) return { status: 'error', message: '無有效 UUID', url, idx };
                                        const res = await fetchTerminatedOrder(u, url, trackApiBase);
                                        return { ...res, url, idx, orderUuid: u };
                                    }));

                                    console.log('✅ 多單送達狀態查詢完成:', termResults);
                                    renderMultiDeliveredStage(termResults, parsedData, data, trackingUrls);
                                    return;
                                } else {
                                    // 單一訂單情況
                                    const primaryTrackUrl = trackingUrls[0];
                                    const orderUuid = extractOrderUuid(primaryTrackUrl);

                                    if (orderUuid) {
                                        window.currentActiveOrderUuid = orderUuid;
                                        window.trackApiBase = trackApiBase;
                                        window.currentCookieSerial = data.cookie_serial || '';
                                        window.currentCookieAccountIndex = data.cookie_account_index || data.ext_order_id || '';

                                        statusArea.innerHTML = `
                                            <div class="loader"></div>
                                            <h3 style="color: #06c167; font-size: 18px; margin-top: 15px;">🛵 正在同步外送員即時動態...</h3>
                                            <p style="color: #666; font-size: 13px; margin-top: 5px;">正在連接外送員定位與配送狀態</p>
                                        `;

                                        // 1. 優先查詢進行中即時座標與外送狀態
                                        const activeRes = await fetchActiveOrder(orderUuid, primaryTrackUrl, trackApiBase);

                                        // 檢查是否為取消
                                        if (isOrderCanceled(activeRes)) {
                                            console.log('❌ 檢測到外送行程已取消！切換至已取消階段');
                                            renderCanceledStage(activeRes, parsedData, data, primaryTrackUrl);
                                            return;
                                        }

                                        // 檢查是否已送達
                                        if (activeRes && (activeRes.status === 'concluded' || activeRes.isDelivered || activeRes.orderPhase === 'COMPLETED')) {
                                            console.log('🎉 檢測到外送夥伴已抵達送達！進一步獲取留置拍照與送達明細...');
                                            const termRes = await fetchTerminatedOrder(orderUuid, primaryTrackUrl, trackApiBase);
                                            const finalDeliveredData = (termRes && termRes.status === 'success') ? { ...activeRes, ...termRes } : activeRes;
                                            renderDeliveredStage(finalDeliveredData, parsedData, data, primaryTrackUrl);
                                            return;
                                        }

                                        // 🛵 進行中：直接在當前頁面呈現自製外送追蹤畫面！絕不轉跳外部網址！
                                        if (activeRes && activeRes.status === 'success') {
                                            console.log('🛵 檢測到外送進行中，直接渲染自製即時追蹤畫面 (絕不轉網址)');
                                            renderActiveDeliveryStage(activeRes, parsedData, data, orderUuid);
                                            return;
                                        }

                                        // 2. 備援查詢結單狀態 (Terminated)
                                        const termRes = await fetchTerminatedOrder(orderUuid, primaryTrackUrl, trackApiBase);
                                        if (isOrderCanceled(termRes)) {
                                            renderCanceledStage(termRes, parsedData, data, primaryTrackUrl);
                                            return;
                                        }
                                        if (termRes && termRes.status === 'success') {
                                            renderDeliveredStage(termRes, parsedData, data, primaryTrackUrl);
                                            return;
                                        }
                                    }

                                    // 檢查是否為預約排程單 (Scheduled Order)
                                    const isSingleSched = isScheduledOrder(parsedData.time, null, data.text);
                                    if (isSingleSched) {
                                        console.log('📅 單筆訂單為預約排程單，進入預約展示階段');
                                        renderScheduledStage(parsedData, data, primaryTrackUrl);
                                        return;
                                    }

                                    // 3. 進行中備援：直接在頁面展示自製追蹤畫面，絕不自動跳轉！
                                    renderActiveDeliveryStage({
                                        eta: '計算中...',
                                        orderStatus: '訂單正在準備中 (外送即將出發)',
                                        courier: { name: '外送夥伴', vehicle: '即將前往取餐' },
                                        store: { name: parsedData.store || '合作店家' },
                                        destination: { address: parsedData.address || '指定外送地址' }
                                    }, parsedData, data, orderUuid);
                                }
                            } else if (data.order_status === 'used') {
                                const accTimeStr = data.accepted_time_hm || extractHM(data.accepted_at) || extractHM(data.timestamp);
                                const accElapsed = (typeof data.accept_elapsed_sec === 'number') ? data.accept_elapsed_sec : calcFallbackElapsedSec(data.accepted_at || data.timestamp);
                                countdownState = { mode: 'used', baseElapsedSec: accElapsed, syncLocalMs: Date.now() };

                                statusHtml += `
                                    <h3 style="color: #007bff; font-size: 20px; margin-top: 15px;"><img src="http://weibsite.github.io/findDOG/image/LOADING.gif" style="width: 80px; vertical-align: middle; margin-right: 5px;"> 正在為您的訂單點餐...</h3>
                                    ${accTimeStr ? `<p style="color: #333; font-weight: bold; font-size: 15px; margin: 6px 0;">接單時間為${accTimeStr}</p>` : ''}
                                    <div id="countdownBox"></div>
                                `;
                                statusArea.innerHTML = statusHtml;
                                startCountdownLoop();
                                setTimeout(checkStatus, 5000);
                            } else {
                                const subTimeStr = data.submitted_time_hm || extractHM(data.submitted_at) || extractHM(data.timestamp);
                                const waitElapsed = (typeof data.wait_elapsed_sec === 'number') ? data.wait_elapsed_sec : calcFallbackElapsedSec(data.submitted_at || data.timestamp);
                                countdownState = { mode: 'waiting', baseElapsedSec: waitElapsed, syncLocalMs: Date.now() };

                                statusHtml += `
                                    <h3 style="color: #ff9800; font-size: 20px; margin-top: 15px;"><img src="http://weibsite.github.io/findDOG/image/sit.gif" style="width: 55px; vertical-align: middle; margin-right: 5px;"> 等待代訂接單</h3>
                                    <p style="color: #007bff; font-weight: bold; font-size: 15px; margin: 6px 0;">${data.latest_activity_text || '等待代訂接單中目前代訂有空'}</p>
                                    ${subTimeStr ? `<p style="color: #555; font-weight: bold; font-size: 15px; margin: 6px 0;">送單時間：${subTimeStr}</p>` : ''}
                                    <div id="countdownBox"></div>
                                `;
                                statusArea.innerHTML = statusHtml;
                                startCountdownLoop();
                                setTimeout(checkStatus, 5000);
                            }
                        } else if (data && data.status) {
                        statusArea.innerHTML = `<h3 style="color:red;">找不到此訂單</h3><p style="color:#666;">可能是系統處理中或連結錯誤</p>`;
                    } else {
                        statusArea.innerHTML = `<h3 style="color:red;">無法連線到伺服器</h3><p style="color:#666;">請確認您的網路連線或稍後再試</p>`;
                    }
                } catch(e) {
                    console.error('checkStatus 執行異常:', e);
                    statusArea.innerHTML = `<h3 style="color:red;">無法連線到伺服器</h3><p style="color:#666;">請確認您的網路連線或稍後再試</p>`;
                }
            }
            
            // 初次執行
            checkStatus();
        });
    </script>
