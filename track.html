        // 本地保存對話歷史 (重新整理訊息不丟失，同時記錄已讀狀態)

        function saveChatMsgToStorage(uuid, sender, text, isRead = false) {

            try {

                const key = getChatStorageKey(uuid);

                const list = JSON.parse(localStorage.getItem(key) || '[]');

                const existing = list.find(m => m.sender === sender && m.text === text);
                if (!existing) {

                    list.push({ sender, text, isRead: Boolean(isRead), time: Date.now() });

                    if (list.length > 50) list.shift();

                    localStorage.setItem(key, JSON.stringify(list));

                } else if (isRead && !existing.isRead) {
                    existing.isRead = true;
                    localStorage.setItem(key, JSON.stringify(list));
                }

            } catch(e) {}

        }

        // 即時將已發送的顧客氣泡更新為「✓ 已讀」（同時將該則之前所有顧客氣泡標為已讀，符合 LINE / Uber 已讀邏輯）
        function markUserChatBubbleRead(containerId, targetText, uuid) {
            try {
                const container = document.getElementById(containerId);
                if (!container) return;
                const trimmedTarget = String(targetText || '').trim();
                const tags = Array.from(container.querySelectorAll('.chat-read-tag'));
                let matchedIdx = -1;
                tags.forEach((el, idx) => {
                    if ((el.dataset.userMsg || '').trim() === trimmedTarget) matchedIdx = idx;
                });
                if (matchedIdx >= 0) {
                    for (let i = 0; i <= matchedIdx; i++) {
                        const el = tags[i];
                        el.innerText = '✓ 已讀';
                        el.style.color = '#059669';
                        el.style.fontWeight = '700';
                        if (uuid && el.dataset.userMsg) {
                            saveChatMsgToStorage(uuid, 'user', el.dataset.userMsg, true);
                        }
                    }
                }
            } catch(e) {}
        }



        // 從本地立即還原對話歷史

        function restoreChatMessagesFromLocal(uuid) {

            try {

                const key = getChatStorageKey(uuid);

                const list = JSON.parse(localStorage.getItem(key) || '[]');

                list.forEach(m => {

                    const msgKey = `${m.sender}:${m.text.trim()}`;

                    if (!window.renderedChatMessagesSet.has(msgKey)) {

                        window.renderedChatMessagesSet.add(msgKey);

                        appendActiveChatBubble(m.sender, m.text, false, Boolean(m.isRead));

                    }

                });

            } catch(e) {}

        }



        // 嚴格判斷是否「已實際委派外送員」（避免店家備餐中無外送員時使用者過早連線）
        function isCourierActuallyAssigned(activeObj) {
            if (!activeObj || activeObj.status !== 'success') return false;
            if (activeObj.courierAssigned === false || activeObj.hasChat === false) return false;
            const c = activeObj.courier || {};
            const cleanName = cleanCourierDisplayName(c.name);
            if (cleanName) return true;
            if (c.phone && String(c.phone).trim()) return true;
            if (c.latitude != null && c.longitude != null && Number(c.latitude) !== 0 && Number(c.longitude) !== 0) return true;
            if (activeObj.courierAssigned === true) return true;
            return false;
        }

        // 取得乾淨的外送員顯示名稱（排除「外送夥伴」、「店家正在用心備餐中」等預設佔位字樣）
        function cleanCourierDisplayName(rawName) {
            let s = String(rawName || '').trim();
            if (!s) return '';
            if (['外送夥伴', '外送員', '店家正在用心備餐中', '外送夥伴正在前往店家取餐', '尚未派單'].includes(s)) return '';
            if (s.includes('無外送員') || s.includes('備餐中') || s.includes('配對中') || s.includes('正在前往店家取餐')) return '';
            s = s.replace(/^外送夥伴\s*[:：]?\s*/, '').replace(/\s*前往店家取餐$/, '').replace(/\s*正在配送.*$/, '').trim();
            if (!s || ['外送夥伴', '外送員', '正在'].includes(s)) return '';
            return s;
        }

        function getActiveCourierDisplayName(overrideName = '') {
            const fromOverride = cleanCourierDisplayName(overrideName);
            if (fromOverride) return fromOverride;
            const fromState = cleanCourierDisplayName(window.currentActiveCourierName);
            if (fromState) return fromState;
            const el = document.getElementById('liveActiveCourierName');
            const fromDom = el ? cleanCourierDisplayName(el.innerText) : '';
            if (fromDom) return fromDom;
            return '外送夥伴';
        }

        function refreshCourierBubbleNames(containerId, courierName) {
            const clean = cleanCourierDisplayName(courierName);
            if (!clean) return;
            const container = document.getElementById(containerId);
            if (!container) return;
            container.querySelectorAll('.courier-name-label').forEach(el => {
                el.innerText = `${clean}：`;
            });
        }

        // 過濾 Uber 聊天室頂部名片、時間分隔線、已讀狀態等非訊息文字
        function isCourierChatNoiseText(text, respCourierName = '') {
            const trimmed = String(text || '').trim();
            if (!trimmed) return true;
            const statusNoise = new Set(['已讀', '已傳送', '已送達', '傳送中', 'Read', 'Sent', 'Delivered', 'Sending', 'Sending...']);
            if (statusNoise.has(trimmed)) return true;
            if (/^(\d{1,2}月\d{1,2}日|週[一二三四五六日]|星期[一二三四五六日天]|今天|昨天|Today|Yesterday|上午|下午|\d{1,2}:\d{2})/i.test(trimmed) && trimmed.length <= 32) {
                return true;
            }
            if (trimmed.includes('Motorbike') || trimmed.includes('NDR-') || (trimmed.includes('•') && trimmed.length <= 45) || (trimmed.includes('Uber') && trimmed.length <= 45)) {
                return true;
            }
            const courierNameEl = document.getElementById('liveActiveCourierName');
            const rawDomName = courierNameEl ? courierNameEl.innerText.trim() : '';
            const cleanDomName = rawDomName.replace(/^外送夥伴\s*/, '').replace(/\s*前往店家取餐$/, '').trim();
            const cleanRespName = String(respCourierName || '').trim();
            if ((rawDomName && trimmed === rawDomName) || (cleanDomName && trimmed === cleanDomName) || (cleanRespName && trimmed === cleanRespName)) {
                return true;
            }
            return false;
        }

        function stopActiveChatAutoSync() {
            if (window._activeChatSyncInitTimer) {
                clearTimeout(window._activeChatSyncInitTimer);
                window._activeChatSyncInitTimer = null;
            }
            if (window._activeChatPollTimer) {
                clearInterval(window._activeChatPollTimer);
                window._activeChatPollTimer = null;
            }
            window._activeChatPollUuid = null;
        }

        function startActiveChatAutoSync(orderUuid, trackApiBase, skipImmediate = true) {
            if (!orderUuid) return;
            if (window._activeChatPollTimer && window._activeChatPollUuid === orderUuid) return;
            stopActiveChatAutoSync();
            window._activeChatPollUuid = orderUuid;

            if (!skipImmediate) {
                window._activeChatSyncInitTimer = setTimeout(() => {
                    if (window.currentActiveOrderUuid === orderUuid && window._activeChatConnectedUuid === orderUuid && document.visibilityState !== 'hidden') {
                        syncActiveCourierChatMessages(orderUuid, trackApiBase, false);
                    }
                }, 1500);
            }

            // 每 10 秒自動輪詢外送員新訊息（僅於使用者主動開啟連線後運作，切到背景分頁自動暫停）
            window._activeChatPollTimer = setInterval(() => {
                if (window.currentActiveOrderUuid !== orderUuid || window._activeChatConnectedUuid !== orderUuid) {
                    stopActiveChatAutoSync();
                    return;
                }
                if (document.visibilityState === 'hidden') return;
                if (window.isSendingCourierMsg) return;
                syncActiveCourierChatMessages(orderUuid, trackApiBase, false);
            }, 10000);
        }

        // 使用者點擊「需要聯絡外送員？按這裡」後，才開始載入訂單專屬 Cookie 並開啟自動同步
        window.connectActiveCourierChat = async function() {
            const uuid = window.currentActiveOrderUuid || '';
            if (!uuid) return;
            if (window._activeOrderCourierAssigned === false) {
                const hintEl = document.getElementById('liveActiveChatGateHint');
                if (hintEl) {
                    hintEl.style.color = '#b45309';
                    hintEl.innerText = '⏳ 暫時還沒委派外送員（店家備餐中），待外送員接單後即可聯絡';
                }
                return;
            }
            if (window._isConnectingActiveChat) return;
            window._isConnectingActiveChat = true;

            const btn = document.getElementById('liveActiveChatConnectBtn');
            const hint = document.getElementById('liveActiveChatGateHint');
            const badge = document.getElementById('liveActiveChatBadge');
            const gate = document.getElementById('liveActiveChatGate');
            const body = document.getElementById('liveActiveChatBody');
            const refreshBtn = document.getElementById('liveActiveChatRefreshBtn');

            if (btn) {
                btn.disabled = true;
                btn.style.opacity = '0.75';
                btn.style.cursor = 'wait';
                btn.innerText = '⏳ 連線中，請稍候...';
            }
            if (hint) {
                hint.style.color = '#b45309';
                hint.innerText = '正在聯絡外送員（約需 5～15 秒）...';
            }
            if (badge) {
                badge.innerText = '連線中...';
                badge.style.background = '#fef3c7';
                badge.style.color = '#b45309';
            }

            try {
                const syncResult = await syncActiveCourierChatMessages(uuid, window.trackApiBase, false, true);
                if (window.currentActiveOrderUuid !== uuid) return;

                if (!syncResult || !syncResult.ok) {
                    if (btn) {
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        btn.style.cursor = 'pointer';
                        btn.innerText = '🔄 連線失敗，點此重試';
                    }
                    if (hint) {
                        hint.style.color = '#dc2626';
                        hint.innerText = (syncResult && syncResult.message) || '目前無法建立連線，請稍後再試或聯絡代訂處理';
                    }
                    if (badge) {
                        badge.innerText = '未連線';
                        badge.style.background = '#f1f5f9';
                        badge.style.color = '#64748b';
                    }
                    return;
                }

                if (syncResult.status === 'delivered' || syncResult.status === 'canceled') {
                    if (btn) {
                        btn.disabled = true;
                        btn.style.opacity = '0.6';
                        btn.style.cursor = 'not-allowed';
                        btn.style.background = '#94a3b8';
                        btn.innerText = syncResult.status === 'delivered' ? '✅ 訂單已送達，對話已關閉' : '❌ 訂單已取消，對話已關閉';
                    }
                    if (hint) {
                        hint.style.color = '#64748b';
                        hint.innerText = 'Uber Eats 已關閉此外送訂單的即時對話通道';
                    }
                    if (badge) {
                        badge.innerText = '已結束';
                        badge.style.background = '#f1f5f9';
                        badge.style.color = '#64748b';
                    }
                    return;
                }

                // 連線成功：展開聊天室、顯示手動更新鈕、啟動 10 秒自動輪詢接收外送員訊息
                window._activeChatConnectedUuid = uuid;
                if (gate) gate.style.display = 'none';
                if (body) body.style.display = 'block';
                if (refreshBtn) refreshBtn.style.display = 'inline-block';
                if (badge) {
                    badge.innerText = '已連線';
                    badge.style.background = '#dcfce7';
                    badge.style.color = '#16a34a';
                }

                startActiveChatAutoSync(uuid, window.trackApiBase, true);

                const input = document.getElementById('liveActiveChatInput');
                if (input) setTimeout(() => input.focus(), 150);
            } catch (e) {
                console.warn('開啟外送員聊天室失敗:', e);
                if (btn) {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                    btn.innerText = '🔄 連線失敗，點此重試';
                }
                if (hint) {
                    hint.style.color = '#dc2626';
                    hint.innerText = '網路或伺服器暫時忙碌，請點擊重試';
                }
                if (badge) {
                    badge.innerText = '未連線';
                    badge.style.background = '#f1f5f9';
                    badge.style.color = '#64748b';
                }
            } finally {
                window._isConnectingActiveChat = false;
            }
        };

        // 即時雙向同步外送員與顧客訊息

        async function syncActiveCourierChatMessages(uuid, trackApiBase, isManual = false, isInitialConnect = false) {

            if (!uuid) return { ok: false, message: '無效的訂單編號' };
            if (!isInitialConnect && window._isSyncingActiveChat) return { ok: false, skipped: true };
            window._isSyncingActiveChat = true;
            const refreshBtn = isManual ? document.getElementById('liveActiveChatRefreshBtn') : null;
            if (refreshBtn) {
                refreshBtn.disabled = true;
                refreshBtn.innerText = '⏳ 同步中...';
            }

            try {

                const res = await fetchCourierMessages(uuid, trackApiBase);

                if (!res || res.status === 'error' || res.success === false) {
                    return { ok: false, message: (res && (res.message || res.error)) || '通訊斷線中，請聯絡代訂處理' };
                }

                

                // 支援 res.data.chatMessages 或 res.chatMessages

                const msgs = (res.data && res.data.chatMessages) || res.chatMessages || [];
                const respCourierName = (res.data && res.data.courierName) || '';
                const cleanRespCourierName = cleanCourierDisplayName(respCourierName);
                if (cleanRespCourierName) {
                    window.currentActiveCourierName = cleanRespCourierName;
                    refreshCourierBubbleNames('liveActiveChatMessages', cleanRespCourierName);
                }

                let hasNewCourierMsg = false;



                msgs.forEach(item => {

                    const text = (typeof item === 'string') ? item : (item.text || '');

                    let sender = (typeof item === 'object' && item.sender) ? item.sender : 'courier';

                    const itemIsRead = Boolean(typeof item === 'object' && (item.isRead || String(item.readStatus || '').toUpperCase() === 'READ'));

                    const trimmed = text.trim();

                    if (!trimmed) return;

                    if (isCourierChatNoiseText(trimmed, respCourierName)) {
                        return;
                    }



                    // 若本機剛發送過此訊息，同步更新「已讀」狀態後跳過重複新增

                    if (window.renderedChatMessagesSet.has(`user:${trimmed}`)) {
                        if (itemIsRead) {
                            markUserChatBubbleRead('liveActiveChatMessages', trimmed, uuid);
                        }
                        return;

                    }



                    const key = `${sender}:${trimmed}`;

                    if (!window.renderedChatMessagesSet.has(key)) {

                        window.renderedChatMessagesSet.add(key);

                        appendActiveChatBubble(sender, trimmed, true, itemIsRead);

                        if (sender === 'courier') {

                            hasNewCourierMsg = true;

                        }

                    } else if (sender === 'user' && itemIsRead) {
                        markUserChatBubbleRead('liveActiveChatMessages', trimmed, uuid);
                    }

                });



                if (hasNewCourierMsg) {

                    triggerCourierNewMessageAlert();

                }

                if (refreshBtn) {
                    refreshBtn.innerText = hasNewCourierMsg ? '📩 收到新訊息' : '✓ 已同步';
                    setTimeout(() => {
                        if (refreshBtn) {
                            refreshBtn.disabled = false;
                            refreshBtn.innerText = '🔄 檢查新訊息';
                        }
                    }, 1500);
                }

                return { ok: true, status: res.status || 'chat_active', hasNewCourierMsg };

            } catch(e) {

                console.warn('同步外送員訊息異常:', e);
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.innerText = '🔄 檢查新訊息';
                }
                return { ok: false, message: '連線異常，請稍後再試' };

            } finally {
                window._isSyncingActiveChat = false;
                if (refreshBtn && refreshBtn.innerText === '⏳ 同步中...') {
                    refreshBtn.disabled = false;
                    refreshBtn.innerText = '🔄 檢查新訊息';
                }
            }

        }



        // 收到外送員新訊息時的醒目動態提醒

        function triggerCourierNewMessageAlert() {

            const badge = document.getElementById('liveActiveChatBadge');

            if (badge) {

                badge.innerText = '📩 外送員有新訊息！';

                badge.style.background = '#fef08a';

                badge.style.color = '#854d0e';

                badge.style.fontWeight = 'bold';

                setTimeout(() => {

                    badge.innerText = window._activeChatConnectedUuid ? '已連線' : '未連線';

                    badge.style.background = window._activeChatConnectedUuid ? '#dcfce7' : '#f1f5f9';

                    badge.style.color = window._activeChatConnectedUuid ? '#16a34a' : '#64748b';

                }, 8000);

            }

            try {

                if (navigator.vibrate) navigator.vibrate([150, 80, 150]);

            } catch(e) {}

        }



        // 鍵盤輸入事件防護：嚴格避開中文輸入法 (IME 注音/拼音/倉頡) 選字 Enter 鍵早洩問題

        window.handleActiveChatKeydown = function(event) {

            if (event.key !== 'Enter') return;

            // 若處於中文組字選字中，或剛在 150ms 內完成選字 (防止 iOS/WebKit 在選字瞬間觸發 Enter 早洩)，或 keyCode 229

            if (window.isComposingChat || event.isComposing || event.keyCode === 229 || (Date.now() - (window.justComposedAt || 0) < 150)) {

                return;

            }

            event.preventDefault();

            triggerSendActiveMsg();

        };



        window.sendActiveQuickMsg = function(text) {

            if (window.isSendingCourierMsg) return;

            const input = document.getElementById('liveActiveChatInput');

            if (input) input.value = text;

            triggerSendActiveMsg();

        };



        window.triggerSendActiveMsg = async function() {

            // 防重複發送鎖：若正在傳送中，直接攔截，絕不重複發送

            if (window.isSendingCourierMsg) return;



            const input = document.getElementById('liveActiveChatInput');

            const sendBtn = document.getElementById('liveActiveSendBtn');

            if (!input || !input.value.trim()) return;



            const msg = input.value.trim();

            

            // 進入傳送鎖定狀態：防止傳送中繼續敲擊鍵盤或再次送出

            window.isSendingCourierMsg = true;

            input.disabled = true;

            if (sendBtn) {

                sendBtn.disabled = true;

                sendBtn.innerText = '傳送中...';

            }



            try {

                input.value = '';

                window.renderedChatMessagesSet.add(`user:${msg}`);

                appendActiveChatBubble('user', msg);



                const uuid = window.currentActiveOrderUuid || '';

                const res = await sendCourierMessage(uuid, msg, window.trackApiBase);

                if (!res || (!res.success && res.status !== 'success')) {

                    const errMsg = (res && (res.message || res.error)) || '通訊斷線中，請聯絡代訂處理';

                    appendActiveChatBubble('system', `⚠️ ${errMsg}`);

                } else {
                    // 發送成功後快速補拉兩次外送員回覆（3.5s / 8.5s），免等下輪定時輪詢
                    setTimeout(() => { if (window.currentActiveOrderUuid === uuid) syncActiveCourierChatMessages(uuid, window.trackApiBase, false); }, 3500);
                    setTimeout(() => { if (window.currentActiveOrderUuid === uuid) syncActiveCourierChatMessages(uuid, window.trackApiBase, false); }, 8500);
                }

            } catch(e) {

                appendActiveChatBubble('system', '⚠️ 通訊斷線中，請聯絡代訂處理');

            } finally {

                // 傳送結束解鎖

                window.isSendingCourierMsg = false;

                input.disabled = false;

                if (sendBtn) {

                    sendBtn.disabled = false;

                    sendBtn.innerText = '發送';

                }

                input.focus();

            }

        };



        function appendActiveChatBubble(sender, text, shouldSave = true, isRead = false) {

            const area = document.getElementById('liveActiveChatMessages');

            if (!area) return;

            const bubble = document.createElement('div');

            bubble.style.maxWidth = sender === 'user' ? '100%' : '80%';

            bubble.style.padding = '6px 10px';

            bubble.style.borderRadius = '10px';

            bubble.style.fontSize = '12px';

            bubble.style.lineHeight = '1.4';

            bubble.style.wordBreak = 'break-word';



            if (sender === 'user') {

                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.alignItems = 'flex-end';
                row.style.justifyContent = 'flex-end';
                row.style.gap = '5px';
                row.style.alignSelf = 'flex-end';
                row.style.maxWidth = '92%';

                const tag = document.createElement('span');
                tag.className = 'chat-read-tag';
                tag.dataset.userMsg = String(text || '').trim();
                tag.style.fontSize = '10px';
                tag.style.whiteSpace = 'nowrap';
                tag.style.marginBottom = '2px';
                tag.style.color = isRead ? '#059669' : '#94a3b8';
                tag.style.fontWeight = isRead ? '700' : '400';
                tag.innerText = isRead ? '✓ 已讀' : '已傳送';

                bubble.style.background = '#dcfce7';

                bubble.style.color = '#15803d';

                bubble.style.borderBottomRightRadius = '2px';

                bubble.innerHTML = `<strong>您：</strong>${text}`;

                row.appendChild(tag);
                row.appendChild(bubble);
                area.appendChild(row);

            } else if (sender === 'courier') {

                bubble.style.alignSelf = 'flex-start';

                bubble.style.background = '#e0f2fe';

                bubble.style.color = '#0369a1';

                bubble.style.borderBottomLeftRadius = '2px';

                const courierLabel = getActiveCourierDisplayName();
                const nameEl = document.createElement('strong');
                nameEl.className = 'courier-name-label';
                nameEl.innerText = `${courierLabel}：`;
                bubble.appendChild(nameEl);
                bubble.appendChild(document.createTextNode(String(text || '')));

                area.appendChild(bubble);

            } else {

                bubble.style.alignSelf = 'center';

                bubble.style.background = '#f1f5f9';

                bubble.style.color = '#64748b';

                bubble.style.fontSize = '10.5px';

                bubble.innerHTML = text;

                area.appendChild(bubble);

            }

            area.scrollTop = area.scrollHeight;



            // 自動保存至本地儲存 (重新整理不丟失)

            if (shouldSave && (sender === 'user' || sender === 'courier')) {

                saveChatMsgToStorage(window.currentActiveOrderUuid, sender, text, isRead);

            }

        }





        // 向後端查詢訂單 track_info 基礎資料 (支援多端點容錯備援)

        async function fetchTrackInfo(id, trackApiBase) {
            const uniqueEndpoints = resolveApiEndpoints(`/api/track_info?id=${encodeURIComponent(id)}`, trackApiBase);

            for (const ep of uniqueEndpoints) {
                try {
                    const res = await fetch(ep);
                    if (res.ok) {
                        return await res.json();
                    }
                    if (res.status === 404 || res.status === 400) {
                        try {
                            const errJson = await res.json();
                            if (errJson && errJson.status) return errJson;
                        } catch(e) {}
                    }
                } catch(e) {
                    console.warn(`[fetchTrackInfo] 端點連線失敗 (${ep}):`, e.message);
                }
            }
            return null;
        }



        async function checkStatus(isBackgroundRefresh = false) {

                if (!orderId && window.isMultiOrderMode && window.currentMultiUuidList) {

                    showUpperLayerSync(isBackgroundRefresh);

                    try {

                        await loadAndRenderMultiOrders(window.currentMultiUuidList, window.lastParsedData, window.lastTrackData, isBackgroundRefresh);

                    } finally {

                        hideUpperLayerSync();

                    }

                    return;

                }



                showUpperLayerSync(isBackgroundRefresh);



                try {

                    const data = await fetchTrackInfo(orderId, trackApiBase);

                    if (data && data.status === 'success') {

                        const parsedData = parseOrderText(data.text);

                        const orderTextSignature = `${data.text || ''}__${JSON.stringify(data.ext_order_ids || [])}`;

                        

                        const fallbackOrderUuid = extractOrderUuid(data.order_uuid) || 
                                                  extractOrderUuid(data.orderUuid) || 
                                                  extractOrderUuid(data.join_url) || 
                                                  extractOrderUuid(data.text);

                        let rawTrackUrls = (data.tracking_urls && data.tracking_urls.length > 0)
                            ? data.tracking_urls
                            : (data.tracking_url ? [data.tracking_url] : []);

                        // 自動修正 /checkout 或無效訂單網址為正式 orders 追蹤網址
                        rawTrackUrls = rawTrackUrls.map(u => {
                            if (u && u.includes('/checkout') && fallbackOrderUuid) {
                                return `https://www.ubereats.com/tw/orders/${fallbackOrderUuid}`;
                            }
                            return u;
                        });
                        if (rawTrackUrls.length === 0 && fallbackOrderUuid) {
                            rawTrackUrls = [`https://www.ubereats.com/tw/orders/${fallbackOrderUuid}`];
                        }

                        const validTrackUrls = rawTrackUrls.filter(u => u && u.trim() && !u.includes('/checkout') && u.trim() !== 'https://www.ubereats.com/tw/orders/' && u.trim() !== 'https://www.ubereats.com/tw/orders');

                        const hasTracking = validTrackUrls.length > 0;

                        const isMulti = (rawTrackUrls.length > 1) || (parsedData.isSplit && parsedData.splits && parsedData.splits.length > 1);

                        // 若為單一子單專屬檢視 (例如 ?id=parent-1)，在頁首呈現回到全團總覽之引導條
                        const subBannerEl = document.getElementById('subOrderParentBanner');
                        if (subBannerEl) {
                            const subMatch = (orderId || '').match(/^([a-f0-9\-]{36})-(\d+)$/i);
                            const parentId = data.parent_order_id || (subMatch ? subMatch[1] : null);
                            const binNum = subMatch ? subMatch[2] : (data.bin_index || '1');
                            if (parentId && parentId !== orderId && !isMulti) {
                                subBannerEl.innerHTML = `
                                    <div style="background: linear-gradient(135deg, #e8f5e9, #f1f8e9); border: 1.5px solid #a5d6a7; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 12px;">
                                        <div>
                                            <span style="font-weight: 800; font-size: 14px; color: #2e7d32;">📦 揪團多單專屬進度【多單 ${binNum}】</span>
                                            <div style="font-size: 11.5px; color: #555; margin-top: 2px;">此畫面專屬呈現您【多單 ${binNum}】之外送即時動態與取餐照片</div>
                                        </div>
                                        <a href="track.html?id=${parentId}" style="background: #2e7d32; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; padding: 6px 14px; border-radius: 20px; white-space: nowrap; box-shadow: 0 2px 4px rgba(46,125,50,0.25);">🌐 查看全團總覽</a>
                                    </div>
                                `;
                                subBannerEl.style.display = 'block';
                            } else {
                                subBannerEl.style.display = 'none';
                            }
                        }



                        // 若整筆訂單已被取消或刪除，且無任何有效追蹤網址，直接進入取消頁面
                        // （若具備有效追蹤網址，則必須繼續向 Uber Eats 查驗真實配送/送達狀態，避免誤判已送達的訂單）
                        if ((data.order_status === 'canceled' || data.order_status === 'deleted' || isOrderCanceled(data)) && !hasTracking) {
                            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
                            countdownState = null;

                            const cancelRes = {
                                isCanceled: true,
                                cancelTitle: data.cancel_reason || '訂單已取消',
                                cancelReason: data.cancel_reason || '此訂單已被取消或店家無法接單。',
                                storeName: parsedData.store || '合作店家'
                            };
                            renderCanceledStage(cancelRes, parsedData, data, '');
                            return;
                        }



                        // 僅在非 tracking 模式 (等待中/點餐中) 且內容發生實質變更時才重寫 orderTextArea

                        if (!hasTracking && window._lastRenderedOrderTextSig !== orderTextSignature) {

                            window._lastRenderedOrderTextSig = orderTextSignature;

                            orderTextArea.innerHTML = renderOrderDetails(parsedData, data.text, data.tracking_urls, [], data.ext_order_ids);

                            orderTextArea.style.backgroundColor = 'transparent';

                            orderTextArea.style.border = 'none';

                            orderTextArea.style.padding = '0';

                            orderTextArea.style.display = 'block';

                        }

                        

                        let statusHtml = '';

                        if (data.ext_order_id) {

                            statusHtml += `<p style='color: #666; font-size: 18px; margin-bottom: 5px;'>訂單編號: <strong style="color:#111; font-size:22px;">${data.ext_order_id}</strong></p>`;

                        }

                        

                        if (hasTracking) {

                            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

                            countdownState = null;



                            const trackingUrls = rawTrackUrls;



                            if (isMulti) {

                                await loadAndRenderMultiOrders(trackingUrls, parsedData, data, isBackgroundRefresh);

                                return;

                            } else {

                                // 單一訂單情況

                                window.lastParsedData = parsedData;
                                window.lastTrackData = data;
                                if (window._cardSwitchState && window._cardSwitchState.single && window._cardSwitchState.single.cursor >= 0) {
                                    if (await _pollSwitchedSingleCard()) return;
                                }
                                let primaryTrackUrl = trackingUrls[0];
                                let orderUuid = extractOrderUuid(primaryTrackUrl) || fallbackOrderUuid;
                                if ((!primaryTrackUrl || primaryTrackUrl.includes('/checkout') || !extractOrderUuid(primaryTrackUrl)) && orderUuid) {
                                    primaryTrackUrl = `https://www.ubereats.com/tw/orders/${orderUuid}`;
                                }
                                let activeRes = null;



                                if (orderUuid) {

                                    window.currentActiveOrderUuid = orderUuid;

                                    window.trackApiBase = trackApiBase;

                                    window.currentCookieSerial = data.cookie_serial || '';

                                    window.currentCookieAccountIndex = data.cookie_account_index || data.ext_order_id || '';



                                    // 🌟 核心：僅在初次進入且畫面上尚未繪製任何卡片時，才使用 loader！

                                    // 若畫面已經載入，讀取狀態純粹在畫面上層 (#globalSyncTopBar 與膠囊) 呈現，絕不覆蓋破壞文字！

                                    if (!window.hasRenderedOrderOnce) {

                                        statusArea.innerHTML = `

                                            <div class="loader"></div>

                                            <h3 style="color: #06c167; font-size: 18px; margin-top: 15px;">🛵 正在同步外送員即時動態...</h3>

                                            <p style="color: #666; font-size: 13px; margin-top: 5px;">正在連接外送員定位與配送狀態</p>

                                        `;

                                    }



                                    // 1. 優先查詢進行中即時座標與外送狀態

                                    activeRes = await fetchActiveOrder(orderUuid, primaryTrackUrl, trackApiBase);

                                    window._lastUberSyncTimestamp = Date.now();

                                    window._lastUberSyncStatus = (activeRes && activeRes.status !== 'error') ? 'ok' : 'error';

                                    if (typeof updateSyncSecondsBadge === 'function') updateSyncSecondsBadge();



                                    // A. 檢查是否已送達 (送達完成判定絕對優先，防止誤判為取消)
                                    if (activeRes && (activeRes.status === 'concluded' || activeRes.isDelivered || activeRes.orderPhase === 'COMPLETED')) {
                                        if (window.currentRenderedStage !== 'delivered') {
                                            console.log('🎉 檢測到外送夥伴已抵達送達！進一步獲取留置拍照與送達明細...');
                                            const termRes = await fetchTerminatedOrder(orderUuid, primaryTrackUrl, trackApiBase);
                                            const finalDeliveredData = _tagSwitchedLiveTransition((termRes && termRes.status === 'success') ? { ...activeRes, ...termRes } : activeRes, orderUuid);
                                            renderDeliveredStage(finalDeliveredData, parsedData, data, primaryTrackUrl);
                                        }
                                        return;
                                    }

                                    // B. 檢查是否為取消
                                    if (isOrderCanceled(activeRes)) {
                                        if (window.currentRenderedStage !== 'canceled') {
                                            console.log('❌ 檢測到外送行程已取消！切換至已取消階段');
                                            renderCanceledStage(activeRes, parsedData, data, primaryTrackUrl);
                                        }
                                        return;
                                    }





                                    // C. 檢查是否進行中 (店家接單備餐、外送員前往取餐或運送途中)

                                    const isActivelyProgressing = activeRes && activeRes.status === 'success' && !activeRes.isScheduled && activeRes.orderPhase !== 'SCHEDULED';

                                    if (isActivelyProgressing) {

                                        if (window.currentRenderedStage !== 'active') {

                                            console.log('🛵 檢測到外送進行中，渲染自製即時追蹤畫面');

                                            renderActiveDeliveryStage(activeRes, parsedData, data, orderUuid);

                                        }

                                        return;

                                    }



                                    // D. 檢查是否為預約排程單 (Scheduled Order) 或代訂前置點餐作業

                                    const isSingleSched = (activeRes && (activeRes.isScheduled || activeRes.status === 'scheduled' || activeRes.orderPhase === 'SCHEDULED')) ||

                                                          (!(activeRes && activeRes.status === 'success') && isScheduledOrder(parsedData.time, null, data.text));

                                    if (isSingleSched) {

                                        const isAsap = isAsapDelivery(parsedData?.time, data?.text, parsedData);

                                        const expectedStage = isAsap ? 'ordering_staging' : 'scheduled';

                                        const curSchedTime = isAsap ? (parsedData.time || '盡快送達') : ((activeRes && activeRes.scheduledTime) || parsedData.time || '預定時間');

                                        const curStore = (activeRes && activeRes.store && activeRes.store.name) || parsedData.store || '外送合作店家';

                                        const curAddress = (activeRes && activeRes.destination && activeRes.destination.address) || parsedData.address || '指定外送地址';



                                        const isSameSched = (

                                            window.currentRenderedStage === expectedStage &&

                                            window._lastRenderedOrderState &&

                                            window._lastRenderedOrderState.stage === expectedStage &&

                                            window._lastRenderedOrderState.schedTime === curSchedTime &&

                                            window._lastRenderedOrderState.storeName === curStore &&

                                            window._lastRenderedOrderState.address === curAddress &&

                                            window._lastRenderedOrderState.text === data.text

                                        );



                                        if (isSameSched) {

                                            // 🌟 核心：有更新才變動，沒更新完全不碰 DOM，徹底消除任何畫面跳動！

                                            console.log('⚡ 狀態無實質變更，跳過 DOM 重新渲染，保持畫面完全靜止');

                                            return;

                                        }



                                        console.log(isAsap ? '👨‍🍳 檢測到此訂單為「盡快送達」，渲染代訂點餐中階段' : '📅 檢測到此訂單為預約排程單，渲染預約展示階段');

                                        renderScheduledStage(parsedData, data, primaryTrackUrl, activeRes);

                                        return;

                                    }



                                    // 2. 備援查詢結單狀態 (Terminated)

                                    const termRes = await fetchTerminatedOrder(orderUuid, primaryTrackUrl, trackApiBase);

                                    if (isOrderCanceled(termRes)) {

                                        if (window.currentRenderedStage !== 'canceled') {

                                            renderCanceledStage(termRes, parsedData, data, primaryTrackUrl);

                                        }

                                        return;

                                    }

                                    if (termRes && termRes.status === 'success') {

                                        if (window.currentRenderedStage !== 'delivered') {

                                            renderDeliveredStage(termRes, parsedData, data, primaryTrackUrl);

                                        }

                                        return;

                                    }

                                }



                                // 備援預約排程單判定

                                const isSingleSchedFallback = !(activeRes && activeRes.status === 'success') && isScheduledOrder(parsedData.time, null, data.text);

                                if (isSingleSchedFallback) {

                                    if (window.currentRenderedStage !== 'scheduled') {

                                        console.log('📅 單筆訂單為預約排程單 (備援)，進入預約展示階段');

                                        renderScheduledStage(parsedData, data, primaryTrackUrl, activeRes);

                                    }

                                    return;

                                }



                                // 3. 進行中備援

                                if (window.currentRenderedStage !== 'active') {

                                    renderActiveDeliveryStage({

                                        eta: '計算中...',

                                        orderStatus: '訂單正在準備中 (外送即將出發)',

                                        courier: { name: '外送夥伴', vehicle: '即將前往取餐' },

                                        store: { name: parsedData.store || '合作店家' },

                                        destination: { address: parsedData.address || '指定外送地址' }

                                    }, parsedData, data, orderUuid);

                                }

                            }

                        } else if (data.order_status === 'used') {

                            const accTimeStr = data.accepted_time_hm || extractHM(data.accepted_at) || extractHM(data.timestamp);

                            const accElapsed = (typeof data.accept_elapsed_sec === 'number') ? data.accept_elapsed_sec : calcFallbackElapsedSec(data.accepted_at || data.timestamp);

                            countdownState = { mode: 'used', baseElapsedSec: accElapsed, syncLocalMs: Date.now() };



                            if (window.currentRenderedStage !== 'used') {

                                window.currentRenderedStage = 'used';

                                window.hasRenderedOrderOnce = true;

                                statusHtml += `
                                    <div class="card pad wait" style="text-align: center; padding: 24px 16px; margin-bottom: 14px;">
                                        <div class="loader" style="margin: 0 auto 14px;"></div>
                                        <div style="font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 6px;">👨‍🍳 正在為您的訂單點餐...</div>
                                        ${accTimeStr ? `<div style="font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 10px;">接單時間為 ${accTimeStr}</div>` : ''}
                                        <div id="countdownBox"></div>
                                    </div>
                                `;

                                statusArea.innerHTML = statusHtml;

                                startCountdownLoop();

                            }

                            // 統一由 initAutoRefreshWatchdog 倒數 15 秒排程更新，絕不在此私自 setTimeout 產生多重重複計時器

                        } else {

                            const subTimeStr = data.submitted_time_hm || extractHM(data.submitted_at) || extractHM(data.timestamp);

                            const waitElapsed = (typeof data.wait_elapsed_sec === 'number') ? data.wait_elapsed_sec : calcFallbackElapsedSec(data.submitted_at || data.timestamp);

                            countdownState = { mode: 'waiting', baseElapsedSec: waitElapsed, syncLocalMs: Date.now() };



                            const isSameWaiting = window.currentRenderedStage === 'waiting' &&

                                                  window._lastRenderedOrderState &&

                                                  window._lastRenderedOrderState.activityText === (data.latest_activity_text || '');



                            if (!isSameWaiting) {

                                window.currentRenderedStage = 'waiting';
                                const mainH2 = document.querySelector('.card h2');
                                if (mainH2) { mainH2.innerHTML = '📦 外送訂單追蹤'; mainH2.style.color = ''; }
                                const cardBox = document.querySelector('.card');
                                if (cardBox) cardBox.classList.remove('delivered-mode');

                                window.hasRenderedOrderOnce = true;

                                window._lastRenderedOrderState = {

                                    stage: 'waiting',

                                    activityText: data.latest_activity_text || ''

                                };

                                statusHtml += `
                                    <div class="card pad wait" style="text-align: center; padding: 24px 16px; margin-bottom: 14px;">
                                        <div class="loader" style="margin: 0 auto 14px;"></div>
                                        <div style="font-size: 18px; font-weight: 800; color: var(--amber); margin-bottom: 6px;">⏳ 等待代訂接單</div>
                                        <div style="font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 6px;">${data.latest_activity_text || '等待代訂接單中，目前代訂有空'}</div>
                                        ${subTimeStr ? `<div style="font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px;">送單時間：${subTimeStr}</div>` : ''}
                                        <div id="countdownBox"></div>
                                    </div>
                                `;

                                statusArea.innerHTML = statusHtml;

                                startCountdownLoop();

                            }

                            // 統一由 initAutoRefreshWatchdog 倒數 15 秒排程更新，絕不在此私自 setTimeout 產生多重重複計時器

                        }

                        window.lastParsedData = parsedData;

                        window.lastTrackData = data;

                    } else if (data && data.status) {

                        const candidateUuids = (orderId || '').split(',').map(s => s.trim()).filter(Boolean);

                        if (candidateUuids.length > 0 && candidateUuids.every(u => /^[0-9a-fA-F-]{36}$/.test(u))) {

                            if (candidateUuids.length > 1) {

                                await loadAndRenderMultiOrders(candidateUuids, null, null, isBackgroundRefresh);

                                return;

                            } else {

                                const singleU = candidateUuids[0];

                                const activeRes = await fetchActiveOrder(singleU, '', trackApiBase);

                                if (activeRes && (activeRes.status === 'concluded' || activeRes.isDelivered || activeRes.orderPhase === 'COMPLETED')) {
                                    const termRes = await fetchTerminatedOrder(singleU, '', trackApiBase);
                                    const finalData = _tagSwitchedLiveTransition((termRes && termRes.status === 'success') ? { ...activeRes, ...termRes } : activeRes, window.currentActiveOrderUuid);
                                    if (window.currentRenderedStage !== 'delivered') {
                                        renderDeliveredStage(finalData, {}, {}, `https://www.ubereats.com/tw/orders/${singleU}`);
                                    }
                                    return;
                                }

                                if (activeRes && activeRes.status === 'success') {
                                    if (window.currentRenderedStage !== 'active') {
                                        renderActiveDeliveryStage(activeRes, {}, {}, singleU);
                                    }
                                    return;
                                }

                                const termRes = await fetchTerminatedOrder(singleU, '', trackApiBase);

                                if (termRes && termRes.status === 'success') {

                                    if (window.currentRenderedStage !== 'delivered') {

                                        renderDeliveredStage(termRes, {}, {}, `https://www.ubereats.com/tw/orders/${singleU}`);

                                    }

                                    return;

                                }

                            }

                        }

                        if (!window.hasRenderedOrderOnce) {
                            statusArea.innerHTML = `
                                <div style="text-align:center; padding: 30px 15px;">
                                    <div style="font-size: 48px; margin-bottom: 12px;">🔍</div>
                                    <h3 style="color:#d9534f; font-size:20px; font-weight:bold; margin-bottom:8px;">找不到此訂單資訊</h3>
                                    <p style="color:#666; font-size:14px; line-height:1.6; margin-bottom:12px;">
                                        請確認訂單連結是否正確，或訂單尚未建立完成。<br>系統將每 6 秒自動重新檢查...
                                    </p>
                                </div>
                            `;
                        } else {

                            window._lastUberSyncStatus = 'error';

                            if (typeof updateSyncSecondsBadge === 'function') updateSyncSecondsBadge();

                        }

                        if (typeof autoRefreshRemainingSec !== "undefined") { autoRefreshRemainingSec = 6; if (typeof updateAutoRefreshDisplay === "function") updateAutoRefreshDisplay(); } // 統一由 watchdog 倒數控管 6 秒重試，不自行產生獨立計時器

                    } else {

                        if (!window.hasRenderedOrderOnce) {

                            statusArea.innerHTML = `<h3 style="color:red;">無法連線到伺服器</h3><p style="color:#666;">請確認您的網路連線 (將於 6 秒後自動重新檢查...)</p>`;

                        } else {

                            window._lastUberSyncStatus = 'error';

                            if (typeof updateSyncSecondsBadge === 'function') updateSyncSecondsBadge();

                        }

                        if (typeof autoRefreshRemainingSec !== "undefined") { autoRefreshRemainingSec = 6; if (typeof updateAutoRefreshDisplay === "function") updateAutoRefreshDisplay(); } // 統一由 watchdog 倒數控管 6 秒重試，不自行產生獨立計時器

                    }

                } catch(e) {

                    console.error('checkStatus 執行異常:', e);

                    if (!window.hasRenderedOrderOnce) {

                        statusArea.innerHTML = `<h3 style="color:red;">訂單載入異常</h3><p style="color:#666;">${e.message ? ('錯誤: ' + e.message) : '請確認您的網路連線'} (6 秒後自動重新檢查)...</p>`;

                    } else {

                        window._lastUberSyncStatus = 'error';

                        if (typeof updateSyncSecondsBadge === 'function') updateSyncSecondsBadge();

                    }

                    if (typeof autoRefreshRemainingSec !== "undefined") { autoRefreshRemainingSec = 6; if (typeof updateAutoRefreshDisplay === "function") updateAutoRefreshDisplay(); } // 統一由 watchdog 倒數控管 6 秒重試，不自行產生獨立計時器

                } finally {

                    hideUpperLayerSync();

                }

            }



            window.checkStatus = checkStatus;





            

            // 初次執行

            checkStatus();

        });

    
    // --- 點餐後自動轉址 3 秒自動關閉提示與計時器 (不影響聊天室單獨開啟) ---
    function initAutoCloseCountdown(seconds = 10) {
        let remain = (seconds && seconds > 0) ? seconds : 10;
        if (remain === 3) remain = 10;
        const banner = document.createElement('div');
        banner.id = 'autoCloseBanner';
        banner.style.cssText = 'position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:999999; background:rgba(15,23,42,0.94); color:#ffffff; padding:9px 16px; border-radius:30px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; box-shadow:0 10px 25px rgba(0,0,0,0.35); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); max-width:92%; white-space:nowrap; animation:gwPop 0.3s ease-out;';
        banner.innerHTML = `
            <span style="display:flex; align-items:center; gap:5px;">
              <span>✅ 訂單已建立！</span>
              <span id="closeCountdownText" style="color:#38bdf8; font-weight:700;">${remain}</span>
              <span>秒後返回聊天室</span>
            </span>
            <button id="cancelAutoCloseBtn" style="background:#334155; color:#f8fafc; border:none; padding:3px 10px; border-radius:12px; font-size:11px; cursor:pointer; font-weight:600; margin-left:4px;">留在此頁</button>
        `;
        document.body.appendChild(banner);

        let timer = setInterval(() => {
            remain--;
            const numEl = document.getElementById('closeCountdownText');
            if (numEl) numEl.innerText = remain;
            if (remain <= 0) {
                clearInterval(timer);
                timer = null;
                if (typeof liff !== 'undefined' && liff.closeWindow) {
                    try { liff.closeWindow(); } catch(e) {}
                }
            }
        }, 1000);

        const cancelBtn = document.getElementById('cancelAutoCloseBtn');
        if (cancelBtn) {
            cancelBtn.onclick = () => {
                if (timer) {
                    clearInterval(timer);
                    timer = null;
                }
                banner.innerHTML = `<span>👌 已取消自動關閉，您可以繼續查看外送進度</span>`;
                setTimeout(() => {
                    banner.style.transition = 'opacity 0.4s ease';
                    banner.style.opacity = '0';
                    setTimeout(() => banner.remove(), 400);
                }, 1800);
            };
        }
    }

</script>
