<!DOCTYPE html>

<html lang="zh-Hant">

<head>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="preconnect" href="https://api.9ysong.shop" crossorigin />
    <link rel="dns-prefetch" href="https://api.9ysong.shop" />
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- OpenLayers 9.2.4 開源即時地圖 (與 deliverymap 相同之高清晰 OpenStreetMap 核心) -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css" />

    <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>

    <script>

        function zoomPhoto(imgUrl) {
            const modal = document.getElementById('zoomModal');
            const modalImg = document.getElementById('zoomModalImg');
            if (modal && modalImg && imgUrl) {
                modalImg.src = imgUrl;
                modal.classList.add('show');
            }
        }
        window.zoomPhoto = zoomPhoto;

        function closeZoom() {
            const modal = document.getElementById('zoomModal');
            if (modal) modal.classList.remove('show');
        }
        window.closeZoom = closeZoom;

        window.sendMultiQuickMsg = function(msg) {
            const input = document.getElementById('multiChatInput');
            if (input) input.value = msg;
            triggerSendMultiMsg();
        };

        window.sendActiveQuickMsg = function(msg) {
            const input = document.getElementById('liveActiveChatInput');
            if (input) input.value = msg;
            triggerSendActiveMsg();
        };


        if (typeof ol === 'undefined') {

            document.write('<script src="https://unpkg.com/ol@v9.2.4/dist/ol.js"><\/script>');

        }

    </script>

    <title>訂單追蹤</title>

    <style>
:root{
  --bg:#edf0ec;
  --surface:#fff;
  --ink:#15211b;
  --ink-2:#52605a;
  --ink-3:#8a968f;
  --line:#dde3dd;
  --soft:#f5f7f4;
  --green:#0a6b49;
  --green-soft:#e3f2ea;
  --green-line:#b9dcc9;
  --amber:#b7650a;
  --amber-soft:#fdf1dc;
  --amber-line:#f1d29a;
  --red:#c2412d;
  --font:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",Roboto,sans-serif;
  --text:var(--ink);
  --muted:var(--ink-3);
  --border:var(--line);
  --primary:var(--green);
}
*{box-sizing:border-box;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--font);padding:0 0 40px}
.wrap{max-width:440px;margin:0 auto;padding:0 14px}

/* 頂部列 */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 16px) 2px 12px}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em}
.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px 5px 10px;font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:#16a36a;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,106,.55)}70%{box-shadow:0 0 0 6px rgba(22,163,106,0)}100%{box-shadow:0 0 0 0 rgba(22,163,106,0)}}

/* 卡片 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.pad{padding:18px}
.sec-title{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.rows{display:grid;gap:0}
.row{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.row svg{flex:none;width:20px;height:20px;margin-top:2px;color:var(--ink-3)}
.row small{display:block;font-size:12px;color:var(--ink-3);line-height:1.4}
.row b{font-weight:500;font-size:15px;word-break:break-word}

/* 英雄區：預計抵達 */
.hero{padding:22px 18px 18px;background:var(--green-soft);border-bottom:1px solid var(--green-line)}
.hero.prep{background:var(--amber-soft);border-color:var(--amber-line)}
.hero.plan{background:#e8f0fe;border-color:#c2d7fa}
.hero.cancel{background:#fee2e2;border-color:#fca5a5}
.hero .lead{margin:0;font-size:14px;font-weight:500;color:var(--green)}
.hero.prep .lead{color:var(--amber)}
.hero.plan .lead{color:#2563eb}
.hero.cancel .lead{color:var(--red)}
.eta{display:flex;align-items:baseline;gap:6px;margin:2px 0 4px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.eta strong{font-size:52px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.eta.is-range strong,.eta.sched strong{font-size:28px;letter-spacing:0;line-height:1.2}
.eta span{font-size:15px;font-weight:500;color:var(--ink-2)}
@media (max-width: 390px) {
  .eta strong{font-size:42px}
  .eta.is-range strong,.eta.sched strong{font-size:24px}
}
.hero .state{margin:0;font-size:16px;font-weight:700}

/* 進度 */
.steps{display:flex;align-items:flex-start;margin-top:18px}
.step{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:500;color:var(--ink-3)}
.step .dot{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:var(--surface);border:2px solid var(--line);color:var(--ink-3)}
.step svg{width:15px;height:15px}
.step.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.step.done,.step.now{color:var(--ink)}
.step.now .dot{border-color:var(--green);color:var(--green);box-shadow:0 0 0 4px rgba(10,107,73,.14)}
.prep .step.now .dot{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 4px rgba(183,101,10,.15)}
.bar{flex:1;height:2px;margin-top:14px;background:var(--line)}
.bar.done{background:var(--green)}

/* 取餐 PIN 票根 */
.ticket{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 18px 18px;padding:14px 18px;background:var(--ink);color:#fff;border-radius:14px}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--surface)}
.ticket::before{left:-8px}.ticket::after{right:-8px}
.ticket p{margin:0;font-size:13px;line-height:1.45;color:#c4cec8}
.ticket p b{display:block;color:#fff;font-size:14px;font-weight:700}
.pin{font:800 34px/1 var(--font);letter-spacing:.18em;font-variant-numeric:tabular-nums;padding-left:18px;border-left:1px dashed #5d6b64}

/* 地圖 */
#liveDeliveryMap{position:relative;height:230px;background:#e6ece4;touch-action:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:18px;height:0;border-top:3px solid var(--green)}
.legend i.dash{border-top:3px dashed #8fb3a2}
.legend .lg-dot{width:8px;height:8px;border-radius:50%;display:inline-block;border:none}
.legend .lg-dot.d-amb{background:var(--amber)}
.legend .lg-dot.d-grn{background:var(--green)}
.legend .lg-dot.d-blk{background:var(--ink)}

/* 外送夥伴 */
.courier{display:flex;align-items:center;gap:14px}
.avatar{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--green-soft);color:var(--green);flex-shrink:0;overflow:hidden}
.avatar svg{width:24px;height:24px}
.courier small{display:block;font-size:12px;color:var(--ink-3);line-height:1.4}
.courier b{display:block;font-size:16px;font-weight:700}
.courier span{font-size:13px;color:var(--ink-2)}

/* 聊天入口 */
.chat{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chat p{margin:0;font-size:14px;font-weight:700}
.chat p small{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.tag{font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink-3);border:1px solid var(--line)}

/* 按鈕 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 16px;border:0;border-radius:12px;background:var(--green);color:#fff;font:700 16px var(--font);text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500;margin-top:10px}
.btn:active{opacity:.85}
.btn svg{width:18px;height:18px}
a:focus-visible,button:focus-visible{outline:3px solid #2f8f6b;outline-offset:2px}

/* 等待接單 */
.wait{text-align:center;padding:34px 22px 26px}
.loader{width:44px;height:44px;margin:0 auto 18px;border:4px solid var(--green-soft);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wait h2{margin:0 0 6px;font-size:22px;font-weight:800}
.wait p{margin:0;color:var(--ink-2)}
.countdown{display:inline-block;margin-top:18px;padding:8px 18px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.meta{display:flex;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.meta b{color:var(--ink);font-weight:500}

/* 已送達 */
.done-hero{display:flex;align-items:center;gap:14px;padding:20px 18px;background:var(--green);color:#fff}
.done-hero.cancel{background:var(--red)}
.check{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff}
.check svg{width:26px;height:26px}
.done-hero h2{margin:0;font-size:22px;font-weight:800}
.done-hero p{margin:0;font-size:14px;opacity:.9}
.photo{display:grid;place-items:center;height:190px;border-radius:12px;background:linear-gradient(135deg,#dfe7e0,#cbd7cf);color:var(--ink-2);font-size:13px;text-align:center;overflow:hidden;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.cap{margin:8px 0 0;font-size:12px;color:var(--ink-3)}
.order-no{font-size:12px;color:var(--ink-3);text-align:center;margin:4px 0 0;word-break:break-all}

/* ============ 多單 ============ */
.sum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:0 2px}
.sum h2{margin:0;font-size:17px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,#16a36a);flex-shrink:0}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--tab-dot, var(--c, #16a36a));flex-shrink:0}
.s-go{--c:#16a36a}.s-prep{--c:#d98a1b}.s-done{--c:#16a36a}.s-plan{--c:#3a6fc0}.s-x{--c:#c2412d}
.badge{flex:none;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:var(--c,#16a36a);background:color-mix(in srgb,var(--c,#16a36a) 12%,#fff);border:1px solid color-mix(in srgb,var(--c,#16a36a) 30%,#fff)}
.badge.s-go,.s-go .badge{--c:#16a36a}
.badge.s-prep,.s-prep .badge{--c:#d98a1b}
.badge.s-done,.s-done .badge{--c:#16a36a}
.tab.c-0 i, .tabs .tab:nth-child(5n+1) i{--tab-dot:#16a36a}
.tab.c-1 i, .tabs .tab:nth-child(5n+2) i{--tab-dot:#d98a1b}
.tab.c-2 i, .tabs .tab:nth-child(5n+3) i{--tab-dot:#0284c7}
.tab.c-3 i, .tabs .tab:nth-child(5n+4) i{--tab-dot:#8b5cf6}
.tab.c-4 i, .tabs .tab:nth-child(5n+5) i{--tab-dot:#ea580c}
.tab.s-x i{--tab-dot:#c2412d!important}
.tab[aria-selected=true],.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.seg-l span.done{color:var(--ink-2);font-weight:600}
.badge.s-plan,.s-plan .badge{--c:#3a6fc0}
.badge.s-x,.s-x .badge{--c:#c2412d}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink-2);font:500 14px var(--font);cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.slider{position:relative;display:flex;gap:10px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px;scroll-snap-type:x mandatory;scroll-padding:0 14px;scrollbar-width:none;touch-action:pan-x pan-y}
.slider::-webkit-scrollbar{display:none}
.sub{flex:0 0 92%;scroll-snap-align:start;margin:0;display:flex;flex-direction:column}
.sub-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.sub-head h3{margin:0;font-size:18px;font-weight:800;word-break:break-word}
.sub .eta{margin:6px 0 2px}.sub .eta strong{font-size:38px}
.sub .state{margin:0 0 14px;font-size:14px;color:var(--ink-2)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg i{height:6px;border-radius:3px;background:var(--line)}
.seg i.on{background:var(--c,#16a36a)}
.seg-l{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 14px;font-size:12px;color:var(--ink-3)}
.seg-l .cur{color:var(--ink);font-weight:700}
.sub .row{padding:10px 0}
.pin-mini{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding:10px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px}
.pin-mini b{font-size:22px;font-weight:800;letter-spacing:.16em;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:14px}
.acts .btn{min-height:44px;font-size:15px;margin:0}
.acts .btn.ghost{margin:0}
.acts .btn[disabled]{opacity:.4;cursor:default}
.sub.x .eta strong{color:var(--ink-3);text-decoration:line-through}
.items{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.items summary{cursor:pointer;font-weight:500;color:var(--ink-2);list-style:none}
.items summary::after{content:"＋";float:right;color:var(--ink-3)}
.items[open] summary::after{content:"－"}
.items ul{list-style:none;margin:8px 0 0;padding:0}
.items li{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-2)}
.items li b{font-weight:500;color:var(--ink)}

/* 聊天抽屜 */
.sheet-bg{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(21,33,27,.5)}
.sheet-bg.open{display:flex}
.sheet{display:flex;flex-direction:column;width:100%;max-width:440px;height:min(78vh,620px);background:var(--surface);border-radius:20px 20px 0 0;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h b{display:block;font-size:16px}.sheet-h small{color:var(--ink-3);font-size:12px}
.x-btn{width:36px;height:36px;border:0;border-radius:50%;background:var(--soft);font-size:20px;color:var(--ink-2);cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.note{align-self:center;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.msg{max-width:80%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--green);border-color:var(--green);color:#fff;border-radius:16px 16px 4px 16px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 0;scrollbar-width:none}
.quick button{flex:none;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:#fff;font:500 13px var(--font);color:var(--ink-2);cursor:pointer}
.send{display:flex;gap:8px;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 14px)}
.send input{flex:1;min-width:0;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font:15px var(--font);background:var(--soft)}
.send .btn{width:auto;min-height:46px;padding:0 20px}

/* 放大燈箱 */
.zoom-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px;cursor:zoom-out}
.zoom-modal.show{display:flex}
.zoom-modal img{max-width:95vw;max-height:90vh;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);object-fit:contain}

/* 混淆切換器 */
.card-switch-btn{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;cursor:pointer}
.card-switch-btn.is-contact{background:#fef3c7;color:#92400e;border-color:#fde68a}
.multi-switch-notice-mount{font-size:12px;color:#b45309;padding:4px 0}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:360px){.eta strong{font-size:44px}.pin{font-size:28px}}
</style>

</head>

<body data-state="active">

<div class="wrap">
  <header class="top">
    <h1>訂單追蹤</h1>
    <button class="sync" id="autoRefreshFloatingPill" type="button" title="點擊立即重新整理" onclick="window.triggerManualRefresh && window.triggerManualRefresh()">
      <i></i><span>即時連線，<span id="autoRefreshSec">15</span> 秒後更新</span>
    </button>
  </header>

  <!-- 子單引導橫幅掛載點 -->
  <div id="subOrderParentBanner" style="display:none; margin-bottom:12px;"></div>

  <!-- 主外送追蹤卡片掛載點 -->
  <main class="card-root" id="trackStatusArea"></main>

  <!-- 餐點明細區塊 -->
  <div id="trackOrderText" style="margin-top:16px; display:none;"></div>
</div>

<!-- 多單外送員傳訊抽屜 (#multiChatModal) -->
<div class="sheet-bg" id="multiChatModal" aria-hidden="true" onclick="if(event.target===this)closeMultiChatModal()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="multiChatModalTitle" onclick="event.stopPropagation()">
    <div class="sheet-h">
      <div>
        <b id="multiChatModalTitle">外送夥伴</b>
        <small id="multiChatModalSubtitle">正在配送您的餐點</small>
      </div>
      <span class="badge s-go" id="multiChatModalBadge">已連線</span>
      <button class="x-btn" type="button" aria-label="關閉" onclick="closeMultiChatModal()">&times;</button>
    </div>
    <div class="msgs" id="multiChatMessages">
      <div class="note" id="multiChatConnectingTip">外送員已開始服務，有任何問題可以在這裡聯絡</div>
    </div>
    <div class="quick">
      <button type="button" onclick="sendMultiQuickMsg('路上小心，慢慢來！')">路上小心，慢慢來</button>
      <button type="button" onclick="sendMultiQuickMsg('到了請按電鈴')">到了請按電鈴</button>
      <button type="button" onclick="sendMultiQuickMsg('請放在門口')">請放在門口</button>
    </div>
    <div class="send">
      <input id="multiChatInput" placeholder="輸入訊息" aria-label="訊息" onkeydown="handleMultiChatKeydown(event)" />
      <button class="btn" id="multiChatSendBtn" type="button" onclick="triggerSendMultiMsg()">傳送</button>
    </div>
  </div>
</div>

<!-- 留置照片點擊放大燈箱 (Lightbox Modal) -->
<div id="zoomModal" class="zoom-modal" onclick="closeZoom()">
  <img id="zoomModalImg" src="" alt="放大照片" />
</div>

<!-- 外送放置位置與 GPS 座標抽屜 (#dropoffLocationModal) -->
<div class="sheet-bg" id="dropoffLocationModal" aria-hidden="true" style="z-index:60;" onclick="if(event.target===this)closeDropoffLocationModal()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dropoffModalTitle" onclick="event.stopPropagation()" style="height:auto; max-height:85vh;">
    <div class="sheet-h">
      <div>
        <b id="dropoffModalTitle">外送放置位置</b>
        <small id="dropoffModalSubtitle">送達現場與 GPS 座標</small>
      </div>
      <button class="x-btn" type="button" aria-label="關閉" onclick="closeDropoffLocationModal()">&times;</button>
    </div>
    <div style="padding:16px 18px 24px; overflow-y:auto; -webkit-overflow-scrolling:touch;">
      <!-- GPS 座標卡片 -->
      <div style="background:var(--page-bg,#f8fafc); border:1px solid var(--line,#e2e8f0); border-radius:12px; padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <div style="overflow:hidden;">
          <div style="font-size:11px; color:var(--ink-3,#64748b); font-weight:700; margin-bottom:2px;">📍 送達 GPS 座標</div>
          <div id="dropoffModalCoords" style="font-size:13.5px; font-weight:700; color:var(--ink,#0f172a); font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">--</div>
        </div>
        <button type="button" id="dropoffCopyCoordsBtn" class="btn ghost" style="width:auto; min-height:28px; padding:0 10px; font-size:12px; border-radius:99px; flex-shrink:0;" onclick="copyDropoffCoords()">
          複製座標
        </button>
      </div>

      <!-- 送達地址 -->
      <div style="font-size:13px; color:var(--ink-2,#334155); margin-bottom:12px; line-height:1.45; display:flex; gap:6px;">
        <span style="flex-shrink:0;">🏠</span>
        <div style="overflow:hidden; word-break:break-all;"><span style="color:var(--ink-3,#64748b);">目的地：</span><b id="dropoffModalAddress">--</b></div>
      </div>

      <!-- 地圖容器 (OpenLayers 互動地圖) -->
      <div style="margin-bottom:12px;">
        <div id="dropoffMapContainer" style="width:100%; height:200px; border-radius:12px; overflow:hidden; border:1px solid var(--line,#e2e8f0); position:relative; background:#f1f5f9;">
          <div id="dropoffMapPlaceholder" style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--ink-3); font-size:12px;">載入地圖中...</div>
        </div>
      </div>

      <!-- 現場留置照片 (若有的話) -->
      <div id="dropoffModalPhotoWrap" style="margin-bottom:16px; display:none;">
        <div style="font-size:11.5px; color:var(--ink-3,#64748b); font-weight:700; margin-bottom:4px;">📸 現場留置照片 (點擊放大)</div>
        <div style="border-radius:10px; overflow:hidden; max-height:140px; cursor:zoom-in; border:1px solid var(--line);" onclick="zoomPhoto(window._curDropoffPhotoUrl)">
          <img id="dropoffModalPhotoImg" src="" alt="現場留置照片" style="width:100%; height:100%; object-fit:cover; display:block;" />
        </div>
      </div>

      <!-- 操作按鈕列 -->
      <div style="display:flex; gap:8px;">
        <a id="dropoffGoogleMapLink" href="#" target="_blank" class="btn" style="flex:1; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:5px; font-weight:700;">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" style="width:14px; height:14px;"><path d="M10 18s6-5.2 6-10a6 6 0 10-12 0c0 4.8 6 10 6 10z"/><circle cx="10" cy="8" r="2"/></svg>
          Google 地圖導航 ↗
        </a>
        <button type="button" class="btn ghost" style="width:auto; min-width:70px; padding:0 14px;" onclick="closeDropoffLocationModal()">關閉</button>
      </div>
    </div>
  </div>
</div>

<script>

    // 嚴格禁用任何客端設備定位請求 (我們只需追蹤外送員與餐點進度，絕不索取客人個人定位)

    try {

        if (navigator.geolocation) {

            navigator.geolocation.getCurrentPosition = function(s, e) { if(e) e({code:1, message:'Disabled'}); };

            navigator.geolocation.watchPosition = function(s, e) { if(e) e({code:1, message:'Disabled'}); return 0; };

        }

    } catch(e) {}



        // 留置照片放大燈箱控制

        function zoomPhoto(imgUrl) {

            const modal = document.getElementById('zoomModal');

            const modalImg = document.getElementById('zoomModalImg');

            if (modal && modalImg && imgUrl) {

                modalImg.src = imgUrl;

                modal.classList.add('show');

            }

        }



        function closeZoom() {

            const modal = document.getElementById('zoomModal');

            if (modal) {

                modal.classList.remove('show');

            }

        }

        // 放置位置與送達 GPS 座標抽屜控制
        window._curDropoffCoords = '';
        window._curDropoffPhotoUrl = '';
        window._dropoffOlMap = null;
        window._dropoffOlSource = null;

        function openDropoffLocationModal(lat, lng, address, storeName, imgUrl) {
            const modal = document.getElementById('dropoffLocationModal');
            if (!modal) return;

            let parsedLat = (lat !== undefined && lat !== null && String(lat).trim() !== '' && String(lat) !== 'null' && String(lat) !== 'undefined') ? Number(lat) : null;
            let parsedLng = (lng !== undefined && lng !== null && String(lng).trim() !== '' && String(lng) !== 'null' && String(lng) !== 'undefined') ? Number(lng) : null;
            if (isNaN(parsedLat)) parsedLat = null;
            if (isNaN(parsedLng)) parsedLng = null;

            window._curDropoffCoords = (parsedLat && parsedLng) ? `${parsedLat}, ${parsedLng}` : '';
            window._curDropoffPhotoUrl = imgUrl || '';

            const subTitleEl = document.getElementById('dropoffModalSubtitle');
            if (subTitleEl) subTitleEl.textContent = storeName ? `${storeName} · 送達現場與座標` : '送達現場與 GPS 座標';

            const coordsEl = document.getElementById('dropoffModalCoords');
            const copyBtn = document.getElementById('dropoffCopyCoordsBtn');
            if (coordsEl) {
                if (parsedLat && parsedLng) {
                    coordsEl.textContent = `${parsedLat.toFixed(6)}, ${parsedLng.toFixed(6)}`;
                    if (copyBtn) copyBtn.style.display = 'inline-block';
                } else {
                    coordsEl.textContent = '無精確座標資訊（依地址定位）';
                    if (copyBtn) copyBtn.style.display = 'none';
                }
            }

            const addrEl = document.getElementById('dropoffModalAddress');
            if (addrEl) addrEl.textContent = address || '指定外送地址';

            const gMapLink = document.getElementById('dropoffGoogleMapLink');
            if (gMapLink) {
                if (parsedLat && parsedLng) {
                    gMapLink.href = `https://www.google.com/maps/search/?api=1&query=${parsedLat},${parsedLng}`;
                    gMapLink.style.display = 'inline-flex';
                } else if (address && address !== '指定外送地址') {
                    gMapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
                    gMapLink.style.display = 'inline-flex';
                } else {
                    gMapLink.style.display = 'none';
                }
            }

            const photoWrap = document.getElementById('dropoffModalPhotoWrap');
            const photoImg = document.getElementById('dropoffModalPhotoImg');
            if (photoWrap && photoImg) {
                if (imgUrl && String(imgUrl).trim() !== '' && String(imgUrl) !== 'null') {
                    photoImg.src = imgUrl;
                    photoWrap.style.display = 'block';
                } else {
                    photoWrap.style.display = 'none';
                    photoImg.src = '';
                }
            }

            modal.classList.add('open');
            modal.style.display = 'flex';

            _renderDropoffMap(parsedLat, parsedLng, address);
        }
        window.openDropoffLocationModal = openDropoffLocationModal;

        function closeDropoffLocationModal() {
            const modal = document.getElementById('dropoffLocationModal');
            if (modal) {
                modal.classList.remove('open');
                modal.style.display = 'none';
            }
        }
        window.closeDropoffLocationModal = closeDropoffLocationModal;

        function copyDropoffCoords() {
            const coords = window._curDropoffCoords;
            if (!coords) return;
            const btn = document.getElementById('dropoffCopyCoordsBtn');
            const onDone = () => {
                if (btn) {
                    const original = btn.textContent;
                    btn.textContent = '已複製 ✓';
                    setTimeout(() => { btn.textContent = original; }, 2000);
                }
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(coords).then(onDone).catch(() => {
                    fallbackCopyText(coords);
                    onDone();
                });
            } else {
                fallbackCopyText(coords);
                onDone();
            }
        }
        window.copyDropoffCoords = copyDropoffCoords;

        function fallbackCopyText(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            } catch (_e) {}
        }

        function _renderDropoffMap(lat, lng, address) {
            const container = document.getElementById('dropoffMapContainer');
            if (!container) return;

            if (lat && lng && typeof ol !== 'undefined' && ol.Map) {
                container.innerHTML = '';
                const center = ol.proj.fromLonLat([Number(lng), Number(lat)]);
                try {
                    if (!window._dropoffOlMap) {
                        const vectorSource = new ol.source.Vector();
                        const vectorLayer = new ol.layer.Vector({
                            source: vectorSource,
                            zIndex: 10
                        });
                        window._dropoffOlSource = vectorSource;
                        window._dropoffOlMap = new ol.Map({
                            target: 'dropoffMapContainer',
                            layers: [
                                new ol.layer.Tile({
                                    source: new ol.source.OSM()
                                }),
                                vectorLayer
                            ],
                            view: new ol.View({
                                center: center,
                                zoom: 17,
                                maxZoom: 19
                            }),
                            controls: (ol.control && ol.control.defaults) ? ol.control.defaults({ attribution: false, zoom: true }) : []
                        });
                    } else {
                        window._dropoffOlMap.setTarget('dropoffMapContainer');
                        window._dropoffOlMap.getView().setCenter(center);
                        window._dropoffOlMap.getView().setZoom(17);
                    }

                    window._dropoffOlSource.clear();
                    const pinFeature = new ol.Feature({
                        geometry: new ol.geom.Point(center)
                    });
                    pinFeature.setStyle(new ol.style.Style({
                        image: new ol.style.Circle({
                            radius: 9,
                            fill: new ol.style.Fill({ color: '#16a34a' }),
                            stroke: new ol.style.Stroke({ color: '#ffffff', width: 3.5 })
                        })
                    }));
                    window._dropoffOlSource.addFeature(pinFeature);

                    setTimeout(() => {
                        if (window._dropoffOlMap) window._dropoffOlMap.updateSize();
                    }, 120);
                    return;
                } catch (e) {
                    console.warn('Dropoff OL Map init error:', e);
                }
            }

            // Fallback: static tile or message
            if (lat && lng) {
                const x = Math.floor((Number(lng) + 180) / 360 * 32768);
                const y = Math.floor((1 - Math.log(Math.tan(Number(lat) * Math.PI / 180) + 1 / Math.cos(Number(lat) * Math.PI / 180)) / Math.PI) / 2 * 32768);
                const tileUrl = `https://a.basemaps.cartocdn.com/rastertiles/voyager/15/${x}/${y}.png?key=cb1_4rjx_1_2dc376e91234454a5297b6ba`;
                container.innerHTML = `
                    <div style="position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#e2e8f0;">
                        <img src="${tileUrl}" alt="送達地圖" style="width:100%; height:100%; object-fit:cover;" onerror="this.style.display='none';" />
                        <div style="position:absolute; font-size:24px; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));">📍</div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--ink-3,#64748b); font-size:12.5px; text-align:center; padding:16px;">
                        <div style="font-size:24px; margin-bottom:4px;">📍</div>
                        <div>無 GPS 經緯度座標記錄</div>
                        <div style="font-size:11px; margin-top:2px;">請點擊下方導航依地址開啟 Google 地圖</div>
                    </div>
                `;
            }
        }

        document.addEventListener('keydown', (e) => {

            if (e.key === 'Escape') {
                closeZoom();
                closeDropoffLocationModal();
            }

        });



        // 從網址或字串中解析 36 位 UUID

        function extractOrderUuid(urlOrStr) {

            if (!urlOrStr) return null;

            const regex = /[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/;

            let match = String(urlOrStr).match(regex);

            if (!match) {

                try {

                    const decoded = decodeURIComponent(decodeURIComponent(urlOrStr));

                    match = decoded.match(regex);

                } catch(e) {}

            }

            return match ? match[0].toLowerCase() : null;

        }

        // 規範並獲取正確的 Uber Eats 訂單追蹤網址 (防止誤用 /checkout 結帳頁網址)
        function resolveUberTrackingUrl(rawUrl, fallbackObj) {
            if (rawUrl && !rawUrl.includes('/checkout') && (extractOrderUuid(rawUrl) || rawUrl.includes('/orders/'))) {
                return rawUrl;
            }
            const uuid = extractOrderUuid(rawUrl) ||
                         extractOrderUuid(fallbackObj && (fallbackObj.orderUuid || fallbackObj.uuid || fallbackObj._orderUuid)) ||
                         extractOrderUuid(fallbackObj && (fallbackObj.order_uuid || fallbackObj.orderUuid || fallbackObj.join_url)) ||
                         extractOrderUuid(window.currentActiveOrderUuid);
            if (uuid) {
                return `https://www.ubereats.com/tw/orders/${uuid}`;
            }
            if (rawUrl && !rawUrl.includes('/checkout')) {
                return rawUrl;
            }
            return '';
        }



        // 向後端查詢已完成送達訂單資料

        

        // 向後端獲取進行中外送員即時定位與動態狀態

                // 統一解析 API 端點位址 (自動區分 localhost、9ysong.shop 靜態端、api.9ysong.shop 後端閘道)
        function resolveApiEndpoints(path, trackApiBase) {
            const endpoints = [];
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const isGithubPages = window.location.hostname === '9ysong.shop';

            if (trackApiBase && (!isGithubPages || trackApiBase !== window.location.origin)) {
                endpoints.push(`${trackApiBase}${path}`);
            }

            if (isLocal) {
                endpoints.push(path);
                endpoints.push(`http://127.0.0.1:5000${path}`);
                endpoints.push(`https://api.9ysong.shop${path}`);
            } else if (isGithubPages) {
                // 9ysong.shop 為 GitHub Pages 靜態託管無後端，絕對不可呼叫相對路徑 /api/ 與本機 5000 port，直接使用正式 API 閘道
                endpoints.push(`https://api.9ysong.shop${path}`);
            } else {
                endpoints.push(path);
                endpoints.push(`https://api.9ysong.shop${path}`);
            }
            return [...new Set(endpoints)];
        }

        async function fetchActiveOrder(uuid, rawUrl, trackApiBase) {

            const uniqueEndpoints = resolveApiEndpoints('/api/getActiveOrder', trackApiBase);



            for (const ep of uniqueEndpoints) {

                try {

                    const res = await fetch(ep, {

                        method: 'POST',

                        headers: { 'Content-Type': 'application/json' },

                        body: JSON.stringify({

                            orderUuid: uuid,

                            url: rawUrl

                        })

                    });

                    if (res.ok) {

                        return await res.json();

                    }

                } catch(err) {

                    console.warn(`查詢進行中端點異常 (${ep}):`, err);

                }

            }

            return { status: 'error', message: '無法連接任何進行中追蹤端點' };

        }



        // 向後端或 AUTUBUY 查詢該訂單之專屬 Cookie

        async function fetchOrderCookie(uuid, serial, index, trackApiBase) {

            const endpoints = resolveApiEndpoints('/api/get_order_cookie', trackApiBase);
            endpoints.push('https://api.9ysong.shop/api/cookie_db/get');
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                endpoints.push('http://localhost:8765/api/cookie_db/get');
            }



            for (const ep of [...new Set(endpoints)]) {

                try {

                    const u = new URL(ep, window.location.href);

                    if (uuid) u.searchParams.set('orderUuid', uuid);

                    if (serial) u.searchParams.set('serial', serial);

                    if (index) u.searchParams.set('index', index);

                    const res = await fetch(u.toString());

                    if (res.ok) return await res.json();

                } catch(e) {}

            }

            return null;

        }



        // 向外送員發送即時訊息

        async function sendCourierMessage(uuid, message, trackApiBase) {

            const uniqueEndpoints = resolveApiEndpoints('/api/sendCourierMessage', trackApiBase);



            for (const ep of uniqueEndpoints) {

                try {

                    const res = await fetch(ep, {

                        method: 'POST',

                        headers: { 'Content-Type': 'application/json' },

                        body: JSON.stringify({

                            orderUuid: uuid,

                            message: message,

                            serial: window.currentCookieSerial || '',

                            account_index: window.currentCookieAccountIndex || ''

                        })

                    });

                    if (res.ok) {

                        return await res.json();

                    }

                } catch(err) {

                    console.warn(`發送訊息端點異常 (${ep}):`, err);

                }

            }

            return { status: 'error', message: '通訊斷線中，請聯絡代訂處理' };

        }



        // 背景預熱外送員聊天室 (Warm Session：預先就緒對話視窗，提速至 1 秒秒傳)

        async function warmCourierChatSession(uuid, trackApiBase) {

            if (!uuid || window._chatSessionWarmed) return;

            window._chatSessionWarmed = true;

            const uniqueEndpoints = resolveApiEndpoints('/api/warmCourierChat', trackApiBase);

            for (const ep of uniqueEndpoints) {

                try {

                    fetch(ep, {

                        method: 'POST',

                        headers: { 'Content-Type': 'application/json' },

                        body: JSON.stringify({

                            orderUuid: uuid,

                            serial: window.currentCookieSerial || '',

                            account_index: window.currentCookieAccountIndex || ''

                        })

                    }).catch(() => {});

                    break;

                } catch(e) {}

            }

        }



        // 獲取外送員即時對話紀錄 (雙向通訊接收端)

        async function fetchCourierMessages(uuid, trackApiBase) {

            if (!uuid) return null;

            const uniqueEndpoints = resolveApiEndpoints('/api/getCourierMessages', trackApiBase);

            for (const ep of uniqueEndpoints) {

                try {

                    const res = await fetch(ep, {

                        method: 'POST',

                        headers: { 'Content-Type': 'application/json' },

                        body: JSON.stringify({

                            orderUuid: uuid,

                            serial: window.currentCookieSerial || '',

                            account_index: window.currentCookieAccountIndex || ''

                        })

                    });

                    if (res.ok) {

                        return await res.json();

                    }

                } catch(err) {

                    console.warn(`獲取對話訊息端點異常 (${ep}):`, err);

                }

            }

            return null;

        }



        async function fetchTerminatedOrder(uuid, rawUrl, trackApiBase) {

            const uniqueEndpoints = resolveApiEndpoints('/api/getTerminatedOrder', trackApiBase);

            

            for (const ep of uniqueEndpoints) {

                try {

                    const res = await fetch(ep, {

                        method: 'POST',

                        headers: { 'Content-Type': 'application/json' },

                        body: JSON.stringify({

                            orderUuid: uuid,

                            url: rawUrl

                        })

                    });

                    if (res.ok) {

                        const json = await res.json();

                        return json;

                    } else {

                        try {

                            const errJson = await res.json();

                            return errJson;

                        } catch(e) {

                            return { status: 'error', message: `HTTP ${res.status}` };

                        }

                    }

                } catch(err) {

                    console.warn(`查詢送達狀態端點失敗 (${ep}):`, err);

                }

            }

            return { status: 'error', message: '連線伺服器失敗' };

        }



                // 判斷訂單是否已被取消 (支援後端 isCanceled 標記、Uber Eats ILLUSTRATION_HEADER_CARD、以及「外送員為空」等特徵)
        function isOrderCanceled(term) {
            if (!term) return false;

            // 🌟 絕對防誤判：若訂單已被標記為送達或已完成，絕不可判為取消
            if (term.isDelivered === true || term.status === 'concluded' || term.orderPhase === 'COMPLETED') {
                return false;
            }

            // 若 API 回傳 error 但非明確的 Uber 取消標記，絕不可誤判為取消 (例如查無進行中外送資料)
            if (term.status === 'error' && term.isCanceled !== true) return false;

            // 明確取消標誌
            if (term.isCanceled === true || term.status === 'canceled' || term.status === 'deleted' ||
                term.order_status === 'canceled' || term.order_status === 'deleted' ||
                term.orderPhase === 'CANCELED' || term.isUntracked === true) {
                return true;
            }

            // 明確取消原因或標題
            const fullTitle = (term.cancelTitle || term.cancelReason || '').trim();
            if (fullTitle.includes('取消') || fullTitle.toLowerCase().includes('cancel')) return true;

            const orderTitle = (term.title || term.orderStatus || '').trim();
            if (orderTitle && (orderTitle.includes('訂單已取消') || orderTitle.includes('行程已取消') ||
                orderTitle.includes('外送已取消') || orderTitle.includes('店家無法接單') || orderTitle.includes('無法處理此訂單'))) {
                return true;
            }

            const rawData = term.raw?.data;
            if (rawData) {
                const feedItems = rawData.feed?.feedItems || [];
                // 檢查是否有 ILLUSTRATION_HEADER_CARD (通常為取消提示卡)
                for (const it of feedItems) {
                    if (it.type === 'ILLUSTRATION_HEADER_CARD') {
                        const ill = it.illustrationHeader || {};
                        const illTitle = ill.title || '';
                        const illSub = ill.subtitle || '';
                        const illImg = ill.imageUrl || '';
                        if (illTitle.includes('取消') || illTitle.toLowerCase().includes('cancel') ||
                            illSub.includes('無法處理') || illImg.toLowerCase().includes('cancel')) {
                            return true;
                        }
                    }
                }

                // 特徵判斷：Uber Eats 訂單被店家取消時，「外送員是空的」
                // (無 TERMINATED_ORDER_HEADER_CARD 送達卡，亦無 ACTIONABLE_MESSAGE_ROW 外送員列，且存在 ILLUSTRATION_HEADER_CARD)
                const hasTermHeader = feedItems.some(it => it.type === 'TERMINATED_ORDER_HEADER_CARD');
                const hasDriverRow = feedItems.some(it => it.type === 'ACTIONABLE_MESSAGE_ROW');
                const hasIllustration = feedItems.some(it => it.type === 'ILLUSTRATION_HEADER_CARD');
                if (!hasTermHeader && !hasDriverRow && hasIllustration) {
                    return true;
                }
            }

            // 特徵判斷：說明欄含有明確取消詞彙 (僅在 term.status === 'success' 或明確業務欄位中)
            if (term.status === 'success') {
                const sub = (term.subtitle || '');
                if (sub.includes('訂單已取消') || sub.includes('店家已取消') || sub.includes('無法處理此訂單')) {
                    return true;
                }
            }

            return false;
        }



        // 取得訂單取消詳細說明與圖示

        function getCancelInfo(term) {

            let cancelTitle = term?.cancelTitle || '';

            let cancelReason = term?.cancelReason || '';

            let cancelImage = term?.cancelImage || '';



            if (term?.isUntracked) {

                cancelTitle = cancelTitle || '未綁定追蹤網址 (已取消)';

                cancelReason = cancelReason || '此訂單尚未綁定 Uber 即時追蹤網址，視為取消訂單。';

                cancelImage = cancelImage || 'https://duyt4h9nfnj50.cloudfront.net/ontrip/merchant_centric_cancelation_1x.png';

                return { cancelTitle, cancelReason, cancelImage };

            }



            const rawData = term?.raw?.data;

            if (rawData) {

                const feedItems = rawData.feed?.feedItems || [];

                for (const it of feedItems) {

                    if (it.type === 'ILLUSTRATION_HEADER_CARD') {

                        const ill = it.illustrationHeader || {};

                        if (!cancelTitle && ill.title) cancelTitle = ill.title;

                        if (!cancelReason && ill.subtitle) cancelReason = ill.subtitle;

                        if (!cancelImage && ill.imageUrl) cancelImage = ill.imageUrl;

                    }

                }

            }

            if (!cancelTitle) cancelTitle = (term?.title && term.title.includes('取消')) ? term.title : '訂單已取消';

            if (!cancelReason && term?.subtitle && (term.subtitle.includes('無法處理') || term.subtitle.includes('取消'))) {

                cancelReason = term.subtitle;

            }

            if (!cancelReason) {

                cancelReason = '店家目前無法處理您的訂單，訂單已被取消。若有款項疑問請洽詢代訂客服。';

            }

            if (!cancelImage) {

                cancelImage = 'https://duyt4h9nfnj50.cloudfront.net/ontrip/merchant_centric_cancelation_1x.png';

            }

            return { cancelTitle, cancelReason, cancelImage };

        // 判斷是否為真正的外送門口留置照片 (過濾漢堡插圖等佔位圖)

        function isDropoffPhoto(url) {

            if (!url) return false;

            const u = String(url).toLowerCase();

            if (u.includes('uber_delivery_hamburger') || u.includes('/order/uber_') || u.includes('placeholder')) {

            }

        // 判斷是否為「盡快送達」非預約訂單 (即使 Uber API 回傳預約排程，實際為代訂點餐前置作業)
        function isAsapDelivery(timeStr, rawText, parsedData, splitObj) {
            const t = (splitObj?.time || timeStr || parsedData?.time || '').trim();
            if (t.includes('盡快') || t.includes('盡速')) {
                return true;
            }
            const full = ((rawText || '') + ' ' + (parsedData?.time || '') + ' ' + (splitObj?.time || '')).toLowerCase();
            if (/時間\s*[:：]\s*盡[快速]/.test(full) || /🕒\s*盡[快速]/.test(full) || /盡[快速]送達/.test(full)) {
                return true;
            }
            return false;
        }
        window.isAsapDelivery = isAsapDelivery;

        // 判斷訂單或子單是否為預約單 (預約排程)
        function isScheduledOrder(timeStr, splitObj, rawText) {
            // 🌟 核心：若時間或明細明確要求「盡快/盡速」，絕非預約單
            const combinedTime = (splitObj?.time || timeStr || '').trim();
            if (combinedTime.includes('盡快') || combinedTime.includes('盡速')) {
                return false;
            }
            if (isAsapDelivery(timeStr, rawText, null, splitObj)) {
                return false;
            }

            const t = (timeStr || '').toLowerCase();
            const st = splitObj ? ((splitObj.time || '') + ' ' + (splitObj.fees ? splitObj.fees.map(f=>f.name).join(' ') : '')) : '';
            const full = (t + ' ' + st + ' ' + (rawText || '')).toLowerCase();

            if (full.includes('預定折扣') || full.includes('預訂折扣') || full.includes('預約') || full.includes('預定') || full.includes('預訂')) {
                return true;
            }
            if (full.includes('明天') || full.includes('後天') || full.includes('下週') || full.includes('下周')) {
                return true;
            }
            if (combinedTime && !combinedTime.includes('盡快') && !combinedTime.includes('盡速') && !combinedTime.includes('歷史訂單合併查詢')) {
                if (combinedTime.includes('下午') || combinedTime.includes('上午') || combinedTime.includes('晚上') || combinedTime.includes('-') || combinedTime.includes('🌙') || combinedTime.includes('☀️')) {
                    return true;
                }
            }
            return false;
        }



        // ============================================================
        // 🔍 錯單混淆偵測、真實店家優先顯示、單卡獨立切換管理器 (方案 A/B)
        // ============================================================
        const _SWITCH_PLACEHOLDER_STORES = new Set([
            '', '外送合作店家', '合作店家', '未知店家', '外送商家', '指定店家',
            'ubereats', 'uber eats', 'store', 'unknown', 'none', 'null'
        ]);

        function _cleanSwitchStoreName(name) {
            const s = String(name || '').trim();
            return _SWITCH_PLACEHOLDER_STORES.has(s.toLowerCase()) ? '' : s;
        }

        function _normSwitchStoreName(name) {
            const raw = _cleanSwitchStoreName(name);
            if (!raw) return { raw: '', clean: '', brand: '', core: '' };
            let norm = '';
            try { norm = raw.normalize('NFKC').toLowerCase().trim(); } catch (e) { norm = raw.toLowerCase().trim(); }
            const brandRaw = norm.split(/[\s\(\)（）【】\[\]\-–—]+/)[0] || '';
            const punctRe = /[\s\-_・·•()（）\[\]【】「」『』.,，。:：\/\\&+'’"~〜!！?？]+/g;
            const clean = norm.replace(punctRe, '');
            const brand = brandRaw.replace(punctRe, '');
            let core = clean;
            const suffixRe = /(?:便當|飯包|飲料|茶飲|飲品|咖啡|牛排|火鍋|鍋物|臭臭鍋|鹽水雞|鹹水雞|早餐|早午餐|小吃店?|麵館|牛肉麵|餐廳|美食|門市|分店|專賣店)$/;
            for (let i = 0; i < 2; i++) {
                const stripped = core.replace(suffixRe, '');
                if (stripped.length >= 2 && stripped !== core) core = stripped;
                else break;
            }
            if (core.endsWith('店') && core.length >= 3) core = core.slice(0, -1);
            return { raw, clean, brand, core };
        }

        function _storesLikelyMatchFront(expected, actual) {
            const e = _normSwitchStoreName(expected);
            const a = _normSwitchStoreName(actual);
            if (!e.clean || !a.clean) return null;
            if (e.clean === a.clean) return true;
            if (Math.min(e.clean.length, a.clean.length) >= 2 && (e.clean.includes(a.clean) || a.clean.includes(e.clean))) return true;
            if (Math.min(e.brand.length, a.brand.length) >= 2 && ((e.brand && a.clean.includes(e.brand)) || (a.brand && e.clean.includes(a.brand)))) return true;
            if (Math.min(e.core.length, a.core.length) >= 2 && (e.core.includes(a.core) || a.core.includes(e.core))) return true;
            const s1 = e.core || e.clean;
            const s2 = a.core || a.clean;
            if (s1.length >= 2 && s2.length >= 2) {
                const bg1 = new Set();
                for (let i = 0; i < s1.length - 1; i++) bg1.add(s1.slice(i, i + 2));
                let inter = 0;
                const total2 = s2.length - 1;
                for (let i = 0; i < total2; i++) {
                    if (bg1.has(s2.slice(i, i + 2))) inter++;
                }
                if (bg1.size + total2 > 0 && ((2 * inter) / (bg1.size + total2)) >= 0.45) return true;
            }
            return false;
        }

        // 不禁止備援套用，僅確立「Uber 真實店家優先顯示」順位
        function _pickPreferredStoreName({ uberStore, orderStore, fallbackStore, defaultName = '外送合作店家' }) {
            return _cleanSwitchStoreName(uberStore)
                || _cleanSwitchStoreName(orderStore)
                || _cleanSwitchStoreName(fallbackStore)
                || defaultName;
        }

        function _extractSwitchUberStore(payload) {
            if (!payload || typeof payload !== 'object') return '';
            const explicit = _cleanSwitchStoreName(payload.uberStoreName || payload.realStoreName);
            if (explicit) return explicit;
            if (!payload.store && payload.storeName) {
                return _cleanSwitchStoreName(payload.storeName);
            }
            if ((payload.isDelivered || payload.isCanceled || payload.status === 'concluded' || payload.status === 'canceled') && payload.storeName && (!payload.store || payload.store.name !== payload.storeName)) {
                return _cleanSwitchStoreName(payload.storeName);
            }
            return '';
        }

        function _escJsAttr(s) {
            return escapeHtml(String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        }

        window._cardSwitchState = window._cardSwitchState || {};
        window._cardSwitchPromises = window._cardSwitchPromises || {};

        function _stopSingleLivePollTimer() {
            try {
                if (typeof liveActivePollTimer !== 'undefined' && liveActivePollTimer) {
                    clearInterval(liveActivePollTimer);
                    liveActivePollTimer = null;
                }
                if (typeof liveEtaCountdownTimer !== 'undefined' && liveEtaCountdownTimer) {
                    clearInterval(liveEtaCountdownTimer);
                    liveEtaCountdownTimer = null;
                }
            } catch (e) {}
        }

        function _getCardSwitchButtonSpec(state) {
            if (!state || (!state.suspected && state.cursor < 0)) return null;
            if (!state.checked && state.checking) {
                return { text: '比對可能訂單中...', isContact: false, disabled: true, loading: true };
            }
            const cands = Array.isArray(state.candidates) ? state.candidates : [];
            const n = cands.length;
            if (state.checked && n === 0) {
                return { text: '訂單有誤嗎?請聯絡代訂', isContact: true, disabled: false, loading: false };
            }
            if (state.cursor < 0) {
                return { text: '訂單錯了?點這試試', isContact: false, disabled: false, loading: false };
            }
            if (state.cursor < n - 1) {
                return { text: `還是不是?換下一筆 (${state.cursor + 1}/${n})`, isContact: false, disabled: false, loading: false };
            }
            return { text: '還是不是?請聯絡代訂', isContact: true, disabled: false, loading: false };
        }

        function _renderSwitchNoticeHtml(state, dismissFnExpr) {
            if (!state || !state.noticeMsg) return '';
            const cls = state.noticeType === 'info' ? 'card-switch-notice is-info' : 'card-switch-notice';
            return `
                <div class="${cls}">
                    <span>${escapeHtml(state.noticeMsg)}</span>
                    <button type="button" class="card-switch-notice-close" onclick="${dismissFnExpr}" title="關閉提示">✕</button>
                </div>
            `;
        }

        let _trackCandidatesDisabled = false;

        async function fetchTrackCandidates(payload) {
            if (_trackCandidatesDisabled) return null;
            const epList = resolveApiEndpoints('/api/track_candidates', window.trackApiBase);
            for (const ep of epList) {
                try {
                    const res = await fetch(ep, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.status === 404) {
                        _trackCandidatesDisabled = true;
                        console.warn('[TrackCandidates] 伺服器端點不存在 (404)，暫停後續卡片候選查詢');
                        return null;
                    }
                    if (res.ok) return await res.json();
                } catch (e) {
                    console.warn('[TrackCandidates] 端點查詢失敗:', ep, e);
                }
            }
            return null;
        }

        function _evaluateLocalConfusion(expectedStore, uberStoreName, hint) {
            const storeCmp = _storesLikelyMatchFront(expectedStore, uberStoreName);
            // 1. 若 Uber 真實店名與預期店名完全吻合，絕非錯單，一律排除！
            if (storeCmp === true) return false;

            // 2. 若 Uber 店名尚未自 API 載入 (null)，先暫緩判定，不急著顯示錯單按鈕
            if (storeCmp === null) return false;

            // 3. 店名明確不符 (false) 或 未吻合且有真實交叉衝突
            const hasStrictHint = Boolean(hint && (
                hint.cross_dup ||
                hint.ext_window_conflict
            ));
            return Boolean((storeCmp === false) || hasStrictHint);
        }

        function _ensureSwitchSlotState(slotKey, meta) {
            const existing = window._cardSwitchState[slotKey];
            const cacheKey = `${meta.orderId || ''}::${meta.origUuid || ''}::${slotKey}`;
            if (existing && existing._cacheKey === cacheKey) {
                if (meta.expectedStore && !existing.expectedStore) existing.expectedStore = meta.expectedStore;
                if (meta.uberStoreName && !existing.origUberStore) existing.origUberStore = meta.uberStoreName;
                if (existing.cursor < 0 && meta.origSnapshot) existing.origSnapshot = meta.origSnapshot;
                if (meta.hint && !existing.hint) existing.hint = meta.hint;
                const recheckSuspected = _evaluateLocalConfusion(existing.expectedStore, existing.origUberStore, existing.hint);
                if (existing.suspected !== recheckSuspected) {
                    existing.suspected = recheckSuspected;
                    if (!recheckSuspected && existing.cursor < 0) {
                        existing.checked = false;
                    }
                }
                return existing;
            }
            const suspected = _evaluateLocalConfusion(meta.expectedStore, meta.uberStoreName, meta.hint);
            const state = {
                _cacheKey: cacheKey,
                slotKey,
                origIndex: meta.origIndex || 0,
                orderId: meta.orderId || '',
                origUuid: meta.origUuid || '',
                expectedStore: meta.expectedStore || '',
                origUberStore: meta.uberStoreName || '',
                hint: meta.hint || null,
                origSnapshot: meta.origSnapshot || null,
                suspected,
                checked: false,
                checking: false,
                candidates: [],
                cursor: -1,
                noticeMsg: '',
                noticeType: 'warn',
                activeCandData: null,
            };
            window._cardSwitchState[slotKey] = state;
            return state;
        }

        async function _triggerCandidatesLookup(slotKey) {
            const state = window._cardSwitchState[slotKey];
            if (!state || !state.suspected || state.checked || !state.orderId) return state?.candidates || [];
            if (state.checking) {
                return (await window._cardSwitchPromises[state._cacheKey]) || [];
            }
            const reqKey = state._cacheKey;
            state.checking = true;
            _refreshSwitchUiForSlot(slotKey);

            const p = fetchTrackCandidates({
                orderId: state.orderId,
                subIndex: state.origIndex,
                currentUuid: state.origUuid,
                expectedStore: state.expectedStore,
                currentUberStore: state.origUberStore,
            }).then(res => {
                const cur = window._cardSwitchState[slotKey];
                if (!cur || cur._cacheKey !== reqKey) return [];
                cur.checking = false;
                cur.checked = true;
                if (res && res.status === 'ok') {
                    cur.candidates = Array.isArray(res.candidates) ? res.candidates : [];
                    if (!res.suspected && cur.candidates.length === 0 && _storesLikelyMatchFront(cur.expectedStore, cur.origUberStore) !== false) {
                        cur.suspected = false;
                    }
                } else {
                    cur.candidates = [];
                }
                _refreshSwitchUiForSlot(slotKey);
                return cur.candidates;
            }).catch(err => {
                const cur = window._cardSwitchState[slotKey];
                if (!cur || cur._cacheKey !== reqKey) return [];
                cur.checking = false;
                cur.checked = true;
                cur.candidates = [];
                _refreshSwitchUiForSlot(slotKey);
                return [];
            }).finally(() => {
                delete window._cardSwitchPromises[reqKey];
            });

            window._cardSwitchPromises[reqKey] = p;
            return await p;
        }

        function _makeMultiSlotKey(uuidOrKey, i) {
            if (typeof uuidOrKey === 'string' && uuidOrKey.startsWith('sub_')) return uuidOrKey;
            return 'sub_' + (i ?? 0);

        function _findMultiCardBySlotKey(slotKey, idx) {

            for (const c of cards) {

        function _findMultiTabBySlotKey(slotKey, idx) {

        function _resolveCurrentTrackOrderId() {

        function _attachSingleConfusionSwitchUI(stageName, renderPayload, parsedData, data, primaryUrl, explicitUuid = '') {

        async function _fetchAndRenderSingleCandidate(state, cand) {
            const snap = state.origSnapshot || {};
            const parsedData = snap.parsedData || window.lastParsedData || { address: '', items: [] };
            const trackData = snap.data || window.lastTrackData || {};
            const candUuid = cand.uuid;
            const candUrl = `https://www.ubereats.com/tw/orders/${candUuid}`;

            let activeRes = null;
            try {
                activeRes = await fetchActiveOrder(candUuid, candUrl, window.trackApiBase);
            } catch (e) {}

            const isActDelivered = Boolean(activeRes && (activeRes.status === 'concluded' || activeRes.isDelivered || activeRes.orderPhase === 'COMPLETED'));
            const isActCanceled = Boolean(activeRes && isOrderCanceled(activeRes));
            const isActScheduled = Boolean(activeRes && (activeRes.status === 'scheduled' || activeRes.isScheduled || activeRes.orderPhase === 'SCHEDULED'));
            const isActLive = Boolean(activeRes && activeRes.status === 'success' && !isActDelivered && !isActCanceled && !isActScheduled);

            let termRes = null;
            if (!isActLive || !activeRes?.uberStoreName) {
                try {
                    termRes = await fetchTerminatedOrder(candUuid, candUrl, window.trackApiBase);
                } catch (e) {}
            }

            const mergedMeta = {
                _isSwitched: true,
                _candOrderStoreName: cand.orderStoreName || '',
                _candFallbackStoreName: cand.fallbackStoreName || '',
                _candPinCode: cand.pinCode || '',
            };
            const mergedPin = (activeRes && (activeRes.pinCode || activeRes.courier?.pinCode)) || cand.pinCode || '';
            state.activeCandData = {
                uuid: candUuid,
                pinCode: mergedPin,
                realStoreName: _cleanSwitchStoreName((activeRes && activeRes.uberStoreName) || (termRes && termRes.storeName) || cand.realStoreName),
            };

            if (isActCanceled || (!isActLive && !isActDelivered && ((termRes && isOrderCanceled(termRes)) || cand.isCanceled))) {
                const payload = { ...(activeRes || {}), ...(termRes || {}), ...mergedMeta, orderUuid: candUuid };
                if (!payload.uberStoreName && !payload.storeName && cand.realStoreName) payload.uberStoreName = cand.realStoreName;
                window.currentActiveOrderUuid = candUuid;
                renderCanceledStage(payload, parsedData, trackData, candUrl);
                return;
            }
            if (isActDelivered || (termRes && termRes.status === 'success' && !isOrderCanceled(termRes)) || (!activeRes && cand.isDelivered)) {
                const payload = { ...(activeRes || {}), ...(termRes || {}), ...mergedMeta, orderUuid: candUuid, isDelivered: true };
                if (!payload.uberStoreName && !payload.storeName && cand.realStoreName) payload.uberStoreName = cand.realStoreName;

                return { badge: '已取消', stateText: '店家無法接單', stepIndex: 0, statusClass: 's-x', step: 0 };
            }
            if (term.isDelivered || term.status === 'concluded' || term.orderPhase === 'COMPLETED') {
                return { badge: '已送達', stateText: '好好享用您的餐點！', stepIndex: 4, statusClass: 's-done', step: 4 };
            }
            const st = String(term.orderStatus || '').toLowerCase();
            const isPrep = st.includes('準備') || st.includes('備餐') || st.includes('領取訂單') || st.includes('前往店家') || st.includes('等待取餐') || (term.progress && term.progress.current <= 2);
            if (isPrep) {
                return { badge: '備餐中', stateText: '商家正在準備餐點', stepIndex: 2, statusClass: 's-prep', step: 2 };
            }
            if (term.isScheduled || term.status === 'scheduled' || term.orderPhase === 'SCHEDULED') {
                return { badge: '預約排程', stateText: '預約訂單已成立', stepIndex: 1, statusClass: 's-plan', step: 1 };
            }
            return { badge: '外送中', stateText: '外送夥伴正前往您的地址', stepIndex: 3, statusClass: 's-go', step: 3 };
        }



        // 批量查詢多單即時進度（1 次請求取回所有子單，若舊版後端不支援則自動回退單筆模式）
        async function fetchActiveOrdersBatch(uuids, trackApiBase) {
            const cleanUuids = [...new Set((uuids || []).map(u => extractOrderUuid(u) || String(u || '').trim()).filter(Boolean))];
            if (cleanUuids.length === 0) return null;
            const uniqueEndpoints = resolveApiEndpoints('/api/getActiveOrdersBatch', trackApiBase);
            for (const ep of uniqueEndpoints) {
                try {
                    const res = await fetch(ep, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ uuids: cleanUuids })
                    });
                    if (res.ok) {
                        const json = await res.json();
                        if (json && json.status === 'success' && json.results) {
                            return json.results;
                        }
                    }
                } catch (err) {
                    console.warn(`[fetchActiveOrdersBatch] 批量端點退回單筆模式 (${ep}):`, err);
                }
            }
            return null;
        }

        async function getSubOrderStatus(uuid, url, trackApiBase, prefetchedActiveRes = null) {
            if (!uuid || !url || url === 'https://www.ubereats.com/tw/orders/' || url === 'https://www.ubereats.com/tw/orders') {
                const isParentActive = window.lastTrackData && ['new', 'used'].includes(window.lastTrackData.order_status);
                if (isParentActive) {
                    return {
                        status: 'waiting',
                        orderUuid: '',
                        url: '',
                        isCanceled: false,
                        isUntracked: false,
                        title: '待代訂下單中',
                        badge: '點餐中',
                        isLiveActive: false
                    };
                }
                return {
                    status: 'canceled',
                    orderUuid: '',
                    url: '',
                    isCanceled: true,
                    isUntracked: true,
                    cancelTitle: '未綁定追蹤網址 (已取消)',
                    cancelReason: '訂單未綁定 Uber 即時追蹤網址，視為取消訂單。',
                    isLiveActive: false
                };
            }

            // 0. 前端快取檢查 (僅真正「已送達」訂單永久快取；已取消絕不快取，避免尚未點餐誤判後無法自動恢復)
            window._FRONTEND_SUB_CACHE = window._FRONTEND_SUB_CACHE || {};
            if (uuid && window._FRONTEND_SUB_CACHE[uuid]) {
                const cached = window._FRONTEND_SUB_CACHE[uuid];
                if (cached.isDelivered && !cached.isCanceled) {
                    return { ...cached, url, orderUuid: uuid };
                }
            }

            try {
                // 1. 優先查詢進行中狀態 (支援 Batch 預取快取，即時 GPS、ETA、備餐/取餐/外送中狀態、PIN碼、外送員)
                const activeRes = prefetchedActiveRes || await fetchActiveOrder(uuid, url, trackApiBase);

                // 預約排程單：getActiveOrder 已直接回傳完整預約資訊與餐點明細，絕不重複呼叫 getTerminatedOrder！
                if (activeRes && (activeRes.status === 'scheduled' || activeRes.isScheduled === true)) {
                    return { ...activeRes, url, orderUuid: uuid, isScheduled: true, isDelivered: false, isCanceled: false, isLiveActive: false };
                }

                if (activeRes && (activeRes.status === 'success' || activeRes.status === 'concluded' || activeRes.isDelivered || activeRes.orderPhase === 'COMPLETED')) {
                    if (activeRes.isDelivered || activeRes.status === 'concluded' || activeRes.orderPhase === 'COMPLETED') {
                        // 後端已具備 terminated 24小時快取，若有留置照片則合併，否則非同步背景獲取
                        const termRes = await fetchTerminatedOrder(uuid, url, trackApiBase);
                        const finalRes = { ...activeRes, ...(termRes && termRes.status === 'success' ? termRes : {}), url, orderUuid: uuid, isDelivered: true, isCanceled: false, isLiveActive: false };
                        window._FRONTEND_SUB_CACHE[uuid] = finalRes;
                        return finalRes;
                    }

                    if (isOrderCanceled(activeRes)) {
                        // 已取消不寫入永久前端快取，避免尚未點餐誤判取消後無法恢復
                        return { ...activeRes, url, orderUuid: uuid, isCanceled: true, isDelivered: false, isLiveActive: false };
                    }

                    return { ...activeRes, url, orderUuid: uuid, isLiveActive: true };
                }

                // 2. 備援查 terminated (已結單或取消)
                const termRes = await fetchTerminatedOrder(uuid, url, trackApiBase);
                if (termRes && (termRes.isDelivered || (termRes.status === 'success' && !isOrderCanceled(termRes)))) {
                    const finalRes = { ...termRes, url, orderUuid: uuid, isDelivered: true, isCanceled: false, isLiveActive: false };
                    window._FRONTEND_SUB_CACHE[uuid] = finalRes;
                    return finalRes;
                }
                if (isOrderCanceled(termRes)) {
                    // 已取消不寫入永久前端快取，避免尚未點餐誤判取消後無法恢復
                    return { ...termRes, url, orderUuid: uuid, isCanceled: true, isDelivered: false, isLiveActive: false };
                }

                return { ...(activeRes || {}), ...(termRes || {}), url, orderUuid: uuid, status: 'unknown', isLiveActive: false };
            } catch(e) {
                return { status: 'error', message: String(e), url, orderUuid: uuid };
            }
        }

        async function syncMultiChatMessages(uuid) {

            if (!uuid) return;

            try {

                const res = await fetchCourierMessages(uuid, window.trackApiBase);

                if (!res || res.status === 'error' || res.success === false) {
                    const offlineKey = `system_offline_${uuid}`;
                    if (!window.renderedChatMessagesSet.has(offlineKey)) {
                        window.renderedChatMessagesSet.add(offlineKey);
                        appendMultiChatBubble('courier', '⚠️ 通訊斷線中，請聯絡代訂處理', true);
                    }
                    return;
                }

                const msgs = (res.data && res.data.chatMessages) || res.chatMessages || [];
                const respCourierName = (res.data && res.data.courierName) || '';
                const cleanMultiName = (typeof cleanCourierDisplayName === 'function') ? cleanCourierDisplayName(respCourierName) : '';
                if (cleanMultiName) {
                    window.activeMultiChatCourierName = cleanMultiName;
                    if (typeof refreshCourierBubbleNames === 'function') refreshCourierBubbleNames('multiChatMessages', cleanMultiName);
                }

                msgs.forEach(item => {

                    const text = (typeof item === 'string') ? item : (item.text || '');

                    let sender = (typeof item === 'object' && item.sender) ? item.sender : 'courier';

                    const itemIsRead = Boolean(typeof item === 'object' && (item.isRead || String(item.readStatus || '').toUpperCase() === 'READ'));

                    const trimmed = text.trim();

                    if (!trimmed) return;
                    if (typeof isCourierChatNoiseText === 'function' && isCourierChatNoiseText(trimmed, respCourierName)) return;

                    if (window.renderedChatMessagesSet.has(`user:${trimmed}`)) {
                        if (itemIsRead && typeof markUserChatBubbleRead === 'function') {
                            markUserChatBubbleRead('multiChatMessages', trimmed, uuid);
                        }
                        return;
                    }

                    const key = `${sender}:${trimmed}`;

                    if (!window.renderedChatMessagesSet.has(key)) {

                        window.renderedChatMessagesSet.add(key);

                        appendMultiChatBubble(sender, trimmed, true, itemIsRead);

                    } else if (sender === 'user' && itemIsRead && typeof markUserChatBubbleRead === 'function') {
                        markUserChatBubbleRead('multiChatMessages', trimmed, uuid);
                    }

                });

            } catch(e) {}

        }
