        function fitDeliveryMapExtent(points) {

            if (!liveMap || !points || points.length === 0) return;

            if (points.length === 1) {

                liveMap.getView().setCenter(ol.proj.fromLonLat([Number(points[0][0]), Number(points[0][1])]));

                liveMap.getView().setZoom(15);

                return;

            }

            const extent = ol.extent.createEmpty();

            points.forEach(pt => {

                const p = ol.proj.fromLonLat([Number(pt[0]), Number(pt[1])]);

                ol.extent.extend(extent, [p[0], p[1], p[0], p[1]]);

            });

            liveMap.getView().fit(extent, {

                padding: [50, 50, 50, 50],

                maxZoom: 16,

                duration: 300

            });

        }



        function initActiveDeliveryMap(activeData, parsedData) {

            try {

                if (typeof ol === 'undefined') {

                    console.warn('OpenLayers 尚未加載完成，500ms 後重試...');

                    setTimeout(() => {

                        if (typeof ol !== 'undefined') initActiveDeliveryMap(activeData, parsedData);

                    }, 500);

                    return;

                }

                const container = document.getElementById('liveDeliveryMap');

                if (!container) return;



                if (liveMap) {

                    try { liveMap.setTarget(null); } catch(e) {}

                    liveMap = null;

                }

                container.innerHTML = '';



                const c = activeData.courier || {};

                const s = activeData.store || {};

                const d = activeData.destination || {};



                const cLat = Number(c.latitude) || null;

                const cLng = Number(c.longitude) || null;

                const sLat = Number(s.latitude) || null;

                const sLng = Number(s.longitude) || null;

                const dLat = Number(d.latitude) || null;

                const dLng = Number(d.longitude) || null;



                const centerLat = cLat || sLat || dLat || 22.736;

                const centerLng = cLng || sLng || dLng || 120.33;



                // 1. OSM 官方標準圖磚 (與 deliverymap 相同，清晰道路編號與全台繁中標注，中心優先載入)

                const osmSource = new ol.source.OSM({

                    crossOrigin: 'anonymous',

                    attributions: '地圖資料 © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>',

                    tileLoadFunction: (tile, src) => {

                        const img = tile.getImage();

                        if (img instanceof HTMLImageElement) {

                            img.crossOrigin = 'anonymous';

                            img.onerror = () => {

                                if (!tile._hasTriedFallback) {

                                    tile._hasTriedFallback = true;

                                    img.src = src.replace('tile.openstreetmap.org', 'a.tile.openstreetmap.fr/osmfr');

                                }

                            };

                            img.src = src;

                        }

                    },

                    tilePriorityFunction: (tile, source, tileCenter, tileResolution) => {

                        if (!liveMap) return Infinity;

                        const viewCenter = liveMap.getView().getCenter();

                        if (!viewCenter) return Infinity;

                        return Math.sqrt(

                            Math.pow(tileCenter[0] - viewCenter[0], 2) +

                            Math.pow(tileCenter[1] - viewCenter[1], 2)

                        );

                    }

                });



                const osmLayer = new ol.layer.Tile({

                    source: osmSource,

                    zIndex: 1

                });



                // 2. 外送員真實行駛軌跡圖層 (藍色高光實線，100% 本地即時繪製)

                liveTrajectorySource = new ol.source.Vector();

                liveTrajectoryLine = new ol.layer.Vector({

                    source: liveTrajectorySource,

                    style: new ol.style.Style({

                        stroke: new ol.style.Stroke({

                            color: '#2563eb',

                            width: 5,

                            lineCap: 'round',

                            lineJoin: 'round'

                        })

                    }),

                    zIndex: 10

                });



                // 3. 預估道路導航路線 (綠色虛線)

                liveNavigationSource = new ol.source.Vector();

                liveNavigationLine = new ol.layer.Vector({

                    source: liveNavigationSource,

                    style: new ol.style.Style({

                        stroke: new ol.style.Stroke({

                            color: '#06c167',

                            width: 5,

                            lineDash: [6, 8],

                            lineCap: 'round',

                            lineJoin: 'round'

                        })

                    }),

                    zIndex: 8

                });



                // 4. 建立 OpenLayers 地圖實例

                liveMap = new ol.Map({

                    target: 'liveDeliveryMap',

                    layers: [osmLayer, liveNavigationLine, liveTrajectoryLine],

                    view: new ol.View({

                        center: ol.proj.fromLonLat([centerLng, centerLat]),

                        zoom: 15,

                        minZoom: 8,

                        maxZoom: 19,

                        enableRotation: false

                    }),

                    controls: [

                        new ol.control.Zoom(),

                        new ol.control.Attribution({ collapsible: true })

                    ]

                });



                window.liveMap = liveMap;

                // 初始化 Popup 氣泡

                setupLiveMapPopup();



                const extentPoints = [];



                // 目的地

                if (dLat && dLng) {

                    const destCoord = ol.proj.fromLonLat([dLng, dLat]);

                    const destEl = createDestOverlayElement(d.address || parsedData.address);

                    destEl.onclick = function(e) {

                        e.stopPropagation();

                        showLiveMapPopup(destCoord, `<b>📍 送達地點</b><br><span style="font-size:12px;color:#475569;">${d.address || parsedData.address || ''}</span>`);

                    };

                    liveDestMarker = new ol.Overlay({

                        element: destEl,

                        position: destCoord,

                        positioning: 'center-center',

                        stopEvent: false

                    });

                    liveMap.addOverlay(liveDestMarker);

                    extentPoints.push([dLng, dLat]);

                }



                // 店家

                if (sLat && sLng) {

                    const storeCoord = ol.proj.fromLonLat([sLng, sLat]);

                    const storeEl = createStoreOverlayElement(s.name || parsedData.store);

                    storeEl.onclick = function(e) {

                        e.stopPropagation();

                        showLiveMapPopup(storeCoord, `<b>🏪 ${s.name || parsedData.store || '合作店家'}</b>`);

                    };

                    liveStoreMarker = new ol.Overlay({

                        element: storeEl,

                        position: storeCoord,

                        positioning: 'center-center',

                        stopEvent: false

                    });

                    liveMap.addOverlay(liveStoreMarker);

                    extentPoints.push([sLng, sLat]);

                }



                // 外送員

                if (cLat && cLng) {

                    const courierCoord = ol.proj.fromLonLat([cLng, cLat]);

                    const courierEl = createCourierOverlayElement(c.name, c.vehicle, c.course);

                    courierEl.onclick = function(e) {

                        e.stopPropagation();

                        showLiveMapPopup(courierCoord, `<b>🛵 外送員：${c.name || '外送夥伴'}</b><br><span style="font-size:12px;color:#475569;">${c.vehicle || '機車配送中'}</span>`);

                    };

                    liveCourierMarker = new ol.Overlay({

                        element: courierEl,

                        position: courierCoord,

                        positioning: 'center-center',

                        stopEvent: false

                    });

                    liveMap.addOverlay(liveCourierMarker);

                    extentPoints.push([cLng, cLat]);

                    updateLiveTrajectoryPoints(c);

                }



                fitDeliveryMapExtent(extentPoints);

                drawLiveNavigationRoute(cLat, cLng, sLat, sLng, dLat, dLng);



                setTimeout(() => {

                    if (liveMap) {

                        try {

                            liveMap.updateSize();

                            fitDeliveryMapExtent(extentPoints);

                        } catch(e) {}

                    }

                }, 350);



            } catch(mapErr) {

                console.error("initActiveDeliveryMap 渲染異常 (已安全防護):", mapErr);

            }

        }



        // 計算兩點 GPS 座標之間的地面距離 (公尺)

        function calcGeoDist(lat1, lon1, lat2, lon2) {

            if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;

            const R = 6371000; // 地球半徑 (公尺)

            const dLat = (Number(lat2) - Number(lat1)) * Math.PI / 180;

            const dLon = (Number(lon2) - Number(lon1)) * Math.PI / 180;

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +

                      Math.cos(Number(lat1) * Math.PI / 180) * Math.cos(Number(lat2) * Math.PI / 180) *

                      Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;

        }



        function updateLiveTrajectoryPoints(courier) {

            try {

                if (!courier || !courier.latitude || !courier.longitude) return;

                if (!liveAccumulatedPath) liveAccumulatedPath = [];

                const pts = courier.pathPoints || [];

                const cur = [Number(courier.latitude), Number(courier.longitude)];

                if (pts.length > 0) {

                    const sorted = [...pts].sort((a, b) => (a.epoch || 0) - (b.epoch || 0));

                    liveAccumulatedPath = sorted.map(p => [Number(p.latitude), Number(p.longitude)]);

                }

                if (liveAccumulatedPath.length === 0) {

                    liveAccumulatedPath.push(cur);

                } else {

                    const last = liveAccumulatedPath[liveAccumulatedPath.length - 1];

                    if (calcGeoDist(last[0], last[1], cur[0], cur[1]) > 2) {

                        liveAccumulatedPath.push(cur);

                    }

                }

                if (liveTrajectorySource) {

                    liveTrajectorySource.clear();

                    if (liveAccumulatedPath.length > 1) {

                        const olCoords = liveAccumulatedPath.map(p => ol.proj.fromLonLat([p[1], p[0]]));

                        liveTrajectorySource.addFeature(new ol.Feature({

                            geometry: new ol.geom.LineString(olCoords)

                        }));

                    }

                }

            } catch(trErr) {

                console.warn("updateLiveTrajectoryPoints 異常 (已安全防護):", trErr);

            }

        }



        async function drawLiveNavigationRoute(cLat, cLng, sLat, sLng, dLat, dLng) {

            if (!liveMap || !cLat || !cLng) return;

            if (!liveLastNavCoords) liveLastNavCoords = { cLat: null, cLng: null, lastTime: 0 };

            const points = [`${cLng},${cLat}`];

            const coordsList = [[Number(cLat), Number(cLng)]];



            if (sLng && sLat) {

                points.push(`${sLng},${sLat}`);

                coordsList.push([Number(sLat), Number(sLng)]);

            }

            if (dLng && dLat) {

                points.push(`${dLng},${dLat}`);

                coordsList.push([Number(dLat), Number(dLng)]);

            }

            if (points.length < 2) return;



            const now = Date.now();

            const dist = calcGeoDist(cLat, cLng, liveLastNavCoords.cLat, liveLastNavCoords.cLng);

            if (liveLastNavCoords.lastTime && (now - liveLastNavCoords.lastTime < 12000) && dist < 35 && liveNavigationSource && liveNavigationSource.getFeatures().length > 0) {

                return;

            }

            liveLastNavCoords = { cLat, cLng, lastTime: now };



            try {

                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${points.join(';')}?overview=full&geometries=geojson`;

                const controller = new AbortController();

                const timeoutId = setTimeout(() => controller.abort(), 4000);

                const res = await fetch(osrmUrl, { signal: controller.signal });

                clearTimeout(timeoutId);



                if (res.ok) {

                    const data = await res.json();

                    if (data.routes && data.routes.length > 0 && liveNavigationSource) {

                        const geoJsonFormat = new ol.format.GeoJSON();

                        const geom = geoJsonFormat.readGeometry(data.routes[0].geometry, {

                            dataProjection: 'EPSG:4326',

                            featureProjection: 'EPSG:3857'

                        });

                        liveNavigationSource.clear();

                        liveNavigationSource.addFeature(new ol.Feature({ geometry: geom }));

                        return;

                    }

                }

            } catch(e) {}



            // 平滑虛線備援 (直線連接)

            if (liveNavigationSource) {

                const lineCoords = coordsList.map(pt => ol.proj.fromLonLat([pt[1], pt[0]]));

                liveNavigationSource.clear();

                liveNavigationSource.addFeature(new ol.Feature({

                    geometry: new ol.geom.LineString(lineCoords)

                }));

            }

        }



        function startActiveOrderLivePolling(orderUuid, parsedData, data) {

            if (liveActivePollTimer) clearInterval(liveActivePollTimer);



            liveActivePollTimer = setInterval(async () => {

                try {

                    const activeRes = await fetchActiveOrder(orderUuid, '', window.trackApiBase);



                    // 1. 檢測是否取消

                    if (isOrderCanceled(activeRes)) {

                        clearInterval(liveActivePollTimer);

                        if (liveEtaCountdownTimer) clearInterval(liveEtaCountdownTimer);

                        renderCanceledStage(activeRes, parsedData, data, '');

                        return;

                    }



                    // 2. 檢測是否送達

                    if (activeRes && (activeRes.status === 'concluded' || activeRes.isDelivered || activeRes.orderPhase === 'COMPLETED')) {

                        clearInterval(liveActivePollTimer);

                        if (liveEtaCountdownTimer) clearInterval(liveEtaCountdownTimer);

                        const termRes = await fetchTerminatedOrder(orderUuid, '', window.trackApiBase);

                        const finalDeliveredData = (termRes && termRes.status === 'success') ? { ...activeRes, ...termRes } : activeRes;

                        renderDeliveredStage(finalDeliveredData, parsedData, data, '');

                        return;

                    // 3. 持續同步最新座標、路徑與狀態 (留在當前自製畫面，絕不轉跳)

                        }

        // 已渲染的訊息簽名集合 (防止重複渲染氣泡)

        window.renderedChatMessagesSet = window.renderedChatMessagesSet || new Set();



        function getChatStorageKey(uuid) {

            return 'live_chat_hist_' + (uuid || window.currentActiveOrderUuid || 'default');

        }



        // 本地保存對話歷史 (重新整理訊息不丟失)

        function saveChatMsgToStorage(uuid, sender, text) {

            try {

                const key = getChatStorageKey(uuid);

                const list = JSON.parse(localStorage.getItem(key) || '[]');

                if (!list.some(m => m.sender === sender && m.text === text)) {

                    list.push({ sender, text, time: Date.now() });

                    if (list.length > 50) list.shift();

                    localStorage.setItem(key, JSON.stringify(list));

                }

            } catch(e) {}

        }



        // 從本地立即還原對話歷史

        function restoreChatMessagesFromLocal(uuid) {

            try {

                const key = getChatStorageKey(uuid);

                const list = JSON.parse(localStorage.getItem(key) || '[]');

                list.forEach(m => {

                    const msgKey = `${m.sender}:${m.text.trim()}`;

                    if (!window.renderedChatMessagesSet.has(msgKey)) {

                        window.renderedChatMessagesSet.add(msgKey);

                        appendActiveChatBubble(m.sender, m.text, false);

                    }

                });

            } catch(e) {}

        }



        // 即時雙向同步外送員與顧客訊息

        async function syncActiveCourierChatMessages(uuid, trackApiBase) {

            if (!uuid) return;

            try {

                const res = await fetchCourierMessages(uuid, trackApiBase);

                if (!res) return;

                

                // 支援 res.data.chatMessages 或 res.chatMessages

                const msgs = (res.data && res.data.chatMessages) || res.chatMessages || [];

                let hasNewCourierMsg = false;



                msgs.forEach(item => {

                    const text = (typeof item === 'string') ? item : (item.text || '');

                    let sender = (typeof item === 'object' && item.sender) ? item.sender : 'courier';

                    const trimmed = text.trim();

                    if (!trimmed) return;



                    // 過濾掉聊天室頂部外送員名片資訊 (如姓名、車牌、Uber Motorbike 等)，避免誤當作訊息氣泡

                    const courierNameEl = document.getElementById('liveActiveCourierName');

                    const cName = courierNameEl ? courierNameEl.innerText.trim() : '';

                    if (trimmed === cName || trimmed.includes('Motorbike') || trimmed.includes('•') || trimmed.includes('NDR-') || trimmed.includes('Uber')) {

                        return;

                    }



                    // 若本機剛發送過此訊息，辨識為 user

                    if (window.renderedChatMessagesSet.has(`user:${trimmed}`)) {

                        return;

                    }



                    const key = `${sender}:${trimmed}`;

                    if (!window.renderedChatMessagesSet.has(key)) {

                        window.renderedChatMessagesSet.add(key);

                        appendActiveChatBubble(sender, trimmed);

                        if (sender === 'courier') {

                            hasNewCourierMsg = true;

                        }

                    }

                });



                if (hasNewCourierMsg) {

                    triggerCourierNewMessageAlert();

                }

            } catch(e) {

                console.warn('同步外送員訊息異常:', e);

            }

        }



        // 收到外送員新訊息時的醒目動態提醒

        function triggerCourierNewMessageAlert() {

            const badge = document.getElementById('liveActiveChatBadge');

            if (badge) {

                badge.innerText = '📩 外送員有新訊息！';

                badge.style.background = '#fef08a';

                badge.style.color = '#854d0e';

                badge.style.fontWeight = 'bold';

                setTimeout(() => {

                    badge.innerText = '配送中';

                    badge.style.background = '#dcfce7';

                    badge.style.color = '#16a34a';

                }, 8000);

            }

            try {

                if (navigator.vibrate) navigator.vibrate([150, 80, 150]);

            } catch(e) {}

        }



        // 鍵盤輸入事件防護：嚴格避開中文輸入法 (IME 注音/拼音/倉頡) 選字 Enter 鍵早洩問題

        window.handleActiveChatKeydown = function(event) {

            if (event.key !== 'Enter') return;

            // 若處於中文組字選字中，或剛在 150ms 內完成選字 (防止 iOS/WebKit 在選字瞬間觸發 Enter 早洩)，或 keyCode 229

            if (window.isComposingChat || event.isComposing || event.keyCode === 229 || (Date.now() - (window.justComposedAt || 0) < 150)) {

                return;

            }

            event.preventDefault();

            triggerSendActiveMsg();

        };



        window.sendActiveQuickMsg = function(text) {

            if (window.isSendingCourierMsg) return;

            const input = document.getElementById('liveActiveChatInput');

            if (input) input.value = text;

            triggerSendActiveMsg();

        };



        window.triggerSendActiveMsg = async function() {

            // 防重複發送鎖：若正在傳送中，直接攔截，絕不重複發送

            if (window.isSendingCourierMsg) return;



            const input = document.getElementById('liveActiveChatInput');

            const sendBtn = document.getElementById('liveActiveSendBtn');

            if (!input || !input.value.trim()) return;



            const msg = input.value.trim();

            

            // 進入傳送鎖定狀態：防止傳送中繼續敲擊鍵盤或再次送出

            window.isSendingCourierMsg = true;

            input.disabled = true;

            if (sendBtn) {

                sendBtn.disabled = true;

                sendBtn.innerText = '傳送中...';

            }



            try {

                input.value = '';

                window.renderedChatMessagesSet.add(`user:${msg}`);

                appendActiveChatBubble('user', msg);



                const uuid = window.currentActiveOrderUuid || '';

                const res = await sendCourierMessage(uuid, msg, window.trackApiBase);

                if (!res || !res.success) {

                    appendActiveChatBubble('system', '⚠️ 訊息已排入外送員傳遞佇列');

                }

            } catch(e) {

                appendActiveChatBubble('system', '⚠️ 訊息傳送連線異常');

            } finally {

                // 傳送結束解鎖

                window.isSendingCourierMsg = false;

                input.disabled = false;

                if (sendBtn) {

                    sendBtn.disabled = false;

                    sendBtn.innerText = '發送';

                }

                input.focus();

            }

        };



        function appendActiveChatBubble(sender, text, shouldSave = true) {

            const area = document.getElementById('liveActiveChatMessages');

            if (!area) return;

            const bubble = document.createElement('div');

            bubble.style.maxWidth = '80%';

            bubble.style.padding = '6px 10px';

            bubble.style.borderRadius = '10px';

            bubble.style.fontSize = '12px';

            bubble.style.lineHeight = '1.4';

            bubble.style.wordBreak = 'break-word';



            if (sender === 'user') {

                bubble.style.alignSelf = 'flex-end';

                bubble.style.background = '#dcfce7';

                bubble.style.color = '#15803d';

                bubble.style.borderBottomRightRadius = '2px';

                bubble.innerHTML = `<strong>您：</strong>${text}`;

            } else if (sender === 'courier') {

                bubble.style.alignSelf = 'flex-start';

                bubble.style.background = '#e0f2fe';

                bubble.style.color = '#0369a1';

                bubble.style.borderBottomLeftRadius = '2px';

                bubble.innerHTML = `<strong>外送夥伴：</strong>${text}`;

            } else {

                bubble.style.alignSelf = 'center';

                bubble.style.background = '#f1f5f9';

                bubble.style.color = '#64748b';

                bubble.style.fontSize = '10.5px';

                bubble.innerHTML = text;

            }



            area.appendChild(bubble);

            area.scrollTop = area.scrollHeight;



            // 自動保存至本地儲存 (重新整理不丟失)

            if (shouldSave && (sender === 'user' || sender === 'courier')) {

                saveChatMsgToStorage(window.currentActiveOrderUuid, sender, text);

            }

        }





        // 向後端查詢訂單 track_info 基礎資料 (支援多端點容錯備援)

        async function fetchTrackInfo(id, trackApiBase) {
            const uniqueEndpoints = resolveApiEndpoints(`/api/track_info?id=${encodeURIComponent(id)}`, trackApiBase);

            for (const ep of uniqueEndpoints) {
                try {
                    const res = await fetch(ep);
                    if (res.ok) {
                        return await res.json();
                    }
                    if (res.status === 404 || res.status === 400) {
                        try {
                            const errJson = await res.json();
                            if (errJson && errJson.status) return errJson;
                        } catch(e) {}
                    }
                } catch(e) {
                    console.warn(`[fetchTrackInfo] 端點連線失敗 (${ep}):`, e.message);
                }
            }
            return null;
        }



        async function checkStatus(isBackgroundRefresh = false) {

                if (!orderId && window.isMultiOrderMode && window.currentMultiUuidList) {

                    showUpperLayerSync(isBackgroundRefresh);

                    try {

                        await loadAndRenderMultiOrders(window.currentMultiUuidList, window.lastParsedData, window.lastTrackData, isBackgroundRefresh);

                    } finally {

                        hideUpperLayerSync();

                    }

                    return;

                }



                showUpperLayerSync(isBackgroundRefresh);



                try {

                    const data = await fetchTrackInfo(orderId, trackApiBase);

                    if (data && data.status === 'success') {

                        const parsedData = parseOrderText(data.text);

                        const orderTextSignature = `${data.text || ''}__${JSON.stringify(data.ext_order_ids || [])}`;

                        

                        const rawTrackUrls = (data.tracking_urls && data.tracking_urls.length > 0)

                            ? data.tracking_urls

                            : (data.tracking_url ? [data.tracking_url] : []);

                        const validTrackUrls = rawTrackUrls.filter(u => u && u.trim() && u.trim() !== 'https://www.ubereats.com/tw/orders/' && u.trim() !== 'https://www.ubereats.com/tw/orders');

                        const hasTracking = validTrackUrls.length > 0;

                        const isMulti = rawTrackUrls.length > 1 || parsedData.isSplit;



                        // 若整筆訂單已被取消或刪除，或單筆且無追蹤網址被標記為取消

                        if (data.order_status === 'canceled' || data.order_status === 'deleted' || isOrderCanceled(data)) {

                            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

                            countdownState = null;

                            if (isMulti && hasTracking) {

                                await loadAndRenderMultiOrders(rawTrackUrls, parsedData, data, isBackgroundRefresh);

                                return;

                            } else {

                                const cancelRes = {
                                    isCanceled: true,
                                    cancelTitle: data.cancel_reason || '訂單已取消',
                                    cancelReason: data.cancel_reason || '此訂單已被取消或店家無法接單。',

                                    storeName: parsedData.store || '合作店家'

                                };

                                renderCanceledStage(cancelRes, parsedData, data, validTrackUrls[0] || '');

                                return;

                            }

                        }



                        // 僅在非 tracking 模式 (等待中/點餐中) 且內容發生實質變更時才重寫 orderTextArea

                        if (!hasTracking && window._lastRenderedOrderTextSig !== orderTextSignature) {

                            window._lastRenderedOrderTextSig = orderTextSignature;

                            orderTextArea.innerHTML = renderOrderDetails(parsedData, data.text, data.tracking_urls, [], data.ext_order_ids);

                            orderTextArea.style.backgroundColor = 'transparent';

                            orderTextArea.style.border = 'none';

                            orderTextArea.style.padding = '0';

                            orderTextArea.style.display = 'block';

                        }

                        

                        let statusHtml = '';

                        if (data.ext_order_id) {

                            statusHtml += `<p style='color: #666; font-size: 18px; margin-bottom: 5px;'>訂單編號: <strong style="color:#111; font-size:22px;">${data.ext_order_id}</strong></p>`;

                        }

                        

                        if (hasTracking) {

                            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

                            countdownState = null;



                            const trackingUrls = rawTrackUrls;



                            if (isMulti) {

                                await loadAndRenderMultiOrders(trackingUrls, parsedData, data, isBackgroundRefresh);

                                return;

                            } else {

                                // 單一訂單情況

                                const primaryTrackUrl = trackingUrls[0];

                                const orderUuid = extractOrderUuid(primaryTrackUrl);



                                if (orderUuid) {

                                    window.currentActiveOrderUuid = orderUuid;

                                    window.trackApiBase = trackApiBase;

                                    window.currentCookieSerial = data.cookie_serial || '';

                                    window.currentCookieAccountIndex = data.cookie_account_index || data.ext_order_id || '';



                                    // 🌟 核心：僅在初次進入且畫面上尚未繪製任何卡片時，才使用 loader！

                                    // 若畫面已經載入，讀取狀態純粹在畫面上層 (#globalSyncTopBar 與膠囊) 呈現，絕不覆蓋破壞文字！

                                    if (!window.hasRenderedOrderOnce) {

                                        statusArea.innerHTML = `

                                            <div class="loader"></div>

                                            <h3 style="color: #06c167; font-size: 18px; margin-top: 15px;">🛵 正在同步外送員即時動態...</h3>

                                            <p style="color: #666; font-size: 13px; margin-top: 5px;">正在連接外送員定位與配送狀態</p>

                                        `;

                                    }



                                    // 1. 優先查詢進行中即時座標與外送狀態

                                    const activeRes = await fetchActiveOrder(orderUuid, primaryTrackUrl, trackApiBase);

                                    window._lastUberSyncTimestamp = Date.now();

                                    window._lastUberSyncStatus = (activeRes && activeRes.status !== 'error') ? 'ok' : 'error';

                                    if (typeof updateSyncSecondsBadge === 'function') updateSyncSecondsBadge();



                                    // A. 檢查是否為取消 (優先處理)

                                    if (isOrderCanceled(activeRes)) {

                                        if (window.currentRenderedStage !== 'canceled') {

                                            console.log('❌ 檢測到外送行程已取消！切換至已取消階段');

                                            renderCanceledStage(activeRes, parsedData, data, primaryTrackUrl);

                                        }

                                        return;

                                    }



                                    // B. 檢查是否已送達 (送達完成判定絕對優先於預約排程)

                                    if (activeRes && (activeRes.status === 'concluded' || activeRes.isDelivered || activeRes.orderPhase === 'COMPLETED')) {

                                        if (window.currentRenderedStage !== 'delivered') {

                                            console.log('🎉 檢測到外送夥伴已抵達送達！進一步獲取留置拍照與送達明細...');

                                            const termRes = await fetchTerminatedOrder(orderUuid, primaryTrackUrl, trackApiBase);

                                            const finalDeliveredData = (termRes && termRes.status === 'success') ? { ...activeRes, ...termRes } : activeRes;

                                            renderDeliveredStage(finalDeliveredData, parsedData, data, primaryTrackUrl);

                                        }

                                        return;

                                    }



                                    // C. 檢查是否進行中 (店家接單備餐、外送員前往取餐或運送途中)

                                    const isActivelyProgressing = activeRes && activeRes.status === 'success' && !activeRes.isScheduled && activeRes.orderPhase !== 'SCHEDULED';

                                    if (isActivelyProgressing) {

                                        if (window.currentRenderedStage !== 'active') {

                                            console.log('🛵 檢測到外送進行中，渲染自製即時追蹤畫面');

                                            renderActiveDeliveryStage(activeRes, parsedData, data, orderUuid);

                                        }

                                        return;

                                    }



                                    // D. 檢查是否為預約排程單 (Scheduled Order) 或代訂前置點餐作業

                                    const isSingleSched = (activeRes && (activeRes.isScheduled || activeRes.status === 'scheduled' || activeRes.orderPhase === 'SCHEDULED')) ||

                                                          (!(activeRes && activeRes.status === 'success') && isScheduledOrder(parsedData.time, null, data.text));

                                    if (isSingleSched) {

                                        const isAsap = isAsapDelivery(parsedData?.time, data?.text, parsedData);

                                        const expectedStage = isAsap ? 'ordering_staging' : 'scheduled';

                                        const curSchedTime = isAsap ? (parsedData.time || '盡快送達') : ((activeRes && activeRes.scheduledTime) || parsedData.time || '預定時間');

                                        const curStore = (activeRes && activeRes.store && activeRes.store.name) || parsedData.store || '外送合作店家';

                                        const curAddress = (activeRes && activeRes.destination && activeRes.destination.address) || parsedData.address || '指定外送地址';



                                        const isSameSched = (

                                            window.currentRenderedStage === expectedStage &&

                                            window._lastRenderedOrderState &&

                                            window._lastRenderedOrderState.stage === expectedStage &&

                                            window._lastRenderedOrderState.schedTime === curSchedTime &&

                                            window._lastRenderedOrderState.storeName === curStore &&

                                            window._lastRenderedOrderState.address === curAddress &&

                                            window._lastRenderedOrderState.text === data.text

                                        );



                                        if (isSameSched) {

                                            // 🌟 核心：有更新才變動，沒更新完全不碰 DOM，徹底消除任何畫面跳動！

                                            console.log('⚡ 狀態無實質變更，跳過 DOM 重新渲染，保持畫面完全靜止');

                                            return;

                                        }



                                        console.log(isAsap ? '👨‍🍳 檢測到此訂單為「盡快送達」，渲染代訂點餐中階段' : '📅 檢測到此訂單為預約排程單，渲染預約展示階段');

                                        renderScheduledStage(parsedData, data, primaryTrackUrl, activeRes);

                                        return;

                                    }



                                    // 2. 備援查詢結單狀態 (Terminated)

                                    const termRes = await fetchTerminatedOrder(orderUuid, primaryTrackUrl, trackApiBase);

                                    if (isOrderCanceled(termRes)) {

                                        if (window.currentRenderedStage !== 'canceled') {

                                            renderCanceledStage(termRes, parsedData, data, primaryTrackUrl);

                                        }

                                        return;

                                    }

                                    if (termRes && termRes.status === 'success') {

                                        if (window.currentRenderedStage !== 'delivered') {

                                            renderDeliveredStage(termRes, parsedData, data, primaryTrackUrl);

                                        }

                                        return;

                                    }

                                }



                                // 備援預約排程單判定

                                const isSingleSchedFallback = !(activeRes && activeRes.status === 'success') && isScheduledOrder(parsedData.time, null, data.text);

                                if (isSingleSchedFallback) {

                                    if (window.currentRenderedStage !== 'scheduled') {

                                        console.log('📅 單筆訂單為預約排程單 (備援)，進入預約展示階段');

                                        renderScheduledStage(parsedData, data, primaryTrackUrl);

                                    }

                                    return;

                                }



                                // 3. 進行中備援

                                if (window.currentRenderedStage !== 'active') {

                                    renderActiveDeliveryStage({

                                        eta: '計算中...',

                                        orderStatus: '訂單正在準備中 (外送即將出發)',

                                        courier: { name: '外送夥伴', vehicle: '即將前往取餐' },

                                        store: { name: parsedData.store || '合作店家' },

                                        destination: { address: parsedData.address || '指定外送地址' }

                                    }, parsedData, data, orderUuid);

                                }

                            }

                        } else if (data.order_status === 'used') {

                            const accTimeStr = data.accepted_time_hm || extractHM(data.accepted_at) || extractHM(data.timestamp);

                            const accElapsed = (typeof data.accept_elapsed_sec === 'number') ? data.accept_elapsed_sec : calcFallbackElapsedSec(data.accepted_at || data.timestamp);

                            countdownState = { mode: 'used', baseElapsedSec: accElapsed, syncLocalMs: Date.now() };



                            if (window.currentRenderedStage !== 'used') {

                                window.currentRenderedStage = 'used';

                                window.hasRenderedOrderOnce = true;

                                statusHtml += `

                                    <h3 style="color: #007bff; font-size: 20px; margin-top: 15px;"><img src="http://weibsite.github.io/findDOG/image/LOADING.gif" style="width: 80px; vertical-align: middle; margin-right: 5px;"> 正在為您的訂單點餐...</h3>

                                    ${accTimeStr ? `<p style="color: #333; font-weight: bold; font-size: 15px; margin: 6px 0;">接單時間為${accTimeStr}</p>` : ''}

                                    <div id="countdownBox"></div>

                                `;

                                statusArea.innerHTML = statusHtml;

                                startCountdownLoop();

                            }

                            // 統一由 initAutoRefreshWatchdog 倒數 15 秒排程更新，絕不在此私自 setTimeout 產生多重重複計時器

                        } else {

                            const subTimeStr = data.submitted_time_hm || extractHM(data.submitted_at) || extractHM(data.timestamp);

                            const waitElapsed = (typeof data.wait_elapsed_sec === 'number') ? data.wait_elapsed_sec : calcFallbackElapsedSec(data.submitted_at || data.timestamp);

                            countdownState = { mode: 'waiting', baseElapsedSec: waitElapsed, syncLocalMs: Date.now() };



                            const isSameWaiting = window.currentRenderedStage === 'waiting' &&

                                                  window._lastRenderedOrderState &&

                                                  window._lastRenderedOrderState.activityText === (data.latest_activity_text || '');



                            if (!isSameWaiting) {

                                window.currentRenderedStage = 'waiting';
                                const mainH2 = document.querySelector('.card h2');
                                if (mainH2) { mainH2.innerHTML = '📦 外送訂單追蹤'; mainH2.style.color = ''; }
                                const cardBox = document.querySelector('.card');
                                if (cardBox) cardBox.classList.remove('delivered-mode');

                                window.hasRenderedOrderOnce = true;

                                window._lastRenderedOrderState = {

                                    stage: 'waiting',

                                    activityText: data.latest_activity_text || ''

                                };

                                statusHtml += `

                                    <h3 style="color: #ff9800; font-size: 20px; margin-top: 15px;"><img src="http://weibsite.github.io/findDOG/image/sit.gif" style="width: 55px; vertical-align: middle; margin-right: 5px;"> 等待代訂接單</h3>

                                    <p style="color: #007bff; font-weight: bold; font-size: 15px; margin: 6px 0;">${data.latest_activity_text || '等待代訂接單中目前代訂有空'}</p>

                                    ${subTimeStr ? `<p style="color: #555; font-weight: bold; font-size: 15px; margin: 6px 0;">送單時間：${subTimeStr}</p>` : ''}

                                    <div id="countdownBox"></div>

                                `;

                                statusArea.innerHTML = statusHtml;

                                startCountdownLoop();

                            }

                            // 統一由 initAutoRefreshWatchdog 倒數 15 秒排程更新，絕不在此私自 setTimeout 產生多重重複計時器

                        }

                        window.lastParsedData = parsedData;

                        window.lastTrackData = data;

                    } else if (data && data.status) {

                        const candidateUuids = (orderId || '').split(',').map(s => s.trim()).filter(Boolean);

                        if (candidateUuids.length > 0 && candidateUuids.every(u => /^[0-9a-fA-F-]{36}$/.test(u))) {

                            if (candidateUuids.length > 1) {

                                await loadAndRenderMultiOrders(candidateUuids, null, null, isBackgroundRefresh);

                                return;

                            } else {

                                const singleU = candidateUuids[0];

                                const activeRes = await fetchActiveOrder(singleU, '', trackApiBase);

                                if (activeRes && activeRes.status === 'success') {

                                    if (window.currentRenderedStage !== 'active') {

                                        renderActiveDeliveryStage(activeRes, {}, {}, singleU);

                                    }

                                    return;

                                }

                                const termRes = await fetchTerminatedOrder(singleU, '', trackApiBase);

                                if (termRes && termRes.status === 'success') {

                                    if (window.currentRenderedStage !== 'delivered') {

                                        renderDeliveredStage(termRes, {}, {}, `https://www.ubereats.com/tw/orders/${singleU}`);

                                    }

                                    return;

                                }

                            }

                        }

                        if (!window.hasRenderedOrderOnce) {
                            statusArea.innerHTML = `
                                <div style="text-align:center; padding: 30px 15px;">
                                    <div style="font-size: 48px; margin-bottom: 12px;">🔍</div>
                                    <h3 style="color:#d9534f; font-size:20px; font-weight:bold; margin-bottom:8px;">找不到此訂單資訊</h3>
                                    <p style="color:#666; font-size:14px; line-height:1.6; margin-bottom:12px;">
                                        請確認訂單連結是否正確，或訂單尚未建立完成。<br>系統將每 6 秒自動重新檢查...
                                    </p>
                                </div>
                            `;
                        } else {

                            window._lastUberSyncStatus = 'error';

                            if (typeof updateSyncSecondsBadge === 'function') updateSyncSecondsBadge();

                        }

                        if (typeof autoRefreshRemainingSec !== "undefined") { autoRefreshRemainingSec = 6; if (typeof updateAutoRefreshDisplay === "function") updateAutoRefreshDisplay(); } // 統一由 watchdog 倒數控管 6 秒重試，不自行產生獨立計時器

                    } else {

                        if (!window.hasRenderedOrderOnce) {

                            statusArea.innerHTML = `<h3 style="color:red;">無法連線到伺服器</h3><p style="color:#666;">請確認您的網路連線 (將於 6 秒後自動重新檢查...)</p>`;

                        } else {

                            window._lastUberSyncStatus = 'error';

                            if (typeof updateSyncSecondsBadge === 'function') updateSyncSecondsBadge();

                        }

                        if (typeof autoRefreshRemainingSec !== "undefined") { autoRefreshRemainingSec = 6; if (typeof updateAutoRefreshDisplay === "function") updateAutoRefreshDisplay(); } // 統一由 watchdog 倒數控管 6 秒重試，不自行產生獨立計時器

                    }

                } catch(e) {

                    console.error('checkStatus 執行異常:', e);

                    if (!window.hasRenderedOrderOnce) {

                        statusArea.innerHTML = `<h3 style="color:red;">訂單載入異常</h3><p style="color:#666;">${e.message ? ('錯誤: ' + e.message) : '請確認您的網路連線'} (6 秒後自動重新檢查)...</p>`;

                    } else {

                        window._lastUberSyncStatus = 'error';

                        if (typeof updateSyncSecondsBadge === 'function') updateSyncSecondsBadge();

                    }

                    if (typeof autoRefreshRemainingSec !== "undefined") { autoRefreshRemainingSec = 6; if (typeof updateAutoRefreshDisplay === "function") updateAutoRefreshDisplay(); } // 統一由 watchdog 倒數控管 6 秒重試，不自行產生獨立計時器

                } finally {

                    hideUpperLayerSync();

                }

            }



            window.checkStatus = checkStatus;





            

            // 初次執行

            checkStatus();

        });

    
    // --- 點餐後自動轉址 3 秒自動關閉提示與計時器 (不影響聊天室單獨開啟) ---
    function initAutoCloseCountdown(seconds = 10) {
        let remain = (seconds && seconds > 0) ? seconds : 10;
        if (remain === 3) remain = 10;
        const banner = document.createElement('div');
        banner.id = 'autoCloseBanner';
        banner.style.cssText = 'position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:999999; background:rgba(15,23,42,0.94); color:#ffffff; padding:9px 16px; border-radius:30px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; box-shadow:0 10px 25px rgba(0,0,0,0.35); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); max-width:92%; white-space:nowrap; animation:gwPop 0.3s ease-out;';
        banner.innerHTML = `
            <span style="display:flex; align-items:center; gap:5px;">
              <span>✅ 訂單已建立！</span>
              <span id="closeCountdownText" style="color:#38bdf8; font-weight:700;">${remain}</span>
              <span>秒後返回聊天室</span>
            </span>
            <button id="cancelAutoCloseBtn" style="background:#334155; color:#f8fafc; border:none; padding:3px 10px; border-radius:12px; font-size:11px; cursor:pointer; font-weight:600; margin-left:4px;">留在此頁</button>
        `;
        document.body.appendChild(banner);

        let timer = setInterval(() => {
            remain--;
            const numEl = document.getElementById('closeCountdownText');
            if (numEl) numEl.innerText = remain;
            if (remain <= 0) {
                clearInterval(timer);
                timer = null;
                if (typeof liff !== 'undefined' && liff.closeWindow) {
                    try { liff.closeWindow(); } catch(e) {}
                }
            }
        }, 1000);

        const cancelBtn = document.getElementById('cancelAutoCloseBtn');
        if (cancelBtn) {
            cancelBtn.onclick = () => {
                if (timer) {
                    clearInterval(timer);
                    timer = null;
                }
                banner.innerHTML = `<span>👌 已取消自動關閉，您可以繼續查看外送進度</span>`;
                setTimeout(() => {
                    banner.style.transition = 'opacity 0.4s ease';
                    banner.style.opacity = '0';
                    setTimeout(() => banner.remove(), 400);
                }, 1800);
            };
        }
    }

</script>
