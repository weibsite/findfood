<script>


// New specific function to handle delivery method toggle since we hid the original select
function setDeliveryMethod(method) {
    const isDoor = (method === 'door' || method === '放在門口');
    const actualMethod = isDoor ? '放在門口' : '當面點交';
    window.selectedDeliveryMethod = actualMethod;
    
    const sel = document.getElementById('deliveryMethod');
    if (sel) {
        if (sel.value !== actualMethod) {
            sel.value = actualMethod;
            sel.dispatchEvent(new Event('change'));
        }
    }
    const otherIds = ['checkoutDeliveryMethod', 'groceryDeliveryMethod'];
    otherIds.forEach(id => {
        const el = document.getElementById(id);
        if (el && el.value !== actualMethod) el.value = actualMethod;
    });
    localStorage.setItem('userDeliveryMethod', actualMethod);

    const f = document.getElementById('btnMethodFace');
    const d = document.getElementById('btnMethodDoor');
    if (isDoor) {
        if (f) f.className = 'inactive';
        if (d) d.className = 'active';
    } else {
        if (f) f.className = 'active';
        if (d) d.className = 'inactive';
    }
}
window.setDeliveryMethod = setDeliveryMethod;



// Override switchVertical to update modern tabs UI
var originalSwitchVertical = window.originalSwitchVertical || switchVertical;
switchVertical = function(v) {
    originalSwitchVertical(v);
    if(v === 'SHOP') {
        document.getElementById('verticalBtnShop').className = 'active';
        document.getElementById('verticalBtnRest').className = 'inactive';
    } else {
        document.getElementById('verticalBtnShop').className = 'inactive';
        document.getElementById('verticalBtnRest').className = 'active';
    }
};

// Restore visual state on load for delivery method
document.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
        const savedMethod = localStorage.getItem('userDeliveryMethod') || '當面點交';
        setDeliveryMethod(savedMethod);
    }, 500);
});
function getSelectedScheduleTimestamp() {
      const ts = document.getElementById('scheduleTime');
      if (!ts || !ts.value) return 0;
      try {
          const parsed = JSON.parse(ts.value);
          const baseDate = new Date(parsed.date + "T00:00:00+08:00");
          return baseDate.getTime() + (parsed.startTime * 60 * 1000);
      } catch (e) {
          const d = new Date(ts.value);
          return isNaN(d) ? 0 : d.getTime();
      }
  }

  let API_BASE_URL = 'https://api.9ysong.shop';

  let WS_URL = 'wss://api.9ysong.shop/ws';

  

  // 動態取得預設的連線位置

  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';

  const host = window.location.hostname || '127.0.0.1';

  WS_URL = `${protocol}//${host}:8000/ws`;

  

  // 設備檢測機制 (判斷是手機還是電腦)

const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

const isDesktopDevice = !isMobileDevice;



function copyToClipboardFallback(text, btn) {

    if (navigator.clipboard && window.isSecureContext) {

        navigator.clipboard.writeText(text);

    } else {

        const ta = document.createElement("textarea");

        ta.value = text;

        ta.style.position = "fixed";

        document.body.appendChild(ta);

        ta.select();

        try { document.execCommand("copy"); } catch(e){}

        document.body.removeChild(ta);

    }

    if (btn) {

        btn.innerText = '已複製！請貼上至官方帳號';

        btn.style.background = '#f43f5e';

        btn.style.color = '#fff';

    }

}



let isAddressSet = false;

  let currentLat = null;

  let currentLng = null;

  let currentAddrTitle = '';

  let scheduleMode = 'SCHEDULE';

  let selectedDateIndex = 0;

  const datesData = [];

  

  // ====== History Logic ======

  let addressHistory = [];

  

  function loadHistory() {

    ['foodNotes', 'deliveryNotes', 'query', 'modalNote'].forEach(field => {

      const history = JSON.parse(localStorage.getItem('finddog_history_' + field)) || [];

      const datalist = document.getElementById(field === 'query' ? 'query-list' : (field === 'foodNotes' ? 'food-notes-list' : 'delivery-notes-list'));

      if (datalist) {

        datalist.innerHTML = history.map(val => `<option value="${escapeHTML(val)}"></option>`).join('');

      }



    });

    

    addressHistory = JSON.parse(localStorage.getItem('finddog_history_address')) || [];

    const addrDatalist = document.getElementById('addr-list');

    if (addrDatalist) {

      addrDatalist.innerHTML = addressHistory.map(item => `<option value="${escapeHTML(item.title)}"></option>`).join('');

    }

    

    if (addressHistory.length > 0 && !isAddressSet) {

      const lastAddr = addressHistory[0];

      if (typeof lastAddr === 'object' && lastAddr.title) {

        document.getElementById('addrInput').value = lastAddr.title;

        scrollAddrToEnd();
        revealSubSections();
        setAddress(lastAddr.lat, lastAddr.lng, lastAddr.title);

      } else {

        localStorage.removeItem('finddog_history_address');

        addressHistory = [];

      }

    }

  }



  function saveSimpleHistory(field) {

    const val = document.getElementById(field).value.trim();

    if (!val) return;

    let history = JSON.parse(localStorage.getItem('finddog_history_' + field)) || [];

    history = history.filter(item => item !== val);

    history.unshift(val);

    if (history.length > 5) history = history.slice(0, 5);

    localStorage.setItem('finddog_history_' + field, JSON.stringify(history));

    loadHistory();

  }



  function saveAddressHistory(lat, lng, title) {

    let history = JSON.parse(localStorage.getItem('finddog_history_address')) || [];

    history = history.filter(item => item.title !== title);

    // [修補] 加入儲存時間戳，方便後續偵測過時座標
    history.unshift({ lat, lng, title, savedAt: Date.now() });

    if (history.length > 5) history = history.slice(0, 5);

    localStorage.setItem('finddog_history_address', JSON.stringify(history));

    addressHistory = history;

    loadHistory();

  }



  // 初始化 UI 與設定

  let liffInitPromise = null;

  document.addEventListener("DOMContentLoaded", async () => {
  // Restore delivery method and notes for ALL inputs
  const savedMethod = localStorage.getItem('userDeliveryMethod');
  const methodIds = ['deliveryMethod', 'checkoutDeliveryMethod', 'groceryDeliveryMethod'];
  const savedNotes = localStorage.getItem('userDeliveryNotes');
  const noteIds = ['deliveryNotes', 'checkoutDeliveryNotes', 'groceryDeliveryNotes'];
  const savedFoodNotes = localStorage.getItem('userFoodNotes');
  const foodNoteIds = ['foodNotes', 'checkoutFoodNotes', 'groceryFoodNotes'];

  methodIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
          if (savedMethod !== null) el.value = savedMethod;
          el.addEventListener('change', (e) => {
              const val = e.target.value;
              localStorage.setItem('userDeliveryMethod', val);
              // sync others
              methodIds.forEach(otherId => {
                 if (otherId !== id && document.getElementById(otherId)) document.getElementById(otherId).value = val;
              });
              if (typeof setDeliveryMethod === 'function') {
                  setDeliveryMethod(val);
              }
          });
      }
  });
  if (savedMethod && typeof setDeliveryMethod === 'function') {
      setDeliveryMethod(savedMethod);
  }

  noteIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
          if (savedNotes !== null) el.value = savedNotes;
          el.addEventListener('input', (e) => {
              localStorage.setItem('userDeliveryNotes', e.target.value);
              // sync others
              noteIds.forEach(otherId => {
                 if (otherId !== id && document.getElementById(otherId)) document.getElementById(otherId).value = e.target.value;
              });
          });
      }
  });

  foodNoteIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
          if (savedFoodNotes !== null) el.value = savedFoodNotes;
          el.addEventListener('input', (e) => {
              localStorage.setItem('userFoodNotes', e.target.value);
              // sync others
              foodNoteIds.forEach(otherId => {
                 if (otherId !== id && document.getElementById(otherId)) document.getElementById(otherId).value = e.target.value;
              });
          });
      }
  });


    liffInitPromise = liff.init({ liffId: "2011657436-rGVj5SoG" }).catch(err => {

        console.error('LIFF init failed', err);

    });

    

    try {

      const configRes = await fetch('config.json?t=' + Date.now());

      if (configRes.ok) {

        const configData = await configRes.json();

        if (configData.api_url) {

          API_BASE_URL = configData.api_url.replace(/\/$/, '');

        } else if (configData.line_url) {

          API_BASE_URL = configData.line_url.replace(/\/$/, '');

        }

        if (configData.ws_url) WS_URL = configData.ws_url;

      }

    } catch (e) {

      console.log('找不到 config.json，將使用預設路徑。');

    }

    

    // Config 讀取完成後，再讀取歷史紀錄 (這樣 auto-setAddress 才會用到正確的 API_BASE_URL)

    loadHistory();

    initSchedulePicker();
    
    // Config loaded, API_BASE_URL is ready, now we can fetch times
    fetchDeliveryTimes();
    loadServerStatusDot();
  });



  
  // --- [時段 API 串接] ---
  let uberTimeData = null;
  let isDeliveryTimesLoading = false;
  let isDeliveryTimesLoaded = false;
  let onDeliveryTimesLoadedCallback = null;

  
  async function fetchDeliveryTimes() {
    if (uberTimeData && uberTimeData.dates && uberTimeData.dates.length > 0) return; // Do not fetch again if we already have it
    
    isDeliveryTimesLoading = true;
    isDeliveryTimesLoaded = false;
    
    try {
      const targetUrl = API_BASE_URL ? `${API_BASE_URL}/api/delivery-times_v3` : 'https://api.9ysong.shop/api/delivery-times_v3';
      const res = await fetch(targetUrl, {
        method: 'GET'
      });
      let data;
      const contentType = res.headers.get('content-type') || '';
      if (contentType.includes('application/gzip')) {
          const ds = new DecompressionStream('gzip');
          const decompressedStream = res.body.pipeThrough(ds);
          const decompressedResponse = new Response(decompressedStream);
          const text = await decompressedResponse.text();
          data = JSON.parse(text);
      } else {
          data = await res.json();
      }
      
      if (data.status === 'success' && data.data && data.data.dates && data.data.timeRanges) {
        uberTimeData = data.data;
        renderDates();
      } else {
        throw new Error('無法取得時段');
      }
    } catch (e) {
      console.warn('線上時段取得失敗，啟用本地時段生成備援:', e);
      generateFallbackDeliveryTimes();
    }

    isDeliveryTimesLoading = false;
    isDeliveryTimesLoaded = true;

    if (onDeliveryTimesLoadedCallback) {
        onDeliveryTimesLoadedCallback();
        onDeliveryTimesLoadedCallback = null;
    }
  }

  function generateFallbackDeliveryTimes() {
    const dates = [];
    const timeRanges = {};
    const now = new Date();
    
    for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
        const d = new Date(now);
        d.setDate(d.getDate() + dayOffset);
        const dStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        dates.push(dStr);
        
        const ranges = [];
        let startMin = 0;
        if (dayOffset === 0) {
            const curTotalMin = now.getHours() * 60 + now.getMinutes();
            startMin = Math.ceil((curTotalMin + 15) / 15) * 15;
        }
        
        for (let m = startMin; m < 24 * 60; m += 15) {
            ranges.push({
                startTime: m,
                endTime: m + 30
            });
        }
        timeRanges[dStr] = ranges;
    }
    
    uberTimeData = { dates, timeRanges };
    renderDates();
  }

  function renderDates() {
    if (!uberTimeData || !uberTimeData.dates) return;
    const dateSelect = document.getElementById('modalDateSelect');
    dateSelect.innerHTML = '';
    
    const today = new Date();
    const tomorrow = new Date();
    tomorrow.setDate(today.getDate() + 1);
    
    let firstAvailableDate = null;
    uberTimeData.dates.forEach((dStr, idx) => {
        const d = new Date(dStr);
        const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
        let label = '';
        if (d.toDateString() === today.toDateString()) {
            label = `今天 (${d.getMonth()+1}/${d.getDate()} 週${dayNames[d.getDay()]})`;
        } else if (d.toDateString() === tomorrow.toDateString()) {
            label = `明天 (${d.getMonth()+1}/${d.getDate()} 週${dayNames[d.getDay()]})`;
        } else {
            label = `${d.getMonth()+1}/${d.getDate()} (週${dayNames[d.getDay()]})`;
        }
        const opt = document.createElement('option');
        opt.value = dStr;
        opt.text = label;
        dateSelect.appendChild(opt);
    });
    
    renderModalTimes();
    
    // Automatically set default trigger text
    const modalSelect = document.getElementById('modalTimeSelect');
    const scheduleSelect = document.getElementById('scheduleTime');
    if (modalSelect && scheduleSelect && modalSelect.options.length > 0) {
        if (scheduleSelect.options.length === 0) {

}

function autoFixEmptyTime() {

function renderModalTimes() {
    const dateSelect = document.getElementById('modalDateSelect');
    if (!dateSelect) return;
    const dateStr = dateSelect.value;
    const timeSelect = document.getElementById('modalTimeSelect');
    if (!timeSelect) return;
    timeSelect.innerHTML = '';
    
    if (!uberTimeData || !uberTimeData.timeRanges || !uberTimeData.timeRanges[dateStr]) return;
    
    const now = new Date();
    const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    const isToday = (dateStr === todayStr) || (new Date(dateStr).toDateString() === now.toDateString());
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    
    const ranges = uberTimeData.timeRanges[dateStr];
    ranges.forEach(w => {
        const st = w.startTime || 0;
        const et = w.endTime || 0;
        
        // 自動排除當前時間之前的時段
        if (isToday && st < currentMinutes) {
            return;
        }
        
        const h = Math.floor(st / 60);
        const m = st % 60;
        const endH = Math.floor(et / 60);
        const endM = et % 60;
        
        const startAmpm = h >= 12 ? '下午' : '上午';
        const endAmpm = endH >= 12 ? '下午' : '上午';
        const startH12 = h % 12 || 12;
        const endH12 = endH % 12 || 12;
        const startMM = m.toString().padStart(2, '0');
        const endMM = endM.toString().padStart(2, '0');
        
        let displayTitle = '';
        if (startAmpm === endAmpm) {
            displayTitle = `${getTimeEmoji(h)} ${startAmpm} ${startH12}:${startMM} - ${endH12}:${endMM}`;
        } else {
            displayTitle = `${getTimeEmoji(h)} ${startAmpm} ${startH12}:${startMM} - ${getTimeEmoji(endH)} ${endAmpm} ${endH12}:${endMM}`;
        }
        
        const opt = document.createElement('option');
        opt.value = JSON.stringify({ date: dateStr, startTime: st, endTime: et, title: displayTitle });
        opt.text = displayTitle;
        timeSelect.appendChild(opt);
    });
    
    // 即時同步第一個時段到畫面 (若非即時訂單模式)
    if (typeof syncSelectedTimeToHome === 'function' && typeof scheduleMode !== 'undefined' && scheduleMode !== 'ASAP') {
        syncSelectedTimeToHome();
    }
}

function openTimePickerModal() {
    if (!uberTimeData || !uberTimeData.dates) return;
    
    // 同步當前已選的日期與時段到彈窗選單
    const scheduleSelect = document.getElementById('scheduleTime');
    if (scheduleMode === 'SCHEDULE' && scheduleSelect && scheduleSelect.value) {
        try {
            const parsed = JSON.parse(scheduleSelect.value);
            const dateSelect = document.getElementById('modalDateSelect');
            if (dateSelect && parsed.date) {
                const dateIdx = Array.from(dateSelect.options).findIndex(o => o.value === parsed.date);
                if (dateIdx !== -1 && dateSelect.selectedIndex !== dateIdx) {
                    dateSelect.selectedIndex = dateIdx;
                    renderModalTimes();
                }
            }
            const timeSelect = document.getElementById('modalTimeSelect');
            if (timeSelect) {
                for (let i = 0; i < timeSelect.options.length; i++) {
                    try {
                        const optP = JSON.parse(timeSelect.options[i].value);
                        if (optP.startTime === parsed.startTime && optP.endTime === parsed.endTime) {
                            timeSelect.selectedIndex = i;
                            break;

                }
            }
        } catch(e) {}
    }
    
    document.getElementById('timePickerModal').style.display = 'flex';

function updateTriggerText() {
    const trigger = document.getElementById('triggerTimeText');
    const scheduleSelect = document.getElementById('scheduleTime');
    if (!trigger) return;
    
    if (typeof scheduleMode !== 'undefined' && scheduleMode === 'ASAP') {
        trigger.innerText = '🚀 即時訂單 (約5~30分)';
        trigger.style.color = '#f43f5e';
    } else {
        if (scheduleSelect && scheduleSelect.options.length > 0) {
            try {
                const parsed = JSON.parse(scheduleSelect.value);
                const d = new Date(parsed.date);
                const dayNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
                const today = new Date();
                const tomorrow = new Date();
                tomorrow.setDate(today.getDate() + 1);
                if (d.toDateString() === today.toDateString()) {
                    trigger.innerText = parsed.title;
                } else if (d.toDateString() === tomorrow.toDateString()) {
                    trigger.innerText = `明天 ${parsed.title}`;
                } else {
                    trigger.innerText = `${d.getMonth()+1}月${d.getDate()}日${dayNames[d.getDay()]} ${parsed.title}`;
                }
                trigger.style.color = '#1c1917';
            } catch(e) {
                let optText = scheduleSelect.options[scheduleSelect.selectedIndex >= 0 ? scheduleSelect.selectedIndex : 0].text;
                if (optText.startsWith('今天 ')) optText = optText.substring(3);
                trigger.innerText = optText || '選擇時間';
                trigger.style.color = '#1c1917';
            }
        } else {
            trigger.innerText = '選擇時間';
            trigger.style.color = '#57534e';
        }
    }
}

          const road = ad.road || ad.pedestrian || ad.street || '';

        if (!resolved) {

          resolved = true;

          clearTimeout(timeoutId);

          ws.close();

          fallbackSearch();

        }

      };

      ws.onclose = () => {

        if (!resolved) {

          resolved = true;

          clearTimeout(timeoutId);

          fallbackSearch();

        }

      };

      ws.onopen = () => {

        console.log('Sending search request to server WS:', WS_URL);

        ws.send(JSON.stringify({ type: 'search_address', address: q }));

      };



      ws.onmessage = (event) => {

        if (resolved) return;

        const data = JSON.parse(event.data);

        if (data.type === 'search_address_result') {

          resolved = true;

          clearTimeout(timeoutId);

          ws.close();

          if (data.success && data.lat && data.lng) {

            setAddress(data.lat, data.lng, q);

          } else {

            fallbackSearch();

          }

        }

      };



      // [修補] 移除重複的 ws.onerror（已在上方定義過）

    } catch (e) { 

        fallbackSearch();

    }

  }

  function getUberWebpUrl(originalUrl) {

    if (!originalUrl || !originalUrl.startsWith('http')) return originalUrl;

    if (originalUrl.includes('image-proc/resize')) return originalUrl;

    try {

        return `https://cn-geo1.uber.com/image-proc/resize/eats/format=webp/width=550/height=440/quality=70/srcb64=${b64}`;

    } catch(e) {

        return originalUrl;

    }

}

// [全聯判定] 排除「大全聯」等不同實體，僅辨識真正的全聯福利中心/門市
function isPxmartName(name) {
    if (!name || typeof name !== 'string') return false;
    return name.includes('全聯') && !name.includes('大全聯');
}

// [全聯預約自動轉即時補全] 當生鮮雜貨以預約模式搜尋全聯卻無結果時，背景發起即時搜尋取得全聯店家
async function fetchPxmartAsapStores(q) {
    try {
        const apiBase = typeof API_BASE_URL !== 'undefined' && API_BASE_URL ? API_BASE_URL : '';
        const payload = {
            query: q,
            lat: currentLat,
            lng: currentLng,
            vertical: 'SHOP',
            searchSource: 'SEARCH_SUGGESTION',
            searchType: 'GLOBAL_SEARCH',
            date: "",
            startTime: 0,
            endTime: 0
        };
        const res = await fetch(`${apiBase}/api/search_v3`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) return [];
        const json = await res.json();
        if (json.status === 'failure' || !json.data) return [];
        let asapStores = [];
        (json.data.feedItems || []).forEach(item => {
            if ((item.type === 'REGULAR_STORE' || item.type === 'REGULAR_STORE_WITH_ITEMS') && item.store) {
                asapStores.push(item.store);
            } else if ((item.type === 'REGULAR_CAROUSEL' || item.type === 'STORE_CAROUSEL') && item.carousel && item.carousel.stores) {
                asapStores.push(...item.carousel.stores);
            } else if (item.type === 'MINI_STORE_WITH_ITEMS' && item.miniStoreWithItems && item.miniStoreWithItems.store) {
                asapStores.push(item.miniStoreWithItems.store);
            }
        });
        const seen = new Set();
        return asapStores.filter(s => {
            const sName = s.title && s.title.text ? s.title.text : (typeof s.title === 'string' ? s.title : '');
            if (!isPxmartName(sName)) return false;
            if (seen.has(s.storeUuid)) return false;
            seen.add(s.storeUuid);
            if (s.imageOverlayCallToAction && s.imageOverlayCallToAction.text && s.imageOverlayCallToAction.text.includes('自取')) return false;
            if (s.storeAvailablityState === 'TOO_FAR_TO_DELIVER') return false;
            if (s.tracking && s.tracking.storePayload && s.tracking.storePayload.storeAvailablityState === 'TOO_FAR_TO_DELIVER') return false;
            return true;
        });
    } catch (e) {
        console.error('fetchPxmartAsapStores error:', e);
        return [];
    }
}

    const resultsEl = document.getElementById('results');
    statusEl.innerHTML = '<div style="padding: 100px 0; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;"><div class="spinner" style="margin: 0 auto;"></div><div style="margin-top: 15px; font-size: 16px; font-weight: bold; color: #666;">搜尋優惠餐廳中...</div></div>'; 
    statusEl.className = 'status'; 
    resultsEl.innerHTML = '';

    try {
        const searchPayload = { 
            query: q, 
            lat: currentLat,
            lng: currentLng,
            vertical: 'RESTAURANTS',
            searchSource: 'SEARCH_SUGGESTION',
            searchType: 'GLOBAL_SEARCH',
            mapContext: {
                northEast: { latitude: currentLat + 0.09, longitude: currentLng + 0.09 },
                southWest: { latitude: currentLat - 0.09, longitude: currentLng - 0.09 }
            },
            diningMode: 'PICKUP'
        };

        if (typeof scheduleMode !== 'undefined') {
            if (scheduleMode === 'ASAP') {
                searchPayload.date = "";
                searchPayload.startTime = 0;
                searchPayload.endTime = 0;
            } else if (scheduleMode === 'SCHEDULE') {
                const timeSelect = document.getElementById('scheduleTime');
                if (timeSelect && timeSelect.value) {
                    try {
                        const sData = JSON.parse(timeSelect.value);
                        searchPayload.date = sData.date;
                        searchPayload.startTime = sData.startTime;
                        searchPayload.endTime = sData.endTime;
                    } catch (e) {}
                }
            }
        }

        const res = await fetch(`${API_BASE_URL}/api/search_v4`, {
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(searchPayload)
        });

        const textRes = await res.text();
        const json = JSON.parse(textRes);

        if (!res.ok || json.status === 'failure') { 
            statusEl.innerHTML = '搜尋失敗'; 
            return; 
        }

        let stores = [];
        (json.data.feedItems || []).forEach(item => {
            if ((item.type === 'REGULAR_STORE' || item.type === 'REGULAR_STORE_WITH_ITEMS') && item.store) {
                stores.push(item.store);
            } else if ((item.type === 'REGULAR_CAROUSEL' || item.type === 'STORE_CAROUSEL') && item.carousel && item.carousel.stores) {
                stores.push(...item.carousel.stores);
            } else if (item.type === 'MINI_STORE_WITH_ITEMS' && item.miniStoreWithItems && item.miniStoreWithItems.store) {
                stores.push(item.miniStoreWithItems.store);
            }
        });

        let seen = new Set();
        stores = stores.filter(s => {
            if (seen.has(s.storeUuid)) return false;
            seen.add(s.storeUuid);
            return true;
        });

        const getDist = (s) => {
            if (s.location && s.location.distanceToUser) return s.location.distanceToUser;
            if (s.meta && Array.isArray(s.meta)) {
                const distMeta = s.meta.find(m => m.badgeType === 'DISTANCE');
                if (distMeta && distMeta.text) {
                    const match = distMeta.text.match(/[\d.]+/);
                    if (match) return parseFloat(match[0]);
                }
            }
            return 99999;
        };

        
        stores = stores.filter(s => getDist(s) <= 5.0);
        
        stores.sort((a, b) => {
            return getDist(a) - getDist(b);
        });

        
        if (q) {
            const qLower = q.toLowerCase();
            const exactMatches = stores.filter(s => s.title && s.title.text && s.title.text.toLowerCase().includes(qLower));
            const others = stores.filter(s => !(s.title && s.title.text && s.title.text.toLowerCase().includes(qLower)));
            stores = [...exactMatches, ...others];
        }

        const keyword = (q || '').trim();
        const safeKw = typeof escapeHTML === 'function' ? escapeHTML(keyword) : keyword;
        if (stores.length === 0) {
            statusEl.innerHTML = keyword ? `找不到與${safeKw}有關的優惠餐廳。` : '找不到相關優惠餐廳。';
            return;
        }

        const safeQ = (q || '').replace(/'/g, "\\\'").replace(/"/g, '&quot;');
        const titleText = keyword ? `與${safeKw}有關的優惠餐廳：` : `為您推薦 ${stores.length} 家優惠餐廳：`;
        statusEl.innerHTML = `<div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                                <div>${titleText}</div>
                                <button onclick="searchStores()" style="background:#f43f5e; color:#fff; border:none; padding:5px 12px; border-radius:15px; font-weight:bold; cursor:pointer; font-size:13px; margin-left:10px; flex-shrink:0;">回到一般外送</button>
                              </div>`;
        statusEl.className = 'status success';
        
        resultsEl.innerHTML = stores.map(s => {
            let imgUrl = '';
            if (s.image && s.image.items && s.image.items.length > 0) {
                let bestItem = s.image.items[s.image.items.length - 1];
                for (let img of s.image.items) {
                    if (img.width >= 400 && img.width <= 800) { bestItem = img; break; }
                }
                imgUrl = typeof getUberWebpUrl === 'function' ? getUberWebpUrl(bestItem.url) : bestItem.url;
            }
            const name = s.title && s.title.text ? s.title.text : '未知餐廳';
            const actionUrl = s.actionUrl || '';
            const storeUuid = s.storeUuid || '';
            
            let distBadge = '';
            let etdText = '';
            if (s.meta && Array.isArray(s.meta)) {
                const etdMeta = s.meta.find(m => m.badgeType === 'ETD');
                if (etdMeta && etdMeta.accessibilityText) {
                    etdText = etdMeta.accessibilityText;
                } else if (etdMeta && etdMeta.text) {
                    etdText = etdMeta.text;
                }
            }
            if (!etdText) {
                etdText = '-$10優惠';
            }
            distBadge = `<div style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.7); color:#fff; padding:4px 8px; border-radius:12px; font-size:12px; font-weight:bold; z-index:1;">${etdText}</div>`;

            return `
            <div class="card" onclick="localStorage.setItem('uberCartIsDiscount', 'true'); openStore('${storeUuid}', '${name.replace(/'/g, "\\'")}', '${actionUrl}')" style="position:relative;">
                ${distBadge}
                <div class="card-img" style="background-image: url('${imgUrl}');"></div>
                <div class="card-body">
                  <div class="card-name">${name}</div>
                  <div class="card-meta">
                      <span style="color:#ff9800; font-weight:bold;">優惠專區每單再折10元</span>
                  </div>
                </div>
            </div>
            `;
        }).join('');

    } catch (e) {
        console.error('Fetch store pickup error:', e);
        statusEl.innerHTML = '搜尋優惠餐廳失敗';
    }
}

async function handleQuickAdd(event, storeUuid, sectionUuid, subsectionUuid, menuItemUuid, titleEnc, descEnc, basePrice, imgUrl, hasCustomizations) {
  if (!window._quickAddLocks) window._quickAddLocks = {};
  if (window._quickAddLocks[menuItemUuid]) return;
  window._quickAddLocks[menuItemUuid] = true;
  try {
    const title = decodeURIComponent(titleEnc);

  const desc = decodeURIComponent(descEnc);

    event.stopPropagation();

    const btn = event.currentTarget;

    const originalHtml = btn.innerHTML;

    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;border-top-color:#111;"></div>';

    

    try {

      if (window.isGroceryStore) {

          btn.innerHTML = originalHtml;

          openGroceryCheckoutSummary();

          return;

      }

      if (hasCustomizations === false) {

          btn.innerHTML = originalHtml;

          window.noOptionsItems.add(menuItemUuid);

          cart.push({

            title: title,

            price: basePrice,

            qty: 1,

            note: '',

            options: [],

            storeName: currentStoreName,

            storeUrl: typeof currentStoreUrl !== 'undefined' ? currentStoreUrl : '',

            menuItemUuid: menuItemUuid,

            storeDeliveryFee: typeof currentStoreDeliveryFee !== 'undefined' ? currentStoreDeliveryFee : 0,
      originalStoreDeliveryFee: typeof currentOriginalDeliveryFee !== 'undefined' ? currentOriginalDeliveryFee : (typeof currentStoreDeliveryFee !== 'undefined' && currentStoreDeliveryFee > 0 ? currentStoreDeliveryFee + 50 : 0)

          });

          updateCartBadge();

          updateMenuActions();

          showToast(`已加入: ${title}`);

          return;

      }


        btn.innerHTML = originalHtml;
        openItemModal(storeUuid, sectionUuid, subsectionUuid, menuItemUuid, titleEnc, descEnc, basePrice, imgUrl, hasCustomizations);
    } catch (e) {

      btn.innerHTML = originalHtml;

      console.error('Quick add error:', e);

      showToast('載入失敗，請再試一次');

    }
  } finally {
      window._quickAddLocks[menuItemUuid] = false;
  }

  }



  function handleQuickPlus(event, uuid) {

    event.stopPropagation();

    // 找到購物車中該品項並數量 + 1

    for (let i = 0; i < cart.length; i++) {

      if (cart[i].menuItemUuid === uuid) {

        cart[i].qty += 1;

        break;

      }

    }

    updateCartBadge();

    updateMenuActions();

  }



  function handleQuickTrash(event, uuid) {

    event.stopPropagation();

    // 數量 - 1，如果為 0 則移除

    for (let i = 0; i < cart.length; i++) {

      if (cart[i].menuItemUuid === uuid) {

        cart[i].qty -= 1;

        if (cart[i].qty <= 0) {

          cart.splice(i, 1);

        }

        break;

      }

    }

    updateCartBadge();

  }

function renderGroups(groups, pathPrefix) {

    let html = '';

    groups.forEach((group, gIdx) => {

        const gTitle = filterTrailingEnglish(parseText(group.title));

        const isRadio = group.maxPermitted === 1;

        let reqText = group.minPermitted > 0 ? `必填 ${group.minPermitted} 項` : '';

        if (group.maxPermitted > 1) reqText += ` (最多 ${group.maxPermitted} 項)`;

        

        const gPath = `${pathPrefix}_g${gIdx}`;

        

        html += `

        <div id="${gPath}" class="modal-section cust-group" data-min="${group.minPermitted || 0}" data-max="${group.maxPermitted || 0}" data-title="${escapeHTML(gTitle)}" style="background:#f9f9f9; padding:12px; border-radius:8px; border:1px solid #eee; margin-bottom:10px; transition: border 0.3s;">

            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">

                <h4 style="margin:0;">${escapeHTML(gTitle)}</h4>

                <span class="req-badge" style="font-size:12px; color:#666; background:#e0e0e0; padding:2px 6px; border-radius:4px; transition: all 0.3s;">${reqText}</span>

            </div>

        `;

        

        group.options.forEach((opt, oIdx) => {

            const isSoldOut = opt.isSoldOut === true;
            const oTitle = filterTrailingEnglish(parseText(opt.title));

            const oPrice = opt.price > 0 ? `+$${opt.price / 100}` : '';

            const oPath = `${gPath}_o${oIdx}`;

            

            let inputHtml = '';

            if (isRadio) {

                inputHtml = `<input type="radio" class="cust-input cust-radio" name="${gPath}" data-path="${oPath}" data-title="${escapeHTML(oTitle)}" data-price="${(opt.price || 0) / 100}" onchange="recalcCustomizations()" style="width:18px;height:18px;" ${isSoldOut ? 'disabled' : ''}>`;

            } else {

                const optMax = opt.maxPermitted || 0;

                inputHtml = `

                <div class="cust-stepper" style="display:flex; align-items:center; gap:8px; opacity: ${isSoldOut ? '0.5' : '1'};">

                    <button type="button" onclick="${isSoldOut ? '' : `changeCustQty(event, '${oPath}', -1, ${optMax})`}" style="width:28px;height:28px;border-radius:14px;border:1px solid #ccc;background:#fff;font-weight:bold;cursor:${isSoldOut ? 'not-allowed' : 'pointer'};color:#111;display:flex;align-items:center;justify-content:center;" ${isSoldOut ? 'disabled' : ''}>-</button>

                    <span id="qty_${oPath}" class="cust-qty cust-input" data-path="${oPath}" data-qty="0" data-title="${escapeHTML(oTitle)}" data-price="${(opt.price || 0) / 100}" style="font-size:15px;font-weight:bold;min-width:16px;text-align:center;">0</span>

                    <button type="button" onclick="${isSoldOut ? '' : `changeCustQty(event, '${oPath}', 1, ${optMax})`}" style="width:28px;height:28px;border-radius:14px;border:1px solid #ccc;background:#fff;font-weight:bold;cursor:${isSoldOut ? 'not-allowed' : 'pointer'};color:#111;display:flex;align-items:center;justify-content:center;" ${isSoldOut ? 'disabled' : ''}>+</button>

                </div>

                `;

            }

            

            const hasChildren = opt.childCustomizationList && opt.childCustomizationList.length > 0;

            const soldOutBadge = isSoldOut ? `<span style="font-size:12px; color:#fff; background:#ff4444; padding:2px 6px; border-radius:4px; margin-left:8px;">已售完</span>` : '';
            

            html += `

            <div class="cust-option-row" style="${isSoldOut ? 'opacity: 0.6; pointer-events: none;' : ''}">

                <label style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eaeaea; cursor:${isSoldOut ? 'not-allowed' : 'pointer'};" onclick="${!isRadio ? 'event.preventDefault();' : ''}">

                    <div style="display:flex; align-items:center; gap:10px;">

                        ${inputHtml}

                        <span style="line-height:1.4;">${escapeHTML(oTitle)}${soldOutBadge}</span>

                    </div>

                    <span style="color:#666; font-size:14px;">${oPrice}</span>

                <div id="children_${oPath}" style="display:none; padding-left:15px; margin-top:5px; border-left:2px solid #ccc; margin-bottom:5px;">

                    ${renderGroups(opt.childCustomizationList, oPath)}

                </div>

                `;

            }

            

            html += `</div>`;

        });

        

        html += `</div>`;

    });

    return html;

}



function changeCustQty(event, oPath, delta, optMax) {

    if (event) {

        event.stopPropagation();

        event.preventDefault();

    }

    const qtySpan = document.getElementById(`qty_${oPath}`);

    if (!qtySpan) return;

    

    let current = parseInt(qtySpan.getAttribute('data-qty') || '0', 10);

    

    if (delta > 0) {

        if (optMax > 0 && current >= optMax) return;

        

        const groupDiv = qtySpan.closest('.cust-group');

        const groupMax = parseInt(groupDiv.getAttribute('data-max') || '0', 10);

        

        if (groupMax > 0) {

            let sum = 0;

            groupDiv.querySelectorAll(':scope > .cust-option-row > label > div > .cust-stepper > .cust-qty').forEach(span => {

                sum += parseInt(span.getAttribute('data-qty') || '0', 10);

            });

            if (sum >= groupMax) return;

        }

    }

    

    let newVal = current + delta;

    if (newVal < 0) newVal = 0;

    

    qtySpan.setAttribute('data-qty', newVal);

    qtySpan.innerText = newVal;

    

    recalcCustomizations();

}



function recalcCustomizations() {

    let extraPrice = 0;

    currentItem.selectedOptions = [];

    

    document.querySelectorAll('.cust-option-row').forEach(row => {

        const radio = row.querySelector(':scope > label .cust-radio');

        const qtySpan = row.querySelector(':scope > label .cust-stepper .cust-qty');

        const childrenDiv = row.querySelector(`:scope > div[id^="children_"]`);

        

        let isSelected = false;

        if (radio && radio.checked) isSelected = true;

        if (qtySpan && parseInt(qtySpan.getAttribute('data-qty') || '0', 10) > 0) isSelected = true;

        

        if (childrenDiv) {

            childrenDiv.style.display = isSelected ? 'block' : 'none';

        }

    });



    const getVisibleSelections = (container) => {

        container.querySelectorAll(':scope > .cust-group > .cust-option-row').forEach(row => {

            const radio = row.querySelector(':scope > label .cust-radio');

            const qtySpan = row.querySelector(':scope > label .cust-stepper .cust-qty');

            

            let qty = 0;

            if (radio && radio.checked) qty = 1;

            if (qtySpan) qty = parseInt(qtySpan.getAttribute('data-qty') || '0', 10);

            

            if (qty > 0) {

                const price = parseFloat(radio ? radio.getAttribute('data-price') : qtySpan.getAttribute('data-price')) || 0;

                const title = radio ? radio.getAttribute('data-title') : qtySpan.getAttribute('data-title');

                

                extraPrice += (price * qty);

if (qty > 1) {

currentItem.selectedOptions.push(`${title} x${qty}`);

} else {

currentItem.selectedOptions.push(title);

}

                

                const childrenDiv = row.querySelector(':scope > div[id^="children_"]');

                if (childrenDiv && childrenDiv.style.display !== 'none') {

                    getVisibleSelections(childrenDiv);

                }

            }

        });

    };

    

    const rootArea = document.getElementById('customizationsArea');

    if (rootArea) getVisibleSelections(rootArea);

    

    currentItem.totalPrice = currentItem.basePrice + extraPrice;

    updateModalPrice();

}

              if (typeof scheduleMode !== 'undefined' && scheduleMode === 'SCHEDULE') {

                  if (timeSelect && timeSelect.value) {
                      try {
                          const sData = JSON.parse(timeSelect.value);
                          const startTimeMs = getSelectedScheduleTimestamp();
                          uberPayload.time = {
                              scheduled: true,
                              date: sData.date,
                              startTime: sData.startTime,

                              endTime: sData.endTime,
                              deliveryType: 'ASAP'
                          };
                      } catch (e) {}
                  }
              }

              console.log('📡 [開啟店家] 直送 Uber Payload:', JSON.stringify(uberPayload, null, 2));
              
              const uberHeaders = {
                  "accept": "*/*",

                          availableWindows.push(item.timeWindowViewModel.timeWindow);

                      }

          });

      }

function escapeHTML(str) {

    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );

function normalizeAddress(addr) {
  if (!addr) return addr;
  return addr.replace(/([零一二三四五六七八九十百]+)(號|樓)/g, function(match, numStr, suffix) {
    let map = {'零':0, '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9};
    if (!/十|百/.test(numStr) && numStr.length > 1) {
      return numStr.split('').map(c => map[c]).join('') + suffix;
    }
    let num = 0, temp = 0, unit = {'十':10, '百':100};
    if (numStr === '十') return '10' + suffix;
    let current = 0;
    for (let i = 0; i < numStr.length; i++) {
      let char = numStr[i];
      if (map[char] !== undefined) {
        current = map[char];
        if (i === numStr.length - 1) temp += current;
      } else if (unit[char] !== undefined) {
        if (current === 0 && char === '十') current = 1; 
        temp += current * unit[char];
        current = 0;
        if (char === '百') { num += temp; temp = 0; }
      }
    }
    num += temp;
    if (num > 0) return num + suffix;
    return match;
  });
}

  function calcOrderCost(items) {

  let totalSum = 0;

  items.forEach(it => totalSum += it.price * it.qty);

  

  let promoDiscount = totalSum >= 300 ? 150 : Math.floor(totalSum / 2);

  let preOrderDiscount = 0;

  
        const isPickup = localStorage.getItem('uberCartIsDiscount') === 'true';
if (typeof scheduleMode !== 'undefined' && scheduleMode !== 'ASAP') {

    const ts = document.getElementById('scheduleTime');

    if (ts && ts.value) {

      if (getSelectedScheduleTimestamp() - new Date().getTime() >= 2.99 * 3600000) {

            preOrderDiscount = window.isGroceryStore ? 15 : 10;

      }

    }

  }

  

  let totalExcessDeliveryFee = 0;

  const sg = {};

  items.forEach(it => { if(!sg[it.storeName||'']) sg[it.storeName||'']=[]; sg[it.storeName||''].push(it); });

  Object.keys(sg).forEach(s => totalExcessDeliveryFee += Math.max(0, ...sg[s].map(it => it.storeDeliveryFee||0)));

  
  let pickupDisc = localStorage.getItem('uberCartIsDiscount') === 'true' ? 10 : 0;
  let noBinCost = (totalSum - promoDiscount) + 50 + totalExcessDeliveryFee - preOrderDiscount - pickupDisc;




  let expanded = [];

  items.forEach(it => {

    for (let j = 0; j < it.qty; j++) {

      expanded.push({ name: it.title, price: it.price, storeName: it.storeName || '未命名餐廳', note: it.note || '', storeDeliveryFee: it.storeDeliveryFee || 0, storeUrl: it.storeUrl });

    }

  });



  if (expanded.length <= 1) return { shouldSplit: false, noBinCost, bestCost: noBinCost, bins: null, savings: 0 };



  expanded.sort((a, b) => b.price - a.price);



  let bestBins = null;

  let bestCost = Infinity;



  for (let attempt = 0; attempt < 1000; attempt++) {

    let bins = [];

    let cur = [...expanded];

    if (attempt > 0) {

      for (let i = cur.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [cur[i], cur[j]] = [cur[j], cur[i]];

      }

    }



    for (let item of cur) {

      let placed = false;

      for (let bin of bins) {

        if (bin.sum + item.price <= 300) {

          bin.items.push(item);

          bin.sum += item.price;

          placed = true;

          break;

        }

      }

      if (!placed) {

        let maxGap = -1;

        let bestBin = null;

        for (let bin of bins) {

          if (bin.sum < 300 && (300 - bin.sum) > maxGap) {

            maxGap = 300 - bin.sum;

            bestBin = bin;

          }

        }

        if (bestBin && (bestBin.sum + item.price <= 300 || Math.random() < 0.3)) {

          bestBin.items.push(item);

          bestBin.sum += item.price;

        } else {

          bins.push({ items: [item], sum: item.price });

        }

      }

    }



    let isASAP = (typeof scheduleMode === 'undefined' || scheduleMode === 'ASAP');
    if (!isASAP && typeof getSelectedScheduleTimestamp === 'function') {
        if (getSelectedScheduleTimestamp() - Date.now() < 2.99 * 3600000) {
            isASAP = true; // 3小時內的預約單視同即時單標準
        }
    }
    let binLimit = isASAP ? 199 : 170;
    
    let validSplit = true;

    for (let bin of bins) {

      if (bin.sum < binLimit) {

        validSplit = false;

        break;

      }

    }



    if (validSplit) {

      let cost = 0;

        let feePerBin = 50;

      for (let bin of bins) {

        let binPromo = bin.sum >= 300 ? 150 : Math.floor(bin.sum / 2);

        let binFoodCost = bin.sum - binPromo;

        

        let binExcess = 0;

        const bsg = {};

        bin.items.forEach(i => {

            if(!bsg[i.storeName||'']) bsg[i.storeName||'']=[];

            bsg[i.storeName||''].push(i);

        });

        Object.keys(bsg).forEach(s => binExcess += Math.max(0, ...bsg[s].map(it => it.storeDeliveryFee||0)));

        

        
        cost += binFoodCost + feePerBin + binExcess - (localStorage.getItem('uberCartIsDiscount') === 'true' ? 10 : 0);


      }




      if (cost < bestCost) {

        bestCost = cost;

        bestBins = bins;

      }

    }

  }



  return {

    shouldSplit: totalSum >= 350 && bestBins && bestBins.length > 1 && bestCost < noBinCost,

    noBinCost,

    bestCost,

    bins: bestBins,

    savings: noBinCost - bestCost

  };

}

let isImeComposing = false;
document.addEventListener('compositionstart', () => {
    isImeComposing = true;
});
document.addEventListener('compositionend', (e) => {
    isImeComposing = false;
    if (e && e.target && e.target.id === 'addrInput') {

// 判斷是否為有效完整文字 (最少需包含一個中英文字或數字，且不包含未完成的注音符號)
function isValidSearchQuery(text) {
    if (!text || typeof text !== 'string') return false;
    const str = text.trim();
    if (!str) return false;
    if (isImeComposing) return false;
    
    // 注音符號範圍 (含聲調 ˊˇˋ˙)：若含有任何注音符號，代表使用者尚在拼音選字，不送出請求
    const bopomofoRegex = /[\u3105-\u312f\u31a0-\u31bf\u02ca\u02c7\u02cb\u02d9]/;
    if (bopomofoRegex.test(str)) {
        return false;
    }
    
    // 最少包含一個有效實質文字 (中文漢字、英文字母、數字)
    const validWordRegex = /[\u4e00-\u9fa5a-zA-Z0-9]/;
    if (!validWordRegex.test(str)) {
        return false;
    }
    
    return true;
}

function fetchSuggestionsBar(query) {
    clearTimeout(suggestionsBarDebounceTimer);
    const q = (query || '').trim();
    if (!q) {
        hideSuggestionsBars();
        return;
    }
    
    // 檢查是否為完整有效文字，若包含注音符號或非完整文字則不發送請求
    if (!isValidSearchQuery(q)) {
        return;
    }
    
    const curVert = typeof currentVertical !== 'undefined' ? currentVertical : 'RESTAURANTS';
    const key = q + '_' + curVert;
    
    suggestionsBarDebounceTimer = setTimeout(async () => {
        if (key === lastSuggestionsKey) return;
        lastSuggestionsKey = key;

        // 取消前一個尚未完成的請求，並核發最新請求序號
        if (suggestionsBarAbortController) {
            try { suggestionsBarAbortController.abort(); } catch (e) {}
        }
        suggestionsBarAbortController = new AbortController();
        const reqId = ++latestSuggestionsBarReqId;
        
        try {
            const apiBase = typeof API_BASE_URL !== 'undefined' && API_BASE_URL ? API_BASE_URL : '';
            const payload = {
                query: q,
                userQuery: q,
                lat: typeof currentLat !== 'undefined' && currentLat ? currentLat : 24.9670998,
                lng: typeof currentLng !== 'undefined' && currentLng ? currentLng : 121.2981634,
                vertical: curVert
            };
            
            const res = await fetch(`${apiBase}/api/getSearchSuggestionsV1`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: suggestionsBarAbortController.signal
            });
            
            // [防覆蓋保護] 若已有更新的請求發出，或輸入框當前文字已不是 q，直接丟棄過時結果
            if (reqId !== latestSuggestionsBarReqId || getCurrentActiveQuery() !== q) {
                return;
            }

            if (!res.ok) {
                console.warn('[Suggestions] API 回應失敗 HTTP', res.status);
                return;
            }
            const resJson = await res.json();

            // [雙重確認] 解析完 JSON 後再次確認是否仍為最新文字
            if (reqId !== latestSuggestionsBarReqId || getCurrentActiveQuery() !== q) {
                return;
            }

            if (resJson.status === 'success' && Array.isArray(resJson.data)) {
                // 1. 關鍵詞：過濾出 keyword，顯示在輸入框上方一排橫列
                const keywordItems = resJson.data.filter(it => it.type === 'keyword');
                if (keywordItems.length > 0) {
                    renderSuggestionsBar(keywordItems);
                }
                // [注意] 若成功取得 0 筆建議 (完全空的建議)，完全不顯示套用在畫面上，也不取代或清空已出現的建議
                
                // 2. 店家：過濾出 store，顯示在關聯餐廳/店家列表中 (先出現，等待 search_v3 覆蓋)
                const storeItems = resJson.data.filter(it => it.type === 'store');
                if (storeItems.length > 0) {
                    // 僅當目前這個關鍵字 q 尚未被 search_v3 覆蓋完成時，才先由 Suggestion 店家搶先展示
                    if (!(window.suggestionStoreSource === 'search_v3' && window.suggestionStoreQuery === q)) {
                        window.suggestionStores = storeItems.map(s => ({
                            title: { text: s.title },
                            storeUuid: s.uuid,
                            heroImageUrl: s.heroImageUrl || '',
                            actionUrl: s.actionUrl || '',
                            category: s.category || '',
                            isSuggestionStore: true
                        }));
                        window.suggestionStoreSource = 'quick_suggestions';
                        window.suggestionStoreQuery = q;
                        renderOverlayHTML();
                    }
                }
            }
            // 若 API 取得 0 筆或失敗，不呼叫 hideSuggestionsBars()，保留畫面上現有的建議
        } catch (e) {
            if (e && e.name === 'AbortError') return;
            console.error('fetchSuggestionsBar error:', e);
        }
    }, 180);
}

function updateQueryOverlay() {
    const headerInput = document.getElementById('query');
    const mobileInput = document.getElementById('globalSearchInputMobile');
    
    // Sync both inputs
    const keyword = (mobileInput && mobileInput === document.activeElement ? mobileInput.value : (headerInput ? headerInput.value : ''));
    if (headerInput) headerInput.value = keyword;
    if (mobileInput) mobileInput.value = keyword;
    
    const val = keyword.trim();
    
    const prevVal = window._lastOverlayInputValue || '';
    window._lastOverlayInputValue = val;
    
    // Immediate feedback in UI (shows typed text)
    renderOverlayHTML();
    
    if (!val) {
        hideSuggestionsBars();
        return;
    }
    
    const hasValidQuery = isValidSearchQuery(val);
    
    // 即時取得 Suggestions API 建議詞 (僅在非注音且為有效文字時送出)
    if (hasValidQuery) {
        fetchSuggestionsBar(val);
    }
    
    // Clear previous debounce timer
    clearTimeout(queryDebounceTimer);
    
    // Only fetch if value is a valid complete query and has changed (or vertical changed)
    const currentVert = typeof currentVertical !== 'undefined' ? currentVertical : 'RESTAURANTS';
    if (hasValidQuery && (val !== lastSearchedQuery || currentVert !== (typeof lastSearchedVertical !== 'undefined' ? lastSearchedVertical : ''))) {
        const diff = Math.abs(val.length - prevVal.length);
        const delay = diff > 2 ? 0 : 500;
        
        queryDebounceTimer = setTimeout(() => {
            if (typeof isFetchingSuggestions !== 'undefined' && isFetchingSuggestions) {
                pendingSuggestionQuery = val;
            } else if (window._searchLock) {
                pendingSuggestionQuery = val;
            } else {
                lastSearchedQuery = val;
                if (typeof lastSearchedVertical !== 'undefined') lastSearchedVertical = currentVert;
                fetchStoreSuggestions(val);
            }
        }, delay);
    }
}

async function fetchStoreSuggestions(q) {
    if (!q || !currentLat || !currentLng) return;
    
    isFetchingSuggestions = true;
    const reqId = ++latestStoreSuggestionsReqId;
    
    try {
        const searchPayload = { 
            query: q, 
            lat: currentLat,
            lng: currentLng,
            vertical: typeof currentVertical !== 'undefined' ? currentVertical : 'RESTAURANTS',
            searchSource: 'SEARCH_SUGGESTION',
            searchType: 'GLOBAL_SEARCH'
        };
        if (typeof scheduleMode !== 'undefined') {
            if (scheduleMode === 'ASAP') {
                searchPayload.date = "";
                searchPayload.startTime = 0;
                searchPayload.endTime = 0;
            } else if (scheduleMode === 'SCHEDULE') {
                const timeSelect = document.getElementById('scheduleTime');
                if (timeSelect && timeSelect.value) {
                    try {
                        const sData = JSON.parse(timeSelect.value);
                        searchPayload.date = sData.date;
                        searchPayload.startTime = sData.startTime;
                        searchPayload.endTime = sData.endTime;
                    } catch (e) {}
                }
            }
        }

        const apiBase = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : '';
        if(!apiBase) {
            isFetchingSuggestions = false;
            return;
        }

        const res = await fetch(`${apiBase}/api/search_v3`, {
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(searchPayload)
        });
        
        if (!res.ok) throw new Error('Network response was not ok');
        const textRes = await res.text();
        const json = JSON.parse(textRes);
        
        // [防覆蓋保護] 若回應回來時，使用者輸入框已經變成別的字 (例如已打到「烤肉飯」)，直接放棄舊字「烤」的結果
        const currentActiveQ = getCurrentActiveQuery();
        if (reqId !== latestStoreSuggestionsReqId || (currentActiveQ && currentActiveQ !== q)) {
            return;
        }

        if (json.status !== 'failure') {
            let stores = [];
            (json.data.feedItems || []).forEach(item => {
                if ((item.type === 'REGULAR_STORE' || item.type === 'REGULAR_STORE_WITH_ITEMS') && item.store) {
                    stores.push(item.store);
                } else if ((item.type === 'REGULAR_CAROUSEL' || item.type === 'STORE_CAROUSEL') && item.carousel && item.carousel.stores) {
                    stores.push(...item.carousel.stores);
                } else if (item.type === 'MINI_STORE_WITH_ITEMS' && item.miniStoreWithItems && item.miniStoreWithItems.store) {
                    stores.push(item.miniStoreWithItems.store);
                }
            });
            
            const seen = new Set();
            stores = stores.filter(s => {
                if (seen.has(s.storeUuid)) return false;
                seen.add(s.storeUuid);
                return true;
            });
            // 過濾掉自取(無法外送)的店家
            stores = stores.filter(s => {
                if (s.imageOverlayCallToAction && s.imageOverlayCallToAction.text && s.imageOverlayCallToAction.text.includes('自取')) return false;
                if (s.storeAvailablityState === 'TOO_FAR_TO_DELIVER') return false;
                if (s.tracking && s.tracking.storePayload && s.tracking.storePayload.storeAvailablityState === 'TOO_FAR_TO_DELIVER') return false;
                return true;
            });

            
            window.suggestionStores = stores;
            window.suggestionStoreSource = 'search_v3';
            window.suggestionStoreQuery = q;
        const resultsEl = document.getElementById('results');
        if (resultsEl) {
            resultsEl.innerHTML = generateStoreListHTML(stores, q, typeof currentVertical !== 'undefined' ? currentVertical : 'RESTAURANTS');
            // Status update is now handled inside generateStoreListHTML
        }

        // [全聯預約自動轉即時補全] 針對生鮮雜貨包含「全聯」關鍵字 (排除「大全聯」)，若預約模式無全聯結果 (出現大全聯不算)，即時補搜全聯
        const vertCheck = typeof currentVertical !== 'undefined' ? currentVertical : 'RESTAURANTS';
        if (vertCheck === 'SHOP' && q.includes('全聯') && !q.includes('大全聯') && typeof scheduleMode !== 'undefined' && scheduleMode === 'SCHEDULE') {
            const hasPxmart = stores.some(s => {
                const name = (s.title && s.title.text) ? s.title.text : (typeof s.title === 'string' ? s.title : '');
                return isPxmartName(name);
            });
            if (!hasPxmart) {
                fetchPxmartAsapStores(q).then(pxStores => {
                    if (reqId !== latestStoreSuggestionsReqId || getCurrentActiveQuery() !== q) return;
                    if (pxStores && pxStores.length > 0) {
                        const existingUuids = new Set(stores.map(s => s.storeUuid));
                        const newPx = pxStores.filter(ps => !existingUuids.has(ps.storeUuid));
                        if (newPx.length > 0) {
                            stores.push(...newPx);
                            window.suggestionStores = stores;
                            if (resultsEl) {
                                resultsEl.innerHTML = generateStoreListHTML(stores, q, vertCheck);
                            }
                            if (typeof renderOverlayHTML === 'function') {
                                renderOverlayHTML();
                            }
                        }
                    }
                });
            }
        }

        }
    } catch (e) {
        console.error('Fetch store suggestions error:', e);
    } finally {
        isFetchingSuggestions = false;
        
        // If the user typed something else while we were waiting, fetch it now!
        const latestInputQ = getCurrentActiveQuery();
        const nextTargetQ = pendingSuggestionQuery || (latestInputQ && isValidSearchQuery(latestInputQ) && latestInputQ !== lastSearchedQuery ? latestInputQ : "");
        if (nextTargetQ && nextTargetQ !== q && !window._searchLock) {
            pendingSuggestionQuery = "";
            lastSearchedQuery = nextTargetQ;
            fetchStoreSuggestions(nextTargetQ);
        } else if (getCurrentActiveQuery() === q) {
            // Re-render the overlay to show newly fetched stores, hide spinner, or show error/empty state
            if (typeof renderOverlayHTML === 'function') renderOverlayHTML();
        }
    }
}

            html += '<div style="font-size:14px; color:#999; text-align:center; margin-top:30px;">輸入關鍵字開始搜尋</div>';
        }
    } else {
        let isCompressed = false;
        if (window.visualViewport && window.visualViewport.height < window.innerHeight * 0.8) {
            isCompressed = true;
        }
        
        const currentVert = typeof currentVertical !== 'undefined' ? currentVertical : 'RESTAURANTS';
        const hasStoresForQuery = window.suggestionStores && window.suggestionStores.length > 0 && window.suggestionStoreQuery === val;
        
        if (hasStoresForQuery) {
            if (!isCompressed) {
                html += '<div style="font-size:14px; color:#999; margin:15px 0 10px 0; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">';
                html += '<span>關聯餐廳/店家</span>';
                if (typeof isFetchingSuggestions !== 'undefined' && isFetchingSuggestions) {
                    html += '<span style="font-size:11px; color:#aaa; font-weight:normal;">載入更多資訊中...</span>';
                }
                html += '</div>';
            } else {
                html += '<div style="height:10px;"></div>';
            }
            
            window.suggestionStores.slice(0, 10).forEach(s => {
                const name = s.title && s.title.text ? s.title.text : (typeof s.title === 'string' ? s.title : '');
                if (!name) return;
                const encodedName = encodeURIComponent(name).replace(/'/g, "%27");
                const uuid = s.storeUuid || s.uuid || '';
                const actionUrl = s.actionUrl || '';
                
                let imageUrl = '';
                if (s.image && s.image.items && s.image.items.length > 0) {
                    imageUrl = getUberWebpUrl(s.image.items[0].url);
                } else if (s.heroImageUrl) {
                    imageUrl = s.heroImageUrl;
                }
                
                let ratingHtml = '';
                if (s.rating && s.rating.text) {
                    ratingHtml = `<div style="font-size:12px; color:#666; background:#eee; padding:2px 6px; border-radius:10px; margin-top:4px; display:inline-block;">★ ${s.rating.text}</div>`;
                }
                
                let timeText = '';
                let deliveryFeeText = '';
                if (s.tracking && s.tracking.storePayload) {
                    const sp = s.tracking.storePayload;
                    if (sp.deliveryTimeETA) timeText = sp.deliveryTimeETA + ' 分鐘';
                    if (sp.deliveryFeeFormatted) deliveryFeeText = sp.deliveryFeeFormatted + ' 外送費';
                }
                let metaText = [timeText, deliveryFeeText].filter(x=>x).join(' • ');
                if (!metaText && s.category) {
                    metaText = `<div style="font-size:12px; color:#888; margin-top:2px;">${escapeHTML(s.category)}</div>`;
                } else if (metaText) {
                    metaText = `<div style="font-size:12px; color:#666; margin-top:2px;">${metaText}</div>`;
                }

                html += `
                <div onclick="localStorage.setItem('uberCartIsDiscount', 'false'); if(typeof closeQueryOverlay === 'function') closeQueryOverlay(); window.openStore('${uuid}', '${encodedName}', '${actionUrl}')" style="display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #f0f0f0; cursor:pointer;">
                    ${imageUrl ? `<img src="${imageUrl}" style="width:50px; height:50px; border-radius:8px; object-fit:cover; background:#eee; flex-shrink:0;">` : `<div style="width:50px; height:50px; border-radius:8px; background:#eee; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:20px;">🏪</div>`}
                    <div style="flex:1; min-width:0;">
                        <div style="font-size:15px; font-weight:bold; color:#111; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHTML(name)}</div>
                        ${metaText}
                        ${ratingHtml}
                    </div>
                </div>`;
            });
        } else if (isValidSearchQuery(val) && (val !== (typeof lastSearchedQuery !== 'undefined' ? lastSearchedQuery : '') || currentVert !== (typeof lastSearchedVertical !== 'undefined' ? lastSearchedVertical : '') || (typeof isFetchingSuggestions !== 'undefined' && isFetchingSuggestions))) {
            if (!isCompressed) {
                html += '<div style="font-size:14px; color:#999; margin:15px 0 10px 0; font-weight:bold;">關聯餐廳/店家</div>';
            } else {
                html += '<div style="height:10px;"></div>';
            }
            html += '<div style="text-align:center; padding:100px 0; display:flex; flex-direction:column; align-items:center; justify-content:center;"><div class="spinner" style="margin: 0 auto;"></div><div style="margin-top: 15px; color:#999; font-size:16px; font-weight:bold;">搜尋中...</div></div>';
        } else {
            // Searched but no results
            html += `<div style="text-align:center; padding:40px 0; color:#999; font-size:14px;">找不到與 "${escapeHTML(val)}" 相關的店家</div>`;
        }
    }
    resultsTop.innerHTML = html;
    resultsTop.scrollTop = 0;
}

let offlineCheckInterval = null;
async function loadServerStatusDot() {
    try {
        const apiBase = typeof API_BASE_URL !== 'undefined' && API_BASE_URL ? API_BASE_URL : '';
        if (!apiBase) return;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000); 
        
        const response = await fetch(apiBase + '/api/status', { signal: controller.signal });
        clearTimeout(timeoutId);
        
        if (!response.ok) throw new Error('API Error');
        
        const data = await response.json();
        updateStatusDot(data.type);
        
        if (offlineCheckInterval) {
            clearInterval(offlineCheckInterval);
            offlineCheckInterval = null;
            document.getElementById('errorModalOverlay').style.display = 'none';
        }
    } catch (err) {
        console.error("Status check error", err);
        updateStatusDot('offline');
        
        if (!offlineCheckInterval) {
            showModal('代訂睡覺中', '等睡醒就會恢復正常', false, '', true);
            offlineCheckInterval = setInterval(loadServerStatusDot, 15000);
        }
    }
}

function updateStatusDot(type) {
    const dot = document.getElementById('serverStatusDot');
    if (!dot) return;
    
    let color = '#10b981'; 
    if(type === 'closed') color = '#d81b43'; 
    else if(type === 'preorder') color = '#d68910'; 
    else if(type === 'busy') color = '#2980b9'; 
    else if(type === 'connecting') color = '#ddd'; 
    else if(type === 'offline') color = '#000000'; 
    
    dot.style.backgroundColor = color;
    dot.title = "系統狀態: " + type;
}

<script>
// ==========================================

// 1. Address Format Checker (Disabled — rely 100% on Uber candidate mechanism)

                    if (child.style.display === 'flex' || child.style.display === 'block' || child.style.display === '') {
