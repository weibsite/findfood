<script>


// New specific function to handle delivery method toggle since we hid the original select
function setDeliveryMethod(method) {
    const sel = document.getElementById('deliveryMethod');
    if(sel) {
        sel.value = method;
        sel.dispatchEvent(new Event('change')); // Trigger any bound listeners
    }
    localStorage.setItem('userDeliveryMethod', method);
    if (method === '當面點交') {
        document.getElementById('btnMethodFace').className = 'active';
        document.getElementById('btnMethodDoor').className = 'inactive';
    } else {
        document.getElementById('btnMethodFace').className = 'inactive';
        document.getElementById('btnMethodDoor').className = 'active';
    }
}



// Robust Hero Banner toggle logic
window.revealSubSections = function() {
    document.getElementById('subSections').style.display = 'block';
    setTimeout(() => { document.getElementById('subSections').style.opacity = '1'; }, 50);
    
    const heroBtns = document.getElementById('heroActionButtons');
    if (heroBtns && heroBtns.style.display !== 'none') {
        heroBtns.style.opacity = '0';
        setTimeout(() => { heroBtns.style.display = 'none'; }, 300);
    }
    
    const heroBanner = document.getElementById('heroBanner');
    if (heroBanner && !heroBanner.classList.contains('shrunk')) {
        heroBanner.classList.add('shrunk');
        Array.from(heroBanner.children).forEach(child => {
            if (child.tagName !== 'IMG' && child.id !== 'heroBackBtn' && !child.hasAttribute('data-keep')) {
                child.style.transition = 'opacity 0.3s ease';
                child.style.opacity = '0';
                child.style.pointerEvents = 'none';
                setTimeout(() => { child.dataset.oldDisplay = child.style.display; child.style.display = 'none'; }, 300);
            }
        });
        heroBanner.style.transition = 'padding 0.3s ease';
        heroBanner.style.paddingTop = '10px';
        heroBanner.style.paddingBottom = '60px'; 
    }
    
    const section = document.getElementById('addrSection');
    if(section) {
        section.style.background = '#fff';
        section.style.borderColor = '#f0f0f0';
    }
}

// Override handleAddrBlur to properly restore
window.handleAddrBlur = function() {
    scrollAddrToEnd();
    clearTimeout(window.addrDebounceTimer);
    const q = document.getElementById('addrInput').value.trim();
    if (q) {
      searchAddress(false);
    }
    
    setTimeout(() => {
        const addrInput = document.getElementById('addrInput');
        if(!isAddressSet && addrInput && addrInput.value.trim() === '') {
            const heroBtns = document.getElementById('heroActionButtons');
            if (heroBtns) { heroBtns.style.display = 'flex'; setTimeout(() => { heroBtns.style.opacity = '1'; }, 50); }
            const qWrapper = document.querySelector('.search-modern-input-wrapper');
            if (qWrapper) qWrapper.style.display = 'flex';
            const sTitle = document.querySelector('.search-food-card > div:first-child');
            if (sTitle) sTitle.style.display = 'flex';
            const hb = document.querySelector('.hero-banner');
            if (hb) { hb.style.opacity = '1'; hb.style.pointerEvents = 'auto'; hb.style.height = 'auto'; hb.style.overflow = 'visible'; }
            const logo = document.querySelector('.logo2');
            if (logo) { logo.style.top = '45px'; logo.style.opacity = '1'; }
            
            document.getElementById('addrResults').innerHTML = '';
            document.getElementById('addrStatus').innerText = '';
            updateAddrTitleState('default');
        }
    }, 250);
};

</script>
